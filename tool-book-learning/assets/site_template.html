<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#070b14; --bg2:#0b1322; --panel:rgba(255,255,255,.038); --panel2:rgba(255,255,255,.065);
  --line:rgba(255,255,255,.09); --text:#e8eefb; --muted:#93a6c4; --dim:#6b7f9e;
  --a1:#38bdf8; --a2:#818cf8; --a3:#c084fc; --ok:#34d399; --warn:#fbbf24;
  --codebg:#08101d; --shadow:0 18px 40px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg:#f4f7fc; --bg2:#ffffff; --panel:#ffffff; --panel2:#f0f4fb;
  --line:rgba(15,23,42,.11); --text:#0e172a; --muted:#5b6b85; --dim:#8494ad;
  --a1:#0ea5e9; --a2:#6366f1; --a3:#a855f7; --ok:#10b981; --warn:#d97706;
  --codebg:#f2f5fb; --shadow:0 12px 28px rgba(15,23,42,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1100px 560px at 8% -8%, rgba(56,189,248,.16), transparent 62%),
    radial-gradient(900px 480px at 100% 2%, rgba(168,85,247,.14), transparent 58%),
    radial-gradient(800px 600px at 50% 110%, rgba(52,211,153,.08), transparent 60%);
}
html[data-theme="light"] body::before{
  background:
    radial-gradient(1000px 520px at 8% -8%, rgba(14,165,233,.10), transparent 62%),
    radial-gradient(900px 460px at 100% 0%, rgba(168,85,247,.10), transparent 58%);
}
a{color:inherit}
code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,"Cascadia Code","Courier New",monospace}

/* ---------- 顶栏& 进度 ---------- */
.topbar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1500px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:14px}
.tb-title{font-weight:700;font-size:14px;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-spacer{flex:1}
.tb-tools{display:flex;gap:6px}
.tb-prog{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer;transition:.18s}
.icon-btn:hover{border-color:var(--a1);color:var(--a1)}
.progress{height:2px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));transition:width .3s}

/* ---------- 布局 ---------- */
.app{position:relative;z-index:1;max-width:1500px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:0}
.sidebar{position:sticky;top:53px;align-self:start;height:calc(100vh - 53px);overflow:auto;padding:20px 14px 40px;border-right:1px solid var(--line)}
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.brand{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  background:linear-gradient(92deg,var(--a1),var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px}
.search-wrap{position:relative;margin-bottom:14px}
#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13.5px;outline:none}
#q:focus{border-color:var(--a1);box-shadow:0 0 0 3px color-mix(in srgb,var(--a1) 16%,transparent)}
#qcount{display:block;margin-top:6px;font-size:11.5px;color:var(--dim);min-height:16px}
.nav{display:flex;flex-direction:column;gap:1px}

/* 章→节 两级目录 */
.nav-ch{border-radius:9px}
.nav-item{display:flex;gap:9px;align-items:baseline;padding:8px 10px;border-radius:9px;text-decoration:none;font-size:13.5px;color:var(--muted);border-left:2px solid transparent;transition:.15s}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:var(--panel2);color:var(--text);border-left-color:var(--a1)}
.nav-num{font-size:11.5px;color:var(--dim);flex:0 0 auto;font-variant-numeric:tabular-nums}
.nav-item.done .nav-num{color:var(--ok)}
.nav-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.nav-ch-count{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.nav-ch.done-all .nav-ch-count{color:var(--ok)}
.nav-arrow{flex:0 0 auto;font-size:9px;color:var(--dim);transition:transform .18s;transform:rotate(0deg)}
.nav-ch.open .nav-arrow{transform:rotate(90deg)}
.nav-secs{display:none;flex-direction:column;gap:1px;margin:2px 0 6px 14px;padding-left:8px;border-left:1px solid var(--line)}
.nav-ch.open .nav-secs{display:flex}
.nav-sec{display:flex;gap:7px;align-items:baseline;padding:5px 9px;border-radius:7px;text-decoration:none;font-size:12.5px;color:var(--dim);transition:.15s}
.nav-sec:hover{background:var(--panel);color:var(--text)}
.nav-sec.active{background:var(--panel2);color:var(--a1)}
.nav-sec-hit{color:var(--warn)}
.nav-sec-num{font-variant-numeric:tabular-nums;flex:0 0 auto}
.nav-sec-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.side-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);line-height:1.7}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:10.5px;background:var(--panel2)}
/* 正文列宽：默认限宽 860px（≈50 个汉字/行，长文才看得住），body.wide 放开全宽 */
.main{min-width:0;padding:8px 30px 80px;
  /* ⚠ zoom 只能加在 .main，绝不能加 body —— body 缩放会连带缩放 sticky 顶栏，
     导致按钮命中区偏移、点击错位（Playwright 实测复现过）。 */
  zoom:var(--zoom,1)}
.hero,.chapter{max-width:860px;margin-left:auto;margin-right:auto}
body.wide .hero,body.wide .chapter{max-width:none}

/* ---------- Hero ---------- */
.hero{padding:44px 0 26px;border-bottom:1px solid var(--line);margin-bottom:30px}
.hero-tag{display:inline-block;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;padding:4px 11px;border-radius:99px;
  border:1px solid var(--line);color:var(--a1);background:var(--panel);margin-bottom:16px}
.hero h1{margin:0 0 12px;font-size:clamp(28px,4.2vw,44px);line-height:1.18;letter-spacing:-.5px;font-weight:800;
  background:linear-gradient(96deg,var(--text) 10%,var(--a1) 50%,var(--a3) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{margin:0 0 14px;font-size:16px;color:var(--muted);max-width:760px}
.meta{font-size:12.5px;color:var(--dim)}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 0}
.stat{flex:1 1 150px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums;
  background:linear-gradient(92deg,var(--a1),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--muted)}
.hero-tips{margin-top:18px;font-size:12.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px}

/* ---------- 章节 ---------- */
.chapter{scroll-margin-top:70px;margin-bottom:56px}
.ch-head{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.ch-num{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--a1);
  border:1px solid color-mix(in srgb,var(--a1) 40%,transparent);border-radius:6px;padding:2px 9px;margin-bottom:10px}
.ch-head h2{margin:0 0 8px;font-size:26px;letter-spacing:-.3px;line-height:1.3}
.ch-sub{margin:0 0 10px;color:var(--muted);font-size:14.5px;max-width:820px}
.ch-meta{font-size:12px;color:var(--dim)}
.ch-prog{margin-top:10px;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--dim)}
.ch-prog .bar{flex:1;max-width:220px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.ch-prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--a1));transition:width .3s}
.ch-prog .bar.full i{background:var(--ok)}
.ch-prog b{color:var(--ok);font-variant-numeric:tabular-nums}
.chapter.pending .ch-pending{border:1px dashed var(--line);border-radius:14px;padding:22px;background:var(--panel)}
.chapter.pending h2{margin:4px 0 6px;font-size:20px;color:var(--muted)}
.pending-tip{margin:0;font-size:12.5px;color:var(--dim)}
.sec{margin-bottom:26px;scroll-margin-top:70px}
.sec-title{margin:0 0 18px;font-size:20px;font-weight:800;padding:0 0 0 14px;
  border-left:3px solid var(--a2);line-height:1.45;letter-spacing:-.2px}

/* ---------- 正文小节：多栏卡片读长文像“散点”，改为单栏线性流（编号 + 标题 + 段落） ---------- */
.cards{display:block;margin:0}
.card{position:relative;margin:0 0 30px;padding:2px 16px 6px;background:transparent;
  border:0;border-left:2px solid color-mix(in srgb,var(--a2) 28%,transparent);
  border-radius:0 12px 12px 0;transition:background .18s,border-color .18s}
.card:hover{background:color-mix(in srgb,var(--panel2) 45%,transparent);
  border-left-color:color-mix(in srgb,var(--a2) 65%,transparent)}
.card-top{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px}
.card-top h4{margin:0;font-size:17px;line-height:1.5;flex:1;font-weight:700;letter-spacing:.1px}
.cn{display:inline-block;margin-right:9px;font-size:12.5px;font-weight:800;color:var(--a1);
  font-variant-numeric:tabular-nums;vertical-align:1.5px;letter-spacing:.2px}
.done-btn{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:transparent;
  color:var(--dim);cursor:pointer;font-size:12px;line-height:1;transition:.18s;opacity:.55}
.done-btn:hover{border-color:var(--ok);color:var(--ok);opacity:1}
.card.done{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 5%,transparent)}
.card.done .done-btn{background:var(--ok);color:#04120c;border-color:var(--ok);opacity:1}
.card.done .cn{color:var(--ok)}
/* 正文排版：用主文字色（灰字读长文累眼），行高放松，段间留白才算“分段” */
.card-body{font-size:16px;color:color-mix(in srgb,var(--text) 94%,transparent);line-height:1.92;
  /* 中文长段落与长URL 的折行处理：不然一行拉到天荒地老，眼睛得横着扫 */
  overflow-wrap:break-word;word-break:break-word}
.card-body p{margin:0 0 .9em}
.card-body p:last-child{margin-bottom:0}
/* 正文强调：加粗即重点，用字色 + 字重双重区分 */
.card-body strong{color:var(--text);font-weight:700}
.card-body .para{font-size:16px;line-height:1.92}
.ch-sub,.para,.at{overflow-wrap:break-word;word-break:break-word}
/* 搜索命中隐藏：覆盖面必须包含 tr / qa / code-block / panel，见 scripts/verify_site.py 注释 */
.card.hide,.sec.hide,.chapter.hide,.panel.hide,.qa.hide,.code-block.hide,.tbl-wrap.hide{display:none}
.panel.concepts tbody tr.hide{display:none}
mark{background:color-mix(in srgb,var(--warn) 30%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.para{margin:0 0 .9em}
.sec .para{font-size:16px;line-height:1.92}
.panel-body .para{font-size:15.5px;line-height:1.88}

/* ---------- 列表 / 表格 / 代码 ---------- */
.ul,.lst{margin:0 0 12px;padding-left:22px}
.lst li{margin:5px 0;line-height:1.88}
.lst .li.sub{margin-left:16px;color:var(--dim);font-size:14px}
/* 自带序号（第一，/ ① / 路径二·）的要点列表：去掉项目符号，避免「• 第二，」双重计数 */
.lst.ord{list-style:none;padding-left:0}
.lst.ord li{margin:6px 0}
.lst.ord .li.sub{margin-left:14px}
.lst.ord .ordn{margin-right:3px;font-weight:700;color:color-mix(in srgb,var(--a1) 76%,var(--text));font-variant-numeric:tabular-nums}
.tbl-wrap{margin:0 0 14px;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tbl-cap{padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--a1);border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.72}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel2);font-weight:700;color:var(--text);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
/* 斑马纹：长表格的行列必须可分辨，否则读错行是常事 */
tbody tr:nth-child(even){background:color-mix(in srgb,var(--panel2) 55%,transparent)}
tbody tr:hover{background:var(--panel2)}
::selection{background:color-mix(in srgb,var(--a1) 32%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:content-box}
.code-block{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--codebg)}
.code-head{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.lang{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--a3);font-weight:700}
.copy-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:3px 9px;font-size:11.5px;cursor:pointer}
.copy-btn:hover{border-color:var(--a1);color:var(--a1)}
.code-cap{padding:8px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px dashed var(--line)}
pre{margin:0;padding:14px 0;overflow-x:auto;font-size:12.8px;line-height:1.65}
pre code{color:var(--text);display:block}
/* 代码行号（JS 拆 span，用 CSS counter 编号） */
pre code.has-ln .code-line{display:block;padding-left:52px;position:relative;min-height:1.65em}
pre code.has-ln .code-line::before{
  content:attr(data-ln);position:absolute;left:0;width:36px;text-align:right;
  color:var(--dim);opacity:.5;font-variant-numeric:tabular-nums;user-select:none;
}
/* 长代码折叠 */
.code-block.fold pre{max-height:400px;overflow:hidden}
.code-fade{position:absolute;left:0;right:0;bottom:0;height:90px;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--codebg))}
.code-fold{position:relative;text-align:center;padding:6px;border-top:1px solid var(--line);background:var(--panel)}
.code-fold button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:3px 12px;font-size:12px;cursor:pointer}
.code-fold button:hover{border-color:var(--a1);color:var(--a1)}
.code-block.fold{position:relative}

/* ---------- 面板 ---------- */
.panel{margin:0 0 24px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.panel-title{margin:0;padding:12px 18px;font-size:14.5px;font-weight:800;letter-spacing:.5px;
  border-bottom:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;gap:8px}
.panel-body{padding:16px 18px}
.panel.concepts .panel-title{color:var(--a1)}
.panel.code .panel-title{color:var(--a3)}
.panel.pitfalls .panel-title{color:var(--warn)}
.panel.quiz .panel-title{color:var(--a2)}
.panel.takeaways .panel-title{color:var(--ok)}
.panel.pitfalls .lst li::marker{content:"⚠  "}
.panel.takeaways .lst li::marker{content:"✦  "}
.quiz-acts{margin-left:auto;display:flex;gap:6px}
.quiz-acts button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:2px 9px;font-size:11.5px;cursor:pointer}
.quiz-acts button:hover{border-color:var(--a2);color:var(--a2)}

/* ---------- 自测 ---------- */
.qa-list{display:flex;flex-direction:column;gap:10px}
.qa{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--panel2)}
.q{display:flex;gap:10px;align-items:flex-start}
.qb,.ab{flex:0 0 auto;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11.5px;font-weight:800}
.qb{background:color-mix(in srgb,var(--a2) 22%,transparent);color:var(--a2)}
.ab{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.qt,.at{font-size:15px;flex:1;line-height:1.82}
.ans-btn{margin:9px 0 0 32px;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer}
.ans-btn:hover{border-color:var(--ok);color:var(--ok)}
.a{display:none;margin-top:10px;align-items:flex-start;gap:10px}
.qa.open .a{display:flex}
.qa.open .ans-btn{display:none}

/* ---------- 其他 ---------- */
.empty-tip{display:none;padding:40px 0;color:var(--dim);text-align:center}
.menu-btn{display:none;position:fixed;left:14px;bottom:20px;z-index:70;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--line);background:var(--bg2);color:var(--text);font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
.top-btn{display:none;position:fixed;right:20px;bottom:24px;z-index:70;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--bg2);color:var(--text);font-size:16px;cursor:pointer;box-shadow:var(--shadow)}
.top-btn.show{display:block}
/* 恢复阅读位置提示条 */
.resume-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120%);z-index:80;
  display:flex;align-items:center;gap:12px;padding:9px 16px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg2);box-shadow:var(--shadow);font-size:12.5px;color:var(--muted);
  transition:transform .3s;max-width:min(90vw,520px)}
.resume-toast.show{transform:translate(-50%,0)}
.resume-toast b{color:var(--a1);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume-toast button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:2px 9px;font-size:11.5px;cursor:pointer;flex:0 0 auto}
.resume-toast button:hover{border-color:var(--a1);color:var(--a1)}
footer{padding:30px 0 0;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:53px 30% 0 0;z-index:50;background:var(--bg2);transform:translateX(-102%);
    transition:transform .25s;height:calc(100vh - 53px);box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .main{padding:8px 16px 70px}
  .menu-btn{display:block}
  /* 窄屏：小节留白收紧、字号略降，避免一屏只看到两三行 */
  .card{margin-bottom:24px;padding:2px 10px 4px}
  .card-body{font-size:15.5px;line-height:1.88}
  .sec-title{font-size:18.5px}
  .top-btn{right:12px;bottom:78px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" id="menuBtn" type="button">☰ 目录</button>
    <div class="tb-title">__TITLE__</div>
    <div class="tb-spacer"></div>
    <div class="tb-prog" id="progText">已掌握 0 / __TOTAL_CARDS__</div>
    <div class="tb-tools">
      <button class="icon-btn" id="fsMinus" type="button" title="缩小字号（-）">A−</button>
      <button class="icon-btn" id="fsPlus" type="button" title="放大字号（+）">A+</button>
      <button class="icon-btn" id="wideBtn" type="button" title="限宽/宽读排版切换（W）">⇔ 宽读</button>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" title="切换深/浅主题（t）">◐ 主题</button>
  </div>
  <div class="progress"><i id="progBar"></i></div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">Learning Site</div>
    <div class="search-wrap">
      <input id="q" type="search" placeholder="搜索知识点 / 概念表 / 问答 / 代码（按 / ）" autocomplete="off">
      <span id="qcount"></span>
    </div>
    <nav class="nav" id="nav">__NAV__</nav>
    <div class="side-foot">
      点小节标题右侧 ✓ 记录掌握进度，数据存在本机浏览器。<br>
      <span class="kbd">/</span> 搜索 · <span class="kbd">Esc</span> 清空 · <span class="kbd">g</span> 回顶 ·
      <span class="kbd">t</span> 主题 · <span class="kbd">w</span> 宽读 · <span class="kbd">+</span>/<span class="kbd">-</span> 字号 ·
      <span class="kbd">n</span>/<span class="kbd">p</span> 下一/上一节
    </div>
  </aside>

  <main class="main">
    <header class="hero">
      <div class="hero-tag">__HERO_TAG__</div>
      <h1>__TITLE__</h1>
      <p class="hero-sub">__SUBTITLE__</p>
      <div class="meta">__META__</div>
      <div class="stats">__STATS__</div>
      <div class="hero-tips">__HERO_CHIPS__</div>
    </header>

    <div class="content" id="content">__CONTENT__</div>
    <div class="empty-tip" id="emptyTip">没有匹配的知识点，换个关键词试试。</div>
    <footer>__FOOTER__</footer>
  </main>
</div>

<button class="top-btn" id="topBtn" type="button" title="回到顶部（g）">↑</button>
<div class="resume-toast" id="resumeToast">
  <span>上次读到：<b id="resumePos"></b></span>
  <button id="resumeTop" type="button">回到开头</button>
  <button id="resumeClose" type="button">关闭</button>
</div>

<script>
(function(){
  "use strict";
  var SLUG="__SLUG__", TOTAL=parseInt("__TOTAL_CARDS__",10)||0;
  var K_DONE="pbls:"+SLUG+":done", K_THEME="pbls:theme", K_POS="pbls:"+SLUG+":pos";
  var $ = function(s,r){return (r||document).querySelector(s);};
  var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  var root=document.documentElement;
  var chapters=$$(".chapter");

  /* ---------- 主题：localStorage > 系统偏好 > 深色 ---------- */
try{
  var t0=localStorage.getItem(K_THEME);
  if(t0){ root.setAttribute("data-theme",t0); }
  else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches){
    root.setAttribute("data-theme","light");
  }
}catch(e){}
$("#themeBtn").addEventListener("click",function(){
  var next = root.getAttribute("data-theme")==="light" ? "dark":"light";
  root.setAttribute("data-theme",next);
  try{ localStorage.setItem(K_THEME,next); }catch(e){}
});

/* ---------- 字号缩放（只缩正文，不缩顶栏） ---------- */
function readNum(k, d){ try{ var v=parseFloat(localStorage.getItem(k)); return isFinite(v)?v:d; }catch(e){ return d; } }
var zoom = Math.min(1.5, Math.max(0.85, readNum("pbls:"+SLUG+":zoom", 1)));
function applyZoom(){
  document.body.style.setProperty("--zoom", String(zoom));
  try{ localStorage.setItem("pbls:"+SLUG+":zoom", zoom); }catch(e){}
  var pct=Math.round(zoom*100)+"%";
  $("#fsPlus").textContent = zoom>=1.5 ? "A+" : "A+";
  $("#fsMinus").textContent = zoom<=0.85 ? "A−" : "A−";
  $("#fsPlus").title = "当前字号 "+pct+"（最大 150%）";
  $("#fsMinus").title = "当前字号 "+pct+"（最小 85%）";
}
$("#fsPlus").addEventListener("click",function(){
  zoom = Math.min(1.5, Math.round((zoom+0.1)*10)/10); applyZoom();
});
$("#fsMinus").addEventListener("click",function(){
  zoom = Math.max(0.85, Math.round((zoom-0.1)*10)/10); applyZoom();
});

/* ---------- 宽读/限宽排版 ---------- */
var wide = !!readNum("pbls:"+SLUG+":wide", 0);
function applyWide(){
  document.body.classList.toggle("wide", wide);
  try{ localStorage.setItem("pbls:"+SLUG+":wide", wide?1:0); }catch(e){}
  $("#wideBtn").style.color = wide? "var(--a1)" : "";
  $("#wideBtn").style.borderColor = wide? "var(--a1)" : "";
}
$("#wideBtn").addEventListener("click",function(){ wide=!wide; applyWide(); });

  /* ---------- 掌握进度 ---------- */
  var done={};
  try{ done=JSON.parse(localStorage.getItem(K_DONE)||"{}"); }catch(e){ done={}; }

  /* ---------- 自测答案（单题） ---------- */
  document.addEventListener("click",function(ev){
    var b=ev.target.closest ? ev.target.closest(".ans-btn") : null;
    if(!b) return;
    var qa=b.closest(".qa");
    if(qa){ qa.classList.add("open"); qa._manual=true; }
  });

  /* ---------- 复制代码 ---------- */
  document.addEventListener("click",function(ev){
    var b=ev.target.closest ? ev.target.closest(".copy-btn") : null;
    if(!b) return;
    var blk=b.closest(".code-block"); if(!blk) return;
    var pre=blk.querySelector("pre code"); if(!pre) return;
    var txt=pre.innerText, ok=function(){ b.textContent="已复制"; setTimeout(function(){b.textContent="复制";},1400); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok,ok); }
    else{ var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
      try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta); ok(); }
  });

  /* ---------- 自测题：每章全展开 / 全收起 ---------- */
  $$(".panel.quiz").forEach(function(p){
    var t=p.querySelector(".panel-title"); if(!t) return;
    var acts=document.createElement("div"); acts.className="quiz-acts";
    acts.innerHTML='<button type="button" data-act="open">全展开</button><button type="button" data-act="close">全收起</button>';
    t.appendChild(acts);
    acts.addEventListener("click",function(ev){
      var b=ev.target.closest ? ev.target.closest("button") : null; if(!b) return;
      var open = b.getAttribute("data-act")==="open";
      $$(".qa",p).forEach(function(qa){ qa.classList.toggle("open", open); if(open) qa._manual=true; });
    });
  });

  /* ---------- 代码块：行号 + 长块折叠 ---------- */
  $$(".code-block").forEach(function(b){
    var code=b.querySelector("pre code"); if(!code) return;
    var raw=code.innerHTML.split("\n");
    while(raw.length && !raw[0].replace(/\s|&nbsp;|&#160;/g,"")) raw.shift();
    while(raw.length && !raw[raw.length-1].replace(/\s|&nbsp;|&#160;/g,"")) raw.pop();
    if(!raw.length) return;
    code.innerHTML = raw.map(function(l,i){ return '<span class="code-line" data-ln="'+(i+1)+'">'+l+'</span>'; }).join("");
    code.classList.add("has-ln");
    var n=raw.length;
    if(n>24){
      b.classList.add("fold");
      var fade=document.createElement("div"); fade.className="code-fade"; b.appendChild(fade);
      var f=document.createElement("div"); f.className="code-fold";
      var btn=document.createElement("button"); btn.type="button";
      btn.textContent="展开全部（"+n+" 行）";
      f.appendChild(btn); b.appendChild(f);
      btn.addEventListener("click",function(){
        var folded=b.classList.toggle("fold");
        btn.textContent = folded ? ("展开全部（"+n+" 行）") : "收起";
      });
      b._foldBtn=btn;
    }
  });

  /* ---------- 构建 章→节 两级目录（build_site 只出一级，运行时重建） ---------- */
  chapters.forEach(function(ch){
    $$(".sec",ch).forEach(function(s,i){ if(!s.id) s.id=ch.id+"-s"+(i+1); });
  });
  var nav=$("#nav");
  var frag=document.createDocumentFragment();
  chapters.forEach(function(ch){
    var old=nav.querySelector('.nav-item[href="#'+ch.id+'"]');
    var num = old && old.querySelector(".nav-num") ? old.querySelector(".nav-num").textContent : "";
    var title = old && old.querySelector(".nav-title") ? old.querySelector(".nav-title").textContent : ch.id;
    var secHtml=$$(".sec",ch).map(function(s){
      var tt=s.querySelector(".sec-title");
      var txt=tt?tt.textContent:"";
      var m=txt.match(/^([0-9][0-9.]*)\s*(.*)$/);
      var snum=m?m[1]:"", st=m?m[2]:txt;
      return '<a class="nav-sec" href="#'+s.id+'"><span class="nav-sec-num">'+snum+'</span><span class="nav-sec-t">'+st+'</span></a>';
    }).join("");
    var wrap=document.createElement("div");
    wrap.className="nav-ch"; wrap.setAttribute("data-ch",ch.id);
    wrap.innerHTML='<a class="nav-item" href="#'+ch.id+'"><span class="nav-num">'+num+'</span><span class="nav-title">'+title+'</span><span class="nav-ch-count"></span><span class="nav-arrow" title="展开 / 收起本章目录">&#9654;</span></a><div class="nav-secs">'+secHtml+'</div>';
    frag.appendChild(wrap);
  });
  nav.innerHTML=""; nav.appendChild(frag);

  /* ---------- 小节编号：节号沿用笔记自带的 “1.1”，补上小节序号 → 1.1.3 ---------- */
  chapters.forEach(function(ch){
    $$(".sec",ch).forEach(function(s){
      var tt=s.querySelector(".sec-title");
      var m=tt && (tt.textContent||"").match(/^\s*([0-9]+(?:\.[0-9]+)*)/);
      if(!m) return;
      $$(".card",s).forEach(function(c,i){
        var h=c.querySelector(".card-top h4");
        if(!h || h.querySelector(".cn")) return;
        var sp=document.createElement("span");
        sp.className="cn";
        sp.textContent=m[1]+"."+(i+1);
        h.insertBefore(sp,h.firstChild);
      });
    });
  });

  /* ---------- 章头进度条注入 ---------- */
  chapters.forEach(function(ch){
    var head=ch.querySelector(".ch-head"); if(!head) return;
    var prog=document.createElement("div"); prog.className="ch-prog";
    prog.innerHTML='<span class="n">0/0</span><span class="bar"><i></i></span>';
    head.appendChild(prog);
  });

  /* ---------- 目录交互：箭头展开/收起，章链接跳转并展开 ---------- */
  document.addEventListener("click",function(ev){
    var ar=ev.target.closest ? ev.target.closest(".nav-arrow") : null;
    if(ar){ ev.preventDefault(); ev.stopPropagation(); ar.closest(".nav-ch").classList.toggle("open"); return; }
    var it=ev.target.closest ? ev.target.closest(".nav-item") : null;
    if(it){ var w1=it.closest(".nav-ch"); if(w1) w1.classList.add("open"); $("#sidebar").classList.remove("open"); return; }
    var ns=ev.target.closest ? ev.target.closest(".nav-sec") : null;
    if(ns){ var w2=ns.closest(".nav-ch"); if(w2) w2.classList.add("open"); $("#sidebar").classList.remove("open"); }
  });

  /* ---------- 进度同步：卡片 + 章徽标 + 章头进度条 + 顶栏 ---------- */
  function syncDone(){
    var n=0;
    $$(".card").forEach(function(c){
      var id=c.getAttribute("data-id"); if(!id) return;
      if(done[id]) c.classList.add("done"); else c.classList.remove("done");
      if(done[id]) n++;
    });
    chapters.forEach(function(ch){
      var cards=$$(".card",ch), d=0;
      cards.forEach(function(c){ if(done[c.getAttribute("data-id")]) d++; });
      var wrap=nav.querySelector('.nav-ch[data-ch="'+ch.id+'"]');
      var full = cards.length>0 && d===cards.length;
      if(wrap){
        wrap.querySelector(".nav-ch-count").textContent = d+"/"+cards.length;
        wrap.classList.toggle("done-all", full);
        wrap.querySelector(".nav-item").classList.toggle("done", d>0);
      }
      var head=ch.querySelector(".ch-prog");
      if(head && cards.length){
        head.querySelector(".n").innerHTML = d+"/"+cards.length+(full?'<b> ✓</b>':'');
        var bar=head.querySelector(".bar");
        bar.classList.toggle("full", full);
        bar.querySelector("i").style.width = Math.round(d*100/cards.length)+"%";
      }
    });
    var pct = TOTAL? Math.round(n*100/TOTAL):0;
    $("#progText").textContent = "已掌握 "+n+" / "+TOTAL;
    $("#progBar").style.width = pct+"%";
  }
  document.addEventListener("click",function(ev){
    var b=ev.target.closest ? ev.target.closest(".done-btn") : null;
    if(!b) return;
    var card=b.closest(".card"); if(!card) return;
    var id=card.getAttribute("data-id"); if(!id) return;
    if(done[id]) delete done[id]; else done[id]=1;
    try{ localStorage.setItem(K_DONE, JSON.stringify(done)); }catch(e){}
    syncDone();
  });

  /* ---------- scrollspy：章 + 节 双高亮，自动展开当前章 ---------- */
  var spy=[];
  chapters.forEach(function(ch){
    spy.push({el:ch, ch:ch.id, sec:null});
    $$(".sec",ch).forEach(function(s){ spy.push({el:s, ch:ch.id, sec:s.id}); });
  });
  var topBtn=$("#topBtn"), ticking=false;
  function onScroll(){
    if(ticking) return; ticking=true;
    requestAnimationFrame(function(){
      ticking=false;
      var y=140, cur=null;
      spy.forEach(function(o){
        if(o.el.getBoundingClientRect().top<=y) cur=o;
      });
      $$(".nav-sec",nav).forEach(function(a){
        a.classList.toggle("active", !!(cur && cur.sec && a.getAttribute("href")==="#"+cur.sec));
      });
      $$(".nav-ch",nav).forEach(function(w){
        var isCur = !!(cur && w.getAttribute("data-ch")===cur.ch);
        var item=w.querySelector(".nav-item");
        if(item) item.classList.toggle("active", isCur && !cur.sec);
        if(isCur) w.classList.add("open");
      });
      if(topBtn) topBtn.classList.toggle("show", window.scrollY>window.innerHeight);
    });
  }
  window.addEventListener("scroll",onScroll,{passive:true});
  window.addEventListener("resize",onScroll);
  if(topBtn) topBtn.addEventListener("click",function(){ window.scrollTo({top:0,behavior:"smooth"}); });

  /* ---------- 搜索：卡片 / 概念表 / 问答 / 代码块 / 章节标题 ---------- */
  var q=$("#q"), qcount=$("#qcount"), emptyTip=$("#emptyTip");
  function clearMarks(){
    $$("mark").forEach(function(m){ var p=m.parentNode; p.replaceChild(document.createTextNode(m.textContent),m); p.normalize(); });
  }
  function resetHide(){
    $$(".card.hide,.sec.hide,.chapter.hide,.panel.hide,.qa.hide,.code-block.hide,.tbl-wrap.hide")
      .forEach(function(x){ x.classList.remove("hide"); });
    $$(".panel.concepts tbody tr.hide").forEach(function(x){ x.classList.remove("hide"); });
    $$(".nav-sec-hit",nav).forEach(function(a){ a.classList.remove("nav-sec-hit"); });
    $$(".qa.open").forEach(function(qa){ if(!qa._manual) qa.classList.remove("open"); });
  }
  q.addEventListener("input",function(){
    clearMarks();
    var kw=q.value.trim().toLowerCase();
    if(!kw){ resetHide(); qcount.textContent=""; emptyTip.style.display="none"; return; }
    var cnt={card:0,concept:0,qa:0,code:0};
    chapters.forEach(function(ch){
      var loc={card:0,concept:0,qa:0,code:0};
      var h2=ch.querySelector("h2");
      var chHit=!!h2 && (h2.textContent||"").toLowerCase().indexOf(kw)>=0;
      // 先算出每个小节的标题命中标记：卡片判定依赖它，故必须先于卡片执行
      $$(".sec",ch).forEach(function(s){
        var tt=s.querySelector(".sec-title");
        s._secHit=!!tt && tt.textContent.toLowerCase().indexOf(kw)>=0;
      });
      // 卡片命中 = 自身内容 / 章节标题 / 所属小节标题
      // 少了「小节标题」这条，会出现「小节标题搜到了、点进去卡片全是空的」的假象
      $$(".card",ch).forEach(function(c){
        var s=c.closest(".sec");
        var secHit=!!(s && s._secHit);
        var hit=chHit || secHit || (c.getAttribute("data-search")||"").indexOf(kw)>=0;
        c.classList.toggle("hide",!hit); if(hit) loc.card++;
      });
      $$(".sec",ch).forEach(function(s){
        var sHit=s._secHit;
        var vis=s.querySelectorAll(".card:not(.hide)").length;
        s.classList.toggle("hide", vis===0 && !chHit && !sHit);
        var na=nav.querySelector('.nav-sec[href="#'+s.id+'"]');
        if(na) na.classList.toggle("nav-sec-hit", sHit);
      });
      $$(".panel.concepts",ch).forEach(function(p){
        var hits=0;
        $$("tbody tr",p).forEach(function(tr){
          var hit=chHit || tr.textContent.toLowerCase().indexOf(kw)>=0;
          tr.classList.toggle("hide",!hit); if(hit) hits++;
        });
        p.classList.toggle("hide", hits===0 && !chHit);
        loc.concept+=hits;
      });
      $$(".panel.quiz",ch).forEach(function(p){
        var hits=0;
        $$(".qa",p).forEach(function(qa){
          var hit=chHit || qa.textContent.toLowerCase().indexOf(kw)>=0;
          qa.classList.toggle("hide",!hit);
          if(hit){ hits++; if(!qa.classList.contains("open")){ qa.classList.add("open"); qa._manual=false; } }
        });
        p.classList.toggle("hide", hits===0 && !chHit);
        loc.qa+=hits;
      });
      $$(".panel.code",ch).forEach(function(p){
        var hits=0;
        $$(".code-block",p).forEach(function(cb){
          var hit=chHit || cb.textContent.toLowerCase().indexOf(kw)>=0;
          cb.classList.toggle("hide",!hit);
          if(hit){
            hits++;
            if(cb.classList.contains("fold") && cb._foldBtn){ cb.classList.remove("fold"); cb._foldBtn.textContent="收起"; }
          }
        });
        p.classList.toggle("hide", hits===0 && !chHit);
        loc.code+=hits;
      });
      ch.classList.toggle("hide", loc.card+loc.concept+loc.qa+loc.code===0 && !chHit);
      cnt.card+=loc.card; cnt.concept+=loc.concept; cnt.qa+=loc.qa; cnt.code+=loc.code;
    });
    var total=cnt.card+cnt.concept+cnt.qa+cnt.code;
    var parts=[];
    if(cnt.card) parts.push("卡"+cnt.card);
    if(cnt.concept) parts.push("概念"+cnt.concept);
    if(cnt.qa) parts.push("问答"+cnt.qa);
    if(cnt.code) parts.push("代码"+cnt.code);
    qcount.textContent = total? parts.join(" · ") : "无匹配";
    emptyTip.style.display = total? "none":"block";
  });

  /* ---------- 阅读位置记忆 ---------- */
  var saveT;
  window.addEventListener("scroll",function(){
    clearTimeout(saveT);
    saveT=setTimeout(function(){
      try{ localStorage.setItem(K_POS, JSON.stringify({y:window.scrollY, t:Date.now()})); }catch(e){}
    },300);
  },{passive:true});
  var saved=null;
  try{ saved=JSON.parse(localStorage.getItem(K_POS)||"null"); }catch(e){ saved=null; }
  var toast=$("#resumeToast");
  if(saved && saved.y>600 && Date.now()-saved.t<14*86400000 && toast){
    window.scrollTo(0,saved.y);
    var curCh=null;
    chapters.forEach(function(c){
      if(c.getBoundingClientRect().top+window.scrollY<=saved.y+140) curCh=c;
    });
    var h2=curCh&&curCh.querySelector("h2");
    var posEl=$("#resumePos"); if(posEl) posEl.textContent = h2?h2.textContent:"";
    toast.classList.add("show");
    var rb=$("#resumeTop"); if(rb) rb.addEventListener("click",function(){ window.scrollTo({top:0,behavior:"smooth"}); });
    var rc=$("#resumeClose");
    function hideToast(){ toast.classList.remove("show"); }
    if(rc) rc.addEventListener("click",hideToast);
    setTimeout(hideToast,6000);
  }

  /* ---------- 快捷键 ---------- */
  document.addEventListener("keydown",function(e){
    var typing = e.target && (e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA");
    if(e.key==="/" && !typing){ e.preventDefault(); q.focus(); return; }
    if(e.key==="Escape" && document.activeElement===q){ q.value=""; q.dispatchEvent(new Event("input")); q.blur(); return; }
    if(typing) return;
    var k=e.key.toLowerCase();
    if(k==="g"){ window.scrollTo({top:0,behavior:"smooth"}); }
    else if(k==="t"){ $("#themeBtn").click(); }
    else if(k==="w"){ $("#wideBtn").click(); }
    else if(e.key==="+"||e.key==="="){ $("#fsPlus").click(); }
    else if(e.key==="-"||e.key==="_"){ $("#fsMinus").click(); }
    else if(k==="n"||k==="p"){
      var secs=$$(".sec"), y=160, idx=-1;
      for(var i=0;i<secs.length;i++){ if(secs[i].getBoundingClientRect().top<=y) idx=i; }
      var tgt = (k==="n") ? secs[Math.min(idx+1, secs.length-1)] : secs[Math.max(idx-1,0)];
      if(tgt) tgt.scrollIntoView({behavior:"smooth",block:"start"});
    }
  });

  /* ---------- 窄屏侧栏 ---------- */
  var menuBtn=$("#menuBtn");
  if(menuBtn) menuBtn.addEventListener("click",function(){ $("#sidebar").classList.toggle("open"); });

  applyZoom(); applyWide();
  syncDone(); onScroll();
})();
</script>
</body>
</html>
