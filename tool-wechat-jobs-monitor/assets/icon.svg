<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5bd7"/>
      <stop offset="1" stop-color="#1b3a99"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ea6ff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="224" height="224" rx="52" fill="url(#bg)"/>
  <!-- 信封主体：代表日报邮件 -->
  <rect x="46" y="74" width="148" height="98" rx="14" fill="#ffffff" opacity="0.96"/>
  <path d="M52 86 L120 132 L188 86" fill="none" stroke="url(#acc)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 顶部监听波纹：代表"监听" -->
  <circle cx="120" cy="52" r="9" fill="#cfe0ff"/>
  <path d="M92 46 a40 40 0 0 1 56 0" fill="none" stroke="#cfe0ff" stroke-width="7"
        stroke-linecap="round" opacity="0.85"/>
  <path d="M74 36 a64 64 0 0 1 92 0" fill="none" stroke="#cfe0ff" stroke-width="7"
        stroke-linecap="round" opacity="0.5"/>
  <!-- 底部三条信息横线 -->
  <rect x="70" y="150" width="100" height="7" rx="3.5" fill="#2f5bd7" opacity="0.85"/>
  <rect x="70" y="150" width="100" height="7" rx="3.5" fill="#2f5bd7" opacity="0"/>
</svg>
