<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241046"/>
      <stop offset="0.55" stop-color="#4B1FA8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.16" r="0.95">
      <stop offset="0" stop-color="#D4B4FF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#D4B4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect width="240" height="240" rx="54" fill="url(#glow)"/>

  <!-- 四个图型瓦片 -->
  <rect x="38" y="38" width="76" height="76" rx="18" fill="#FFFFFF" fill-opacity="0.13"
        stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="126" y="38" width="76" height="76" rx="18" fill="#FFFFFF" fill-opacity="0.13"
        stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="38" y="126" width="76" height="76" rx="18" fill="#FFFFFF" fill-opacity="0.13"
        stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="126" y="126" width="76" height="76" rx="18" fill="#FFFFFF" fill-opacity="0.13"
        stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1"/>

  <!-- 左上一：时序图（双生命线 + 消息箭头） -->
  <path d="M60 54 L60 98 M92 54 L92 98" stroke="#FFFFFF" stroke-opacity="0.45"
        stroke-width="3" stroke-linecap="round"/>
  <rect x="60" y="62.5" width="32" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="60" y="74.5" width="32" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="60" y="86.5" width="32" height="3" rx="1.5" fill="#D4B4FF"/>

  <!-- 右上一：部署拓扑（区域 / 可用区 / 实例 三层嵌套） -->
  <rect x="136" y="48" width="56" height="56" rx="10" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="3"/>
  <rect x="145" y="57" width="38" height="38" rx="7" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="3"/>
  <rect x="154" y="66" width="20" height="20" rx="5" fill="#D4B4FF"/>

  <!-- 左下一：组件依赖（两个组件 + 依赖箭头） -->
  <rect x="50" y="132" width="22" height="16" rx="5" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="80" y="180" width="22" height="16" rx="5" fill="#FFFFFF" fill-opacity="0.62"/>
  <path d="M72 148 L83 180" stroke="#FFFFFF" stroke-opacity="0.70"
        stroke-width="3" stroke-linecap="round"/>

  <!-- 右下一：管道流程（节点 + 连线推进） -->
  <rect x="134" y="157" width="14" height="14" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="157" y="157" width="14" height="14" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="180" y="157" width="14" height="14" rx="4" fill="#D4B4FF"/>
  <rect x="149" y="162" width="7" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="172" y="162" width="7" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
