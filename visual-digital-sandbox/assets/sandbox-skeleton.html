<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
  :root{
    --bg:#04080f; --bg2:#071320;
    --glass:rgba(10,24,38,.72); --glass-2:rgba(8,20,32,.86);
    --line:rgba(96,190,230,.18); --line-2:rgba(96,190,230,.34);
    --ink:#dff2fb; --ink-2:#8fb2c6; --ink-3:#5d7d90;
    --cy:#35e0ff; --cy-dim:rgba(53,224,255,.16);
    --vi:#7c8cff; --ok:#37e0a6; --warn:#ffb23f; --alarm:#ff5a5f;
    --r:10px; --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 780px at 50% -12%,#0b2233 0%,#050b14 46%,#03070c 100%);
    color:var(--ink);
    font:14px/1.5 "PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #app{position:fixed; inset:0}
  #stage{position:absolute; inset:0}
  #stage canvas{display:block; width:100%; height:100%}
  #labels{position:absolute; inset:0; pointer-events:none; overflow:hidden}

  /* ── 场景标签 ───────────────────────────── */
  .sb-tag{
    position:absolute; transform:translate(-50%,-100%);
    padding:2px 7px 3px; border-radius:5px;
    font-size:11px; letter-spacing:.02em; white-space:nowrap;
    color:#cfe9f6; background:rgba(6,18,29,.72);
    border:1px solid rgba(96,190,230,.22);
    backdrop-filter:blur(3px);
    opacity:0; transition:opacity .28s var(--ease);
    will-change:transform;
  }
  .sb-tag.on{opacity:1}
  .sb-tag::after{
    content:""; position:absolute; left:50%; bottom:-5px; width:1px; height:5px;
    background:rgba(96,190,230,.4); transform:translateX(-50%);
  }
  .sb-tag.warn{border-color:rgba(255,178,63,.6); color:#ffd79a}
  .sb-tag.alarm{border-color:rgba(255,90,95,.7); color:#ffc0c2}
  .sb-tag.sel{border-color:var(--cy); color:#bff3ff; box-shadow:0 0 12px rgba(53,224,255,.28)}

  /* ── 通用玻璃面板 ───────────────────────── */
  .pane{
    position:absolute; background:var(--glass); backdrop-filter:blur(10px) saturate(1.1);
    border:1px solid var(--line); border-radius:var(--r);
    box-shadow:0 18px 44px -22px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.045);
  }
  .pane::before,.pane::after{
    content:""; position:absolute; width:11px; height:11px; pointer-events:none;
    border-color:var(--line-2); border-style:solid;
  }
  .pane::before{left:-1px; top:-1px; border-width:1px 0 0 1px; border-radius:var(--r) 0 0 0}
  .pane::after{right:-1px; bottom:-1px; border-width:0 1px 1px 0; border-radius:0 0 var(--r) 0}

  .pane-h{
    display:flex; align-items:center; gap:8px;
    padding:10px 13px 9px; border-bottom:1px solid rgba(96,190,230,.1);
    font-size:11px; letter-spacing:.16em; color:var(--ink-3); text-transform:uppercase;
  }
  .pane-h b{color:var(--ink-2); font-weight:600; letter-spacing:.1em}
  .pane-h .dot{width:5px; height:5px; border-radius:50%; background:var(--cy); box-shadow:0 0 8px var(--cy)}
  .pane-b{padding:11px 13px 13px}

  /* ── 标题组 ─────────────────────────────── */
  #hud-top{left:26px; top:22px; min-width:330px; padding:15px 20px 14px}
  #hud-top .rule{height:1px; margin:10px 0 9px; background:linear-gradient(90deg,var(--cy),rgba(53,224,255,0))}
  #sb-title{font-size:21px; font-weight:600; letter-spacing:.045em; line-height:1.25}
  #sb-sub{margin-top:3px; font-size:10.5px; letter-spacing:.24em; color:var(--ink-3); text-transform:uppercase}
  #hud-meta{display:flex; align-items:center; gap:9px; font-size:11px; color:var(--ink-2)}
  #sb-badge{
    padding:2px 8px; border-radius:999px; font-size:10px; letter-spacing:.08em;
    color:var(--cy); background:var(--cy-dim); border:1px solid rgba(53,224,255,.3);
  }
  #sb-clock{color:var(--ink-2); font-variant-numeric:tabular-nums}
  #sb-mode{
    padding:2px 8px; border-radius:999px; font-size:10px; letter-spacing:.06em;
    color:var(--warn); background:rgba(255,178,63,.12); border:1px solid rgba(255,178,63,.3);
  }
  #sb-mode.ok{color:var(--ok); background:rgba(55,224,166,.1); border-color:rgba(55,224,166,.3)}

  /* ── 图层 ───────────────────────────────── */
  #hud-left{left:26px; top:170px; width:206px}
  .layer{
    display:flex; align-items:center; gap:9px; padding:7px 4px; border-radius:7px;
    cursor:pointer; transition:background .18s var(--ease);
    -webkit-user-select:none; user-select:none;
  }
  .layer:hover{background:rgba(96,190,230,.07)}
  .layer .sw{
    position:relative; width:26px; height:14px; border-radius:999px; flex:0 0 auto;
    background:rgba(255,255,255,.1); transition:background .22s var(--ease);
  }
  .layer .sw::after{
    content:""; position:absolute; left:2px; top:2px; width:10px; height:10px; border-radius:50%;
    background:#5d7d90; transition:transform .22s var(--ease), background .22s var(--ease);
  }
  .layer.on .sw{background:rgba(53,224,255,.28)}
  .layer.on .sw::after{transform:translateX(12px); background:var(--cy); box-shadow:0 0 8px var(--cy)}
  .layer .nm{flex:1; font-size:12.5px; color:var(--ink-2); transition:color .18s}
  .layer.on .nm{color:var(--ink)}
  .layer .ct{font-size:10.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}
  .layer .bar{position:absolute; left:0; width:2px; height:0; border-radius:2px; background:var(--cy); transition:height .22s}

  /* ── 右侧检视 ───────────────────────────── */
  #hud-right{right:26px; top:22px; width:290px}
  #kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .kpi{
    padding:9px 10px; border-radius:8px; background:rgba(53,224,255,.045);
    border:1px solid rgba(96,190,230,.12);
  }
  .kpi .lb{font-size:10.5px; color:var(--ink-3); letter-spacing:.04em}
  .kpi .vl{margin-top:3px; font-size:19px; font-weight:600; letter-spacing:.01em; font-variant-numeric:tabular-nums; line-height:1.15}
  .kpi .vl small{margin-left:3px; font-size:10.5px; font-weight:400; color:var(--ink-3)}
  .kpi .tr{margin-top:2px; font-size:10px; color:var(--ok)}
  .kpi .tr.dn{color:var(--alarm)}

  #inspector{margin-top:11px; border-top:1px dashed rgba(96,190,230,.14); padding-top:10px}
  #ins-empty{font-size:11.5px; color:var(--ink-3); line-height:1.7; padding:2px 0 4px}
  #ins-body{display:none}
  #ins-body.on{display:block; animation:fadeUp .26s var(--ease)}
  @keyframes fadeUp{from{opacity:0; transform:translateY(5px)}to{opacity:1; transform:none}}
  #ins-name{font-size:15px; font-weight:600; letter-spacing:.02em}
  #ins-type{margin-top:2px; font-size:10.5px; letter-spacing:.12em; color:var(--ink-3); text-transform:uppercase}
  #ins-metrics{margin-top:9px; display:flex; flex-direction:column; gap:7px}
  .mt .mt-h{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-2)}
  .mt .mt-h b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
  .mt .mt-t{margin-top:4px; height:3px; border-radius:2px; background:rgba(255,255,255,.08); overflow:hidden}
  .mt .mt-f{height:100%; border-radius:2px; background:linear-gradient(90deg,var(--cy),var(--vi)); transition:width .45s var(--ease)}
  .st{display:inline-flex; align-items:center; gap:5px; padding:2px 7px; border-radius:5px; font-size:10.5px}
  .st::before{content:""; width:5px; height:5px; border-radius:50%; background:currentColor; box-shadow:0 0 7px currentColor}
  .st.normal{color:var(--ok); background:rgba(55,224,166,.1)}
  .st.warn{color:var(--warn); background:rgba(255,178,63,.1)}
  .st.alarm{color:var(--alarm); background:rgba(255,90,95,.12)}
  .st.off{color:var(--ink-3); background:rgba(255,255,255,.05)}

  #alarm-wrap{margin-top:11px; border-top:1px dashed rgba(96,190,230,.14); padding-top:9px}
  #alarm-list{display:flex; flex-direction:column; gap:5px; max-height:132px; overflow:auto}
  .al{display:flex; gap:7px; align-items:flex-start; padding:5px 7px; border-radius:6px; font-size:11px; line-height:1.45;
      background:rgba(255,255,255,.03); cursor:pointer; transition:background .16s}
  .al:hover{background:rgba(255,255,255,.07)}
  .al .i{width:5px; height:5px; border-radius:50%; margin-top:5px; flex:0 0 auto}
  .al.critical .i{background:var(--alarm); box-shadow:0 0 8px var(--alarm)}
  .al.warning .i{background:var(--warn); box-shadow:0 0 8px var(--warn)}
  .al .tx{flex:1; color:var(--ink-2)}
  .al .tm{color:var(--ink-3); font-size:10px; font-variant-numeric:tabular-nums}

  /* ── 底部时间轴 ─────────────────────────── */
  #hud-bottom{left:50%; bottom:24px; transform:translateX(-50%); width:min(560px,52vw); padding:10px 16px 12px}
  #tl-row{display:flex; align-items:center; gap:12px}
  #tl-play{
    width:30px; height:30px; flex:0 0 auto; border-radius:50%; cursor:pointer;
    border:1px solid rgba(53,224,255,.36); background:rgba(53,224,255,.1);
    color:var(--cy); display:flex; align-items:center; justify-content:center;
    transition:background .18s, transform .18s;
  }
  #tl-play:hover{background:rgba(53,224,255,.2)}
  #tl-play svg{width:12px; height:12px; fill:currentColor}
  #tl-track{position:relative; flex:1; height:26px; cursor:pointer}
  #tl-rail{position:absolute; left:0; right:0; top:12px; height:2px; border-radius:2px; background:rgba(255,255,255,.1)}
  #tl-fill{position:absolute; left:0; top:12px; height:2px; border-radius:2px; width:0;
           background:linear-gradient(90deg,var(--cy),var(--vi)); box-shadow:0 0 10px rgba(53,224,255,.5)}
  #tl-knob{position:absolute; top:8px; left:0; width:10px; height:10px; margin-left:-5px; border-radius:50%;
           background:#dff2fb; box-shadow:0 0 10px var(--cy); transition:transform .12s}
  .tl-tick{position:absolute; top:16px; width:1px; height:4px; background:rgba(255,255,255,.16)}
  .tl-lb{position:absolute; top:-2px; transform:translateX(-50%); font-size:9.5px; color:var(--ink-3); white-space:nowrap}
  .tl-lb.on{color:var(--cy)}
  #tl-label{font-size:11px; color:var(--ink-2); min-width:74px; text-align:right; font-variant-numeric:tabular-nums}

  /* ── 左下工具 ───────────────────────────── */
  #hud-tools{left:26px; bottom:24px; width:206px; padding:11px 13px 12px}
  .tool-h{display:flex; justify-content:space-between; align-items:center; font-size:10.5px; letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase}
  .tool-h b{color:var(--ink-2); font-variant-numeric:tabular-nums; letter-spacing:0; font-size:11px}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:16px; margin-top:8px; background:transparent; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px; border-radius:2px; background:rgba(255,255,255,.14)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:11px; height:11px; margin-top:-4.5px; border-radius:50%;
    background:#dff2fb; box-shadow:0 0 9px rgba(53,224,255,.8);
  }
  input[type=range]::-moz-range-track{height:2px; border-radius:2px; background:rgba(255,255,255,.14)}
  input[type=range]::-moz-range-thumb{width:11px; height:11px; border:0; border-radius:50%; background:#dff2fb; box-shadow:0 0 9px rgba(53,224,255,.8)}
  #tool-actions{display:flex; gap:7px; margin-top:10px}
  .tbtn{
    flex:1; padding:6px 0; text-align:center; font-size:11.5px; border-radius:7px; cursor:pointer;
    color:var(--ink-2); background:rgba(255,255,255,.04); border:1px solid rgba(96,190,230,.16);
    transition:all .18s var(--ease);
  }
  .tbtn:hover{color:var(--ink); border-color:rgba(53,224,255,.42); background:rgba(53,224,255,.1)}
  .tbtn.on{color:var(--cy); border-color:rgba(53,224,255,.5); background:rgba(53,224,255,.14)}

  /* ── 机位 ───────────────────────────────── */
  #preset-bar{position:absolute; right:26px; top:calc(22px + 0px); display:none}
  #hud-right #preset-bar{position:static; display:flex; gap:6px; margin-top:11px; flex-wrap:wrap}
  .pbtn{
    padding:5px 10px; font-size:11px; border-radius:6px; cursor:pointer; color:var(--ink-2);
    background:rgba(255,255,255,.04); border:1px solid rgba(96,190,230,.16); transition:all .18s var(--ease);
  }
  .pbtn:hover{color:var(--ink); border-color:rgba(53,224,255,.4)}
  .pbtn.on{color:var(--cy); border-color:rgba(53,224,255,.5); background:rgba(53,224,255,.13)}

  /* ── 提示 / 加载 / 降级 ──────────────────── */
  #hint{
    position:absolute; right:26px; bottom:24px; display:flex; gap:14px;
    font-size:10.5px; color:var(--ink-3); letter-spacing:.03em;
  }
  #hint span{display:inline-flex; align-items:center; gap:5px}
  #hint span::before{content:""; width:3px; height:3px; border-radius:50%; background:rgba(96,190,230,.5)}

  #boot{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:#04080f; z-index:40; transition:opacity .5s var(--ease);
  }
  #boot.out{opacity:0; pointer-events:none}
  .boot-ring{
    width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(53,224,255,.18); border-top-color:var(--cy);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot-tx{font-size:11px; letter-spacing:.2em; color:var(--ink-3); text-transform:uppercase}

  #fallback{position:absolute; inset:0; display:none}
  #fallback.on{display:block}
  #fb-tip{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:12px; color:var(--ink-3); text-align:center; line-height:1.9; pointer-events:none;
  }
  #fallback canvas{width:100%; height:100%; display:block}

  @media (max-width:1240px){
    #hud-left,#hud-tools{display:none}
    #hud-right{width:250px}
    #hud-bottom{width:min(430px,60vw)}
  }
  @media (max-height:760px){
    #hud-left{top:150px}
    #hud-bottom{bottom:14px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>

  <div id="hud-top" class="pane">
    <div id="sb-title">__TITLE__</div>
    <div id="sb-sub">__SUBTITLE__</div>
    <div class="rule"></div>
    <div id="hud-meta">
      <span id="sb-badge">__BADGE__</span>
      <span id="sb-clock">--:--:--</span>
      <span id="sb-mode">初始化</span>
    </div>
  </div>

  <div id="hud-left" class="pane">
    <div class="pane-h"><span class="dot"></span><b>图层</b><span id="layer-count" style="margin-left:auto"></span></div>
    <div class="pane-b" id="layer-list"></div>
  </div>

  <div id="hud-right" class="pane">
    <div class="pane-h"><span class="dot"></span><b>沙盘概览</b></div>
    <div class="pane-b">
      <div id="kpi-grid"></div>
      <div id="inspector">
        <div id="ins-empty">点击沙盘上的建筑、管线或车辆<br>查看该实体的运行指标</div>
        <div id="ins-body">
          <div id="ins-name"></div>
          <div id="ins-type"></div>
          <div id="ins-status" style="margin-top:7px"></div>
          <div id="ins-metrics"></div>
        </div>
      </div>
      <div id="alarm-wrap">
        <div class="pane-h" style="padding:0 0 7px; border:0"><span class="dot" style="background:var(--alarm);box-shadow:0 0 8px var(--alarm)"></span><b>告警</b></div>
        <div id="alarm-list"></div>
      </div>
      <div id="preset-bar"></div>
    </div>
  </div>

  <div id="hud-bottom" class="pane">
    <div id="tl-row">
      <div id="tl-play" title="播放 / 暂停">
        <svg viewBox="0 0 12 12"><path d="M2 1l8 5-8 5z"/></svg>
      </div>
      <div id="tl-track">
        <div id="tl-rail"></div>
        <div id="tl-fill"></div>
        <div id="tl-knob"></div>
      </div>
      <div id="tl-label">--</div>
    </div>
  </div>

  <div id="hud-tools" class="pane">
    <div id="clip-wrap">
      <div class="tool-h"><span>剖切</span><b id="clip-val">关</b></div>
      <input id="clip-range" type="range" min="0" max="100" value="100">
    </div>
    <div id="tool-actions">
      <div class="tbtn" id="btn-reset">复位</div>
      <div class="tbtn" id="btn-spin">环绕</div>
    </div>
  </div>

  <div id="hint">
    <span>拖拽旋转</span><span>滚轮缩放</span><span>右键平移</span><span>点击查看</span>
  </div>

  <div id="fallback"><canvas id="fb-canvas"></canvas><div id="fb-tip"></div></div>

  <div id="boot">
    <div class="boot-ring"></div>
    <div id="boot-tx">loading sandbox</div>
  </div>
</div>

<script id="sb-config" type="application/json">__SANDBOX_CONFIG__</script>
<script id="sb-runtime">
(function(){
'use strict';

/* ══════════════════════════════════════════════════════════
   1. 配置与全局状态
   ══════════════════════════════════════════════════════════ */
var CFG = (function(){
  try { return JSON.parse(document.getElementById('sb-config').textContent || '{}'); }
  catch(e){ console.error('[sandbox] config JSON 解析失败', e); return {}; }
})();
var META     = CFG.meta || {};
var BASE     = CFG.base || {};
var ENV      = CFG.env || {};
var CAMCFG   = CFG.camera || {};
var LAYERS   = CFG.layers || [];
var KPIS     = CFG.kpis || [];
var ALARMS   = CFG.alarms || [];
var TIMELINE = CFG.timeline || { enabled:false };
var CLIPCFG  = CFG.clip || { enabled:false };
var PRESETS  = CFG.presets || [];

var S = {
  THREE:null, scene:null, camera:null, renderer:null,
  layerMap:{}, entMap:{}, pickables:[], pulsers:[], tagPool:[],
  mode:'boot', selected:null, spin:false,
  clip:{ on:false, plane:null, value:1 },
  playing:false, t:0, dur:parseFloat(TIMELINE.durationSec) || 30,
  activity:1, hoverId:null, needTagRefresh:true
};

/* ══════════════════════════════════════════════════════════
   2. 通用工具
   ══════════════════════════════════════════════════════════ */
function $(id){ return document.getElementById(id); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function num(v,d){ return (typeof v==='number' && isFinite(v)) ? v : d; }

/* 确定性随机：同一份配置每次刷新长得一样，交付可复现 */
function rng(seed){
  var s = (seed>>>0) || 1;
  return function(){
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t>>>15), t|1);
    t ^= t + Math.imul(t ^ (t>>>7), t|61);
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  };
}

var STATUS_COLOR = { normal:'#37e0a6', warn:'#ffb23f', alarm:'#ff5a5f', off:'#5d7d90' };
function statusColor(st){ return STATUS_COLOR[st] || STATUS_COLOR.normal; }

function fmtVal(v,unit){
  if (v === undefined || v === null) return '--';
  if (typeof v === 'number') v = (Math.abs(v) >= 1000) ? v.toFixed(0) : (Math.round(v*10)/10);
  return String(v) + (unit ? '<small>' + unit + '</small>' : '');
}

/* 昼夜调色板：沙盘是「被照亮的模型」，光比要高，别糊成一片灰 */
var PALETTE = {
  day:   { sky:0x8fb8d6, skyTop:0x2f6f9e, fog:0x9dc0d8, fogD:0.0016,
           sun:0xfff6e8, sunI:1.7, hemiSky:0xbcd8ea, hemiGnd:0x2a3644, hemiI:0.5,
           ambI:0.2, win:0.12, exposure:0.95, grid:0x2f4a5c, edge:0x59c8e8 },
  dusk:  { sky:0x274a68, skyTop:0x0a1b2c, fog:0x0a1c2b, fogD:0.0026,
           sun:0xffc79a, sunI:1.7, hemiSky:0x6f93b4, hemiGnd:0x121c26, hemiI:0.5,
           ambI:0.22, win:0.9, exposure:1.0, grid:0x1d3d52, edge:0x35e0ff },
  night: { sky:0x0a1420, skyTop:0x03080e, fog:0x081420, fogD:0.0034,
           sun:0x8fa8d8, sunI:0.55, hemiSky:0x35506b, hemiGnd:0x0a1018, hemiI:0.28,
           ambI:0.16, win:1.0, exposure:0.95, grid:0x17303f, edge:0x35e0ff }
};
function palette(){ return PALETTE[ENV.timeOfDay] || PALETTE.dusk; }

/* three r149 没有 ColorManagement：材质色字面量会被当成**线性值**直接采样，
  0x2a3a48 这种深色输出到屏幕会变成 #8a97a3 的浅灰。所有颜色统一过一次
  sRGB→linear，颜色才和设计稿对得上。 */
function C(hex){
  if (hex === undefined || hex === null) return new S.THREE.Color(0xffffff);
  if (hex.isColor) return hex.clone();
  return new S.THREE.Color(hex).convertSRGBToLinear();
}

/* ══════════════════════════════════════════════════════════
   3. 程序化纹理（零外部图片，全部 canvas 生成）
   ══════════════════════════════════════════════════════════ */
var TEX = {};
function newCanvas(w,h){
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function canvasTex(c, repX, repY, srgb){
  var t = new S.THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = S.THREE.RepeatWrapping;
  t.repeat.set(repX || 1, repY || 1);
  t.anisotropy = 4;
  if (srgb !== false) t.encoding = S.THREE.sRGBEncoding;
  return t;
}

/* 台面：园区地表（草地块 + 地块分缝 + 细微噪点） */
function texSurface(kind){
  var c = newCanvas(512,512), g = c.getContext('2d'), R = rng(7);
  var pal = kind === 'concrete' ? ['#5c6771','#68737d','#525d67']
          : kind === 'asphalt'  ? ['#474f57','#525a62','#3d454c']
          : ['#37493e','#3f5347','#30423a'];          /* park 默认：草绿 */
  g.fillStyle = pal[0]; g.fillRect(0,0,512,512);
  /* 大块斑驳：低对比小尺寸，否则俯视时地面会脏成一片补丁 */
  for (var i=0;i<34;i++){
    g.fillStyle = pal[1 + (R()>.5?0:1)];
    g.globalAlpha = 0.025 + R()*0.045;
    var w = 26 + R()*54, h = 22 + R()*42;
    g.fillRect(R()*512, R()*512, w, h);
  }
  g.globalAlpha = 1;
  /* 细噪点 */
  for (var j=0;j<2400;j++){
    g.fillStyle = R() > .5 ? 'rgba(255,255,255,.016)' : 'rgba(0,0,0,.028)';
    g.fillRect(R()*512, R()*512, 1.4, 1.4);
  }
  /* 地块分缝：让台面有「规划过」的秩序感 */
  if (kind !== 'asphalt'){
    g.strokeStyle = 'rgba(140,190,210,.10)'; g.lineWidth = 1.2;
    for (var k=1;k<4;k++){
      g.beginPath(); g.moveTo(k*128, 0); g.lineTo(k*128, 512); g.stroke();
      g.beginPath(); g.moveTo(0, k*128); g.lineTo(512, k*128); g.stroke();
    }
  }
  return c;
}

/* 台体剖面：岩层 / 土层条纹（沙盘的「被切开」观感全靠它） */
function texStrata(){
  var c = newCanvas(256,256), g = c.getContext('2d'), R = rng(31);
  var bands = ['#33475a','#3b5163','#2e4051','#27394a','#44607a','#2b3f52'];
  g.fillStyle = bands[0]; g.fillRect(0,0,256,256);
  var y = 0;
  while (y < 256){
    var h = 5 + R()*22;
    g.fillStyle = bands[Math.floor(R()*bands.length)];
    g.globalAlpha = 0.85;
    g.beginPath(); g.moveTo(0,y);
    for (var x=0;x<=256;x+=16) g.lineTo(x, y + Math.sin(x*0.05 + R()*0.4)*2.2);
    g.lineTo(256, y+h); g.lineTo(0, y+h); g.closePath(); g.fill();
    y += h;
  }
  g.globalAlpha = 1;
  for (var i=0;i<900;i++){
    g.fillStyle = R()>.5 ? 'rgba(80,150,180,.09)' : 'rgba(0,0,0,.12)';
    g.fillRect(R()*256, R()*256, 1.5, 1.5);
  }
  return c;
}

/* 窗光网格：白天几乎不亮，入夜后成为沙盘的主要光源 */
function texWindow(){
  var c = newCanvas(128,256), g = c.getContext('2d'), R = rng(53);
  g.fillStyle = '#0a1219'; g.fillRect(0,0,128,256);
  var cols = 8, rows = 22, pw = 128/cols, ph = 256/rows;
  for (var y=0;y<rows;y++){
    for (var x=0;x<cols;x++){
      var lit = R();
      var px = x*pw + pw*0.18, py = y*ph + ph*0.22;
      var w = pw*0.64, h = ph*0.5;
      if (lit > 0.34){
        var warm = R() > 0.42;
        g.fillStyle = warm ? 'rgba(255,214,150,' + (0.4 + R()*0.5) + ')'
                           : 'rgba(160,225,255,' + (0.34 + R()*0.46) + ')';
      } else {
        g.fillStyle = 'rgba(22,38,52,.85)';
      }
      g.fillRect(px, py, w, h);
    }
  }
  /* 楼层分隔 */
  g.fillStyle = 'rgba(6,12,18,.9)';
  for (var r2=0;r2<rows;r2++) g.fillRect(0, r2*ph, 128, Math.max(1, ph*0.14));
  return c;
}

/* 车道虚线 */
function texLane(){
  var c = newCanvas(32,128), g = c.getContext('2d');
  g.clearRect(0,0,32,128);
  g.fillStyle = 'rgba(230,240,250,.72)';
  g.fillRect(14, 16, 4, 52);
  return c;
}

/* 落地投影贴片：一张径向渐变，比动态阴影可靠——软件渲染/低端 GPU 也能有
   接触阴影，建筑才「站」在沙盘上而不是浮着。 */
function texShadow(){
  var c = newCanvas(128,128), g = c.getContext('2d');
  var grd = g.createRadialGradient(64,64,3,64,64,63);
  grd.addColorStop(0, 'rgba(0,0,0,.36)');
  grd.addColorStop(0.45, 'rgba(0,0,0,.16)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0,0,128,128);
  return c;
}

/* 树冠噪点，让实例化树丛不只是纯色球 */
function texFoliage(){
  var c = newCanvas(64,64), g = c.getContext('2d'), R = rng(97);
  g.fillStyle = '#4b6b4a'; g.fillRect(0,0,64,64);
  for (var i=0;i<420;i++){
    g.fillStyle = R()>.5 ? 'rgba(140,205,150,.5)' : 'rgba(26,54,34,.6)';
    g.beginPath(); g.arc(R()*64, R()*64, 1 + R()*2.4, 0, 6.2832); g.fill();
  }
  return c;
}

function initTextures(){
  TEX.surface  = canvasTex(texSurface(BASE.surface || 'park'), 7, 5);
  TEX.surface2 = canvasTex(texSurface('concrete'), 3, 3);
  TEX.strata   = canvasTex(texStrata(), 6, 1);
  TEX.window   = canvasTex(texWindow(), 1, 1);
  TEX.lane     = canvasTex(texLane(), 1, 1, false);
  TEX.foliage  = canvasTex(texFoliage(), 1, 1);
  TEX.shadow   = canvasTex(texShadow(), 1, 1, false);
}

/* ══════════════════════════════════════════════════════════
   4. 沙盘台体与地形
   ══════════════════════════════════════════════════════════ */
var MAT = {};
function stdMat(key, opt){
  if (!MAT[key]){ MAT[key] = new S.THREE.MeshStandardMaterial(opt); }
  return MAT[key];
}

/* 台体尺寸：沙盘是「一块被托起来的地」，不是无限大地 */
function baseSize(){
  var s = BASE.size || [420, 22, 320];
  return { w:num(s[0],420), h:num(s[1],22), d:num(s[2],320) };
}

/* 双线性值噪声：地形起伏用它，保证每次刷新一致 */
function noiseField(seed, cols, rows){
  var R = rng(seed), g = [], i, j;
  for (j=0;j<=rows;j++){ g[j] = []; for (i=0;i<=cols;i++) g[j][i] = R(); }
  return function(u, v){                       /* u,v ∈ [0,1] */
    var x = clamp(u,0,0.9999)*cols, y = clamp(v,0,0.9999)*rows;
    var x0 = Math.floor(x), y0 = Math.floor(y), fx = x-x0, fy = y-y0;
    fx = fx*fx*(3-2*fx); fy = fy*fy*(3-2*fy);
    var a = lerp(g[y0][x0], g[y0][x0+1], fx);
    var b = lerp(g[y0+1][x0], g[y0+1][x0+1], fx);
    return lerp(a,b,fy);
  };
}

function buildBase(){
  var T = S.THREE, P = palette(), bs = baseSize();
  var grp = new T.Group();
  grp.name = 'base';
  var th = bs.h;

  /* 台体：侧面岩层剖面 + 底面深色 */
  var sideMat = new T.MeshStandardMaterial({
    map: TEX.strata, color: C(0xd8e6ef), roughness: 0.96, metalness: 0.02
  });
  var botMat = stdMat('baseBottom', { color: C(0x1c262f), roughness: 1 });
  var diaMat = stdMat('baseTopFill', { color: C(0x3d4a56), roughness: 1 });
  var box = new T.Mesh(
    new T.BoxGeometry(bs.w, th, bs.d),
    [sideMat, sideMat, diaMat, botMat, sideMat, sideMat]
  );
  box.position.y = -th/2;
  box.receiveShadow = true;
  grp.add(box);

  /* 顶面地表：中心平、四周起坡——像沙盘上堆出的地貌，建筑不会浮空 */
  var segX = 72, segZ = 54;
  var plane = new T.PlaneGeometry(bs.w, bs.d, segX, segZ);
  var amp = num(BASE.terrain, 3.2);
  var nf = noiseField(num(BASE.terrainSeed, 12), 7, 6);
  var pos = plane.attributes.position;
  for (var i=0;i<pos.count;i++){
    var px = pos.getX(i), pz = pos.getY(i);            /* plane 未旋转：y 即 z */
    var u = (px/bs.w) + 0.5, v = (pz/bs.d) + 0.5;
    var ed = Math.max(Math.abs(u-0.5), Math.abs(v-0.5)) * 2;   /* 0 中心 → 1 边缘 */
    var w = clamp((ed - 0.55) / 0.45, 0, 1);
    var h = (nf(u*0.8+0.1, v*0.8+0.1) - 0.45) * amp * 2 * w + w*w*amp*0.8;
    pos.setZ(i, h);
  }
  plane.computeVertexNormals();
  var surf = new T.Mesh(plane, new T.MeshStandardMaterial({
    map: TEX.surface, roughness: 0.94, metalness: 0.02
  }));
  surf.rotation.x = -Math.PI/2;
  surf.position.y = 0;
  surf.receiveShadow = true;
  grp.add(surf);

  /* 边缘辉光：沙盘轮廓线，俯视角一眼看清边界 */
  var edgeCol = C(P.edge);
  var edgeMat = new T.LineBasicMaterial({
    color: edgeCol, transparent: true, opacity: 0.85,
    blending: T.AdditiveBlending, depthWrite: false
  });
  var hw = bs.w/2, hd = bs.d/2;
  var eg = new T.BufferGeometry().setFromPoints([
    new T.Vector3(-hw, 0.02, -hd), new T.Vector3(hw, 0.02, -hd),
    new T.Vector3(hw, 0.02, hd),   new T.Vector3(-hw, 0.02, hd),
    new T.Vector3(-hw, 0.02, -hd)
  ]);
  grp.add(new T.Line(eg, edgeMat));

  /* 底部承接：一圈发光托板，把沙盘「抬」在空中 */
  var trayMat = new T.MeshBasicMaterial({
    color: edgeCol, transparent: true, opacity: 0.1,
    blending: T.AdditiveBlending, side: T.DoubleSide, depthWrite: false
  });
  var tray = new T.Mesh(new T.PlaneGeometry(bs.w*1.06, bs.d*1.06), trayMat);
  tray.rotation.x = -Math.PI/2;
  tray.position.y = -th - 6;
  grp.add(tray);

  if (ENV.fog !== 0){
    S.scene.fog = new T.FogExp2(C(P.fog), num(ENV.fog, P.fogD));
  }
  return grp;
}

/* ══════════════════════════════════════════════════════════
   5. 构件工厂（园区/厂区）
   ══════════════════════════════════════════════════════════ */
function outline(geo, color, opacity){
  var T = S.THREE;
  var e = new T.EdgesGeometry(geo, 26);
  var m = new T.LineBasicMaterial({
    color: C(color), transparent: true, opacity: opacity === undefined ? 0.42 : opacity
  });
  return new T.LineSegments(e, m);
}

/* 工业体量的骨架感：竖向墙肋 + 勒脚。比贴图可靠——ExtrudeGeometry 的 UV
   是按世界尺寸给的，一万个 repeat 的贴图只会糊成噪点，几何肋不会。 */
function addRibs(g, w, h, d, color){
  var T = S.THREE;
  var mat = new T.MeshStandardMaterial({
    color: C(color || 0x94a3ae), roughness: 0.55, metalness: 0.45
  });
  var ribGeo = new T.BoxGeometry(0.7, h, 0.7);
  var n = clamp(Math.round(d/9), 2, 22);
  for (var i=0;i<=n;i++){
    var z = -d/2 + d*i/n;
    for (var s=-1;s<=1;s+=2){
      var rib = new T.Mesh(ribGeo, mat);
      rib.position.set(s*(w/2+0.15), h/2, z);
      rib.castShadow = true;
      g.add(rib);
    }
  }
}

var SHADOW_MAT = null;
function groundShadowMat(){
  if (!SHADOW_MAT){
    SHADOW_MAT = new S.THREE.MeshBasicMaterial({
      map: TEX.shadow, transparent: true, depthWrite: false, opacity: 0.75
    });
  }
  return SHADOW_MAT;
}

/* 贴地投影：任何楼都得有，否则沙盘看着像把盒子摆上去 */
function addGroundShadow(g, w, d){
  var T = S.THREE;
  var plane = new T.Mesh(new T.PlaneGeometry(w, d), groundShadowMat());
  plane.rotation.x = -Math.PI/2;
  plane.position.y = 0.2;
  plane.renderOrder = 1;
  g.add(plane);
}

function addPlinth(g, w, d, color){
  var T = S.THREE;
  var m = new T.Mesh(new T.BoxGeometry(w*1.03, 1.8, d*1.03),
    stdMat('plinth-' + (color||'d'), { color: C(color || 0x4c5864), roughness: 0.9 }));
  m.position.y = 0.9;
  m.castShadow = true; m.receiveShadow = true;
  g.add(m);
  addGroundShadow(g, w*1.5, d*1.5);
}

/* 幕墙材质：窗光**只做自发光贴图**，绝不能同时当漫反射贴图——
   否则白天整栋楼变成一片亮窗格噪点，远处看就是「发白的花盒子」。 */
function winMaterial(w, h, baseColor, emissive){
  var T = S.THREE;
  var tex = TEX.window.clone();
  tex.needsUpdate = true;
  /* 窗格密度必须按真实楼层算：texWindow 本身是 8 列 × 22 行，
     一层约 4 单位高、每开间约 2.6 单位——repeat 直接给「层数/22、开间数/8」。
     写死成 round(h/9) 会让 54 米高的楼出现 130 行窗，远处混叠成一片灰白。 */
  var floors = Math.max(2, Math.round(h / 4));
  var bays = Math.max(2, Math.round(w / 2.6));
  tex.repeat.set(bays / 8, floors / 22);
  return new T.MeshStandardMaterial({
    color: C(baseColor || 0x5d6f81),
    roughness: 0.56, metalness: 0.22,
    emissive: C(emissive || 0xdfefff),
    emissiveMap: tex, emissiveIntensity: palette().win * 0.62
  });
}

/* 高层楼宇：主体 + 裙房 + 女儿墙 + 屋顶机组 + 描边 */
function makeTower(e, lc){
  var T = S.THREE, g = new T.Group();
  var s = e.size || [26, 46, 26];
  var w = num(s[0],26), h = num(s[1],46), d = num(s[2],26);
  var body = new T.Mesh(new T.BoxGeometry(w, h, d), winMaterial(w, h, e.color, e.emissive));
  body.position.y = h/2;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  g.add((function(){ var o = outline(new T.BoxGeometry(w,h,d), lc, 0.34); o.position.y = h/2; return o; })());

  /* 裙房：占地更大、更矮，城市感来自这个退台 */
  var pw = w*1.5, ph = Math.max(4, h*0.12), pd = d*1.5;
  var podium = new T.Mesh(new T.BoxGeometry(pw, ph, pd), winMaterial(pw, ph, 0x53667a, 0x8fd0f0));
  podium.position.y = ph/2; podium.castShadow = true; podium.receiveShadow = true;
  g.add(podium);
  addGroundShadow(g, pw*1.2, pd*1.2);

  /* 女儿墙 + 屋顶机组 */
  var par = new T.Mesh(new T.BoxGeometry(w*1.03, 1.2, d*1.03),
                       stdMat('parapet', { color: C(0x8695a1), roughness: 0.8 }));
  par.position.y = h + 0.6;
  g.add(par);
  var eqMat = stdMat('roofEq', { color: C(0x8c9ba7), roughness: 0.6, metalness: 0.3 });
  var eq = new T.Mesh(new T.BoxGeometry(w*0.3, 2.2, d*0.3), eqMat);
  eq.position.set(w*0.16, h + 1.1, -d*0.16);
  eq.castShadow = true;
  g.add(eq);

  return g;
}

/* 厂房：双坡屋面 + 天窗带 + 卷帘门 */
function makePlant(e, lc){
  var T = S.THREE, g = new T.Group();
  var s = e.size || [70, 14, 34];
  var w = num(s[0],70), h = num(s[1],14), d = num(s[2],34);
  var rise = Math.max(2.4, h*0.22);

  var shape = new T.Shape();
  shape.moveTo(-w/2, 0); shape.lineTo(-w/2, h);
  shape.lineTo(0, h + rise); shape.lineTo(w/2, h);
  shape.lineTo(w/2, 0); shape.closePath();
  var bodyGeo = new T.ExtrudeGeometry(shape, { depth: d, bevelEnabled: false, curveSegments: 1 });
  bodyGeo.translate(0, 0, -d/2);
  var body = new T.Mesh(bodyGeo, stdMat('plantWall-' + (e.color||'d'), {
    color: C(e.color || 0x7e91a1), roughness: 0.72, metalness: 0.18
  }));
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  g.add(outline(bodyGeo, lc, 0.34));
  addRibs(g, w, h, d, e.rib);
  addPlinth(g, w, d);

  /* 金属屋面：单独压深一档。厂房是大块面，跟着墙色一起受光会整片泛白 */
  var ang = Math.atan2(rise, w/2);
  var slopeLen = Math.sqrt(rise*rise + (w/2)*(w/2));
  var roofPanelMat = stdMat('plantRoof-' + (e.roofColor || 'd'), {
    color: C(e.roofColor || 0x4d5d6b), roughness: 0.52, metalness: 0.55
  });
  [-1, 1].forEach(function(sx){
    var panel = new T.Mesh(new T.BoxGeometry(slopeLen*1.01, 0.5, d*1.02), roofPanelMat);
    panel.position.set(sx*w/4, h + rise/2 + 0.1, 0);
    panel.rotation.z = -sx * ang;
    panel.castShadow = true;
    g.add(panel);
  });

  /* 屋面天窗：沿屋脊两条亮带，夜里是最好的光源线索 */
  var skMat = new T.MeshStandardMaterial({
    color: C(0x4f8ba6), emissive: C(0x9fe2ff), emissiveIntensity: palette().win * 0.45,
    roughness: 0.3, metalness: 0.1
  });
  [-1, 1].forEach(function(sx){
    var slope = new T.Mesh(new T.BoxGeometry(w*0.14, 0.5, d*0.9), skMat);
    slope.position.set(sx*w*0.28, h + rise*0.52 + 0.35, 0);
    slope.rotation.z = -sx * ang;
    g.add(slope);
  });

  /* 卷帘门 */
  var doorMat = stdMat('door', { color: C(0x5b6b78), roughness: 0.8 });
  var door = new T.Mesh(new T.BoxGeometry(w*0.24, h*0.62, 0.6), doorMat);
  door.position.set(0, h*0.31, d/2 + 0.25);
  g.add(door);

  return g;
}

/* 仓储：低矮大跨 + 拱形屋面 */
function makeWarehouse(e, lc){
  var T = S.THREE, g = new T.Group();
  var s = e.size || [56, 10, 30];
  var w = num(s[0],56), h = num(s[1],10), d = num(s[2],30);
  var body = new T.Mesh(new T.BoxGeometry(w, h, d),
                        stdMat('whWall-' + (e.color||'d'), { color: C(e.color || 0x76889a), roughness: 0.82 }));
  body.position.y = h/2; body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  g.add((function(){ var o = outline(new T.BoxGeometry(w,h,d), lc, 0.3); o.position.y = h/2; return o; })());
  addRibs(g, w, h, d, e.rib);
  addPlinth(g, w, d);

  var roofGeo = new T.CylinderGeometry(w/2, w/2, d, 20, 1, false, 0, Math.PI);
  var roof = new T.Mesh(roofGeo, stdMat('whRoof', {
    color: C(0x8496a4), roughness: 0.6, metalness: 0.35, side: T.DoubleSide
  }));
  roof.rotation.z = Math.PI/2;
  roof.rotation.y = Math.PI/2;
  roof.position.y = h;
  roof.scale.y = 1;
  roof.castShadow = true;
  g.add(roof);
  return g;
}

/* 通用体块（占位 / 附属建筑） */
function makeBlock(e, lc){
  var T = S.THREE, g = new T.Group();
  var s = e.size || [20, 18, 20];
  var w = num(s[0],20), h = num(s[1],18), d = num(s[2],20);
  var geo = new T.BoxGeometry(w, h, d);
  var m = new T.Mesh(geo, stdMat('blk-' + (e.color||'d'), {
    color: C(e.color || 0x6d7f8d), roughness: 0.7, metalness: 0.2
  }));
  m.position.y = h/2; m.castShadow = true; m.receiveShadow = true;
  g.add(m);
  g.add((function(){ var o = outline(geo, lc, 0.36); o.position.y = h/2; return o; })());
  addPlinth(g, w, d);
  return g;
}

/* 道路：由 xz 折线生成贴地带状路面 + 中心虚线 */
function ribbon(curve, width, y, mat, uRepeat){
  var T = S.THREE;
  var N = 96;
  var pts = curve.getSpacedPoints(N);
  var pos = [], uv = [], idx = [], acc = 0, total = curve.getLength();
  for (var i=0;i<=N;i++){
    var p = pts[i];
    var t = (i === 0) ? pts[1].clone().sub(pts[0])
            : (i === N ? pts[N].clone().sub(pts[N-1])
            : pts[i+1].clone().sub(pts[i-1]));
    t.y = 0;
    if (t.lengthSq() < 1e-8) t.set(1,0,0);
    t.normalize();
    var nx = -t.z, nz = t.x;
    if (i > 0) acc += pts[i].distanceTo(pts[i-1]);
    var u = (uRepeat || 1) * acc / Math.max(total, 1);
    pos.push(p.x + nx*width/2, y, p.z + nz*width/2);
    pos.push(p.x - nx*width/2, y, p.z - nz*width/2);
    uv.push(u, 1, u, 0);
    if (i < N){
      var a = i*2;
      idx.push(a, a+1, a+2, a+1, a+3, a+2);
    }
  }
  var g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new T.Mesh(g, mat);
}

function vecPath(points){
  var T = S.THREE;
  var v = (points || []).map(function(p){ return new T.Vector3(num(p[0],0), num(p[1],0), num(p[2],0)); });
  return new T.CatmullRomCurve3(v, false, 'catmullrom', 0.1);
}

function makeRoad(e){
  var T = S.THREE, g = new T.Group();
  var w = num(e.width, 12);
  var curve = vecPath(e.points);
  var road = ribbon(curve, w, 0.09, stdMat('road-' + Math.round(w), {
    color: C(0x828a92), roughness: 0.9, metalness: 0.05
  }));
  road.receiveShadow = true;
  g.add(road);
  var laneMat = new T.MeshBasicMaterial({
    map: TEX.lane.clone(), transparent: true, opacity: 0.72, depthWrite: false
  });
  laneMat.map.needsUpdate = true;
  laneMat.map.repeat.set(1, 1);
  var lane = ribbon(curve, Math.max(0.35, w*0.04), 0.13, laneMat, curve.getLength()/14);
  g.add(lane);
  return g;
}

/* 管线：Tube + 沿管流光；架空管廊有支墩 */
function makePipe(e, lc){
  var T = S.THREE, g = new T.Group();
  var curve = vecPath(e.points);
  var r = num(e.radius, 0.9);
  var geo = new T.TubeGeometry(curve, 120, r, 10, false);
  var mat = new T.MeshStandardMaterial({
    color: C(e.color || 0x4a6070), roughness: 0.42, metalness: 0.75,
    emissive: C(lc), emissiveIntensity: 0.12
  });
  var tube = new T.Mesh(geo, mat);
  tube.castShadow = true;
  g.add(tube);

  /* 流光：3 个沿曲线推进的亮点，方向感来自运动本身 */
  var flowMat = new T.MeshBasicMaterial({
    color: C(lc), transparent: true, opacity: 0.9,
    blending: T.AdditiveBlending, depthWrite: false
  });
  var dots = [];
  if (e.flow !== false){
    for (var i=0;i<3;i++){
      var d = new T.Mesh(new T.SphereGeometry(r*1.9, 8, 8), flowMat);
      d.userData.phase = i/3;
      g.add(d); dots.push(d);
    }
  }
  g.userData.anim = function(t){
    if (!dots.length) return;
    var len = curve.getLength();
    for (var k=0;k<dots.length;k++){
      var u = ((t*0.06 + dots[k].userData.phase) % 1);
      var p = curve.getPointAt(u);
      dots[k].position.copy(p);
      dots[k].scale.setScalar(0.7 + 0.5*Math.sin(t*3 + k));
    }
    void len;
  };

  /* 支墩 */
  var pierMat = stdMat('pier', { color: C(0x74838f), roughness: 0.85 });
  var pts = curve.getSpacedPoints(Math.max(2, Math.round(curve.getLength()/26)));
  for (var j=1;j<pts.length-1;j+=2){
    var p = pts[j];
    if (p.y < 1.5) continue;
    var pier = new T.Mesh(new T.BoxGeometry(1.6, p.y, 1.6), pierMat);
    pier.position.set(p.x, p.y/2, p.z);
    pier.castShadow = true;
    g.add(pier);
  }
  return g;
}

/* 车辆：车头 + 货箱 + 车轮，沿路径往复，速度受时间轴 activity 调制 */
function makeVehicle(e, lc){
  var T = S.THREE, g = new T.Group();
  var curve = vecPath(e.path && e.path.length > 1 ? e.path : e.points);
  var len = curve.getLength();
  var col = C(e.color || 0xdfe8f0);
  var bodyMat = new T.MeshStandardMaterial({
    color: col, roughness: 0.42, metalness: 0.35,
    emissive: C(lc), emissiveIntensity: 0.05
  });
  var head = new T.Mesh(new T.BoxGeometry(3.4, 2.6, 6.4), bodyMat);
  head.position.set(0, 2.2, 3.2);
  head.castShadow = true;
  g.add(head);
  if (e.kind !== 'car'){
    var box = new T.Mesh(new T.BoxGeometry(3.6, 3.4, 10),
      stdMat('vehBox', { color: C(0xb2c0cc), roughness: 0.55, metalness: 0.25 }));
    box.position.set(0, 2.8, -3.6);
    box.castShadow = true;
    g.add(box);
  }
  var wheelGeo = new T.CylinderGeometry(1.15, 1.15, 0.7, 12);
  var wheelMat = stdMat('wheel', { color: C(0x2a3238), roughness: 0.9 });
  [[-1.7,1.9],[1.7,1.9],[-1.7,-2.2],[1.7,-2.2],[0,5.4]].forEach(function(p){
    var wl = new T.Mesh(wheelGeo, wheelMat);
    wl.rotation.z = Math.PI/2;
    wl.position.set(p[0], 1.15, p[1]);
    g.add(wl);
  });
  /* 车灯 */
  var lampMat = new T.MeshBasicMaterial({ color: C(0xfff3d0) });
  var lamp = new T.Mesh(new T.BoxGeometry(2.6, 0.5, 0.3), lampMat);
  lamp.position.set(0, 2.0, 6.5);
  g.add(lamp);

  var speed = num(e.speed, 16);
  var phase = num(e.phase, 0.5);
  g.userData.anim = function(t, act){
    var u = (phase + t * speed * Math.max(0.05, act) / Math.max(len,1)) % 1;
    /* 往复：一半正向一半反向，避免车辆凭空传送 */
    var uu = u < 0.5 ? u*2 : (1 - (u-0.5)*2);
    var p = curve.getPointAt(clamp(uu,0,0.999));
    var tan = curve.getTangentAt(clamp(uu,0,0.999));
    g.position.set(p.x, 0, p.z);
    g.rotation.y = Math.atan2(tan.x, tan.z) + (u < 0.5 ? 0 : Math.PI);
  };
  return g;
}

/* 地块：半透明填充 + 描边，招商/规划分区的信息层 */
function makeZone(e, lc){
  var T = S.THREE, g = new T.Group();
  var poly = e.polygon || [];
  if (poly.length < 3) return g;
  var shape = new T.Shape();
  poly.forEach(function(p, i){
    if (i === 0) shape.moveTo(p[0], p[1]); else shape.lineTo(p[0], p[1]);
  });
  shape.closePath();
  var geo = new T.ShapeGeometry(shape);
  geo.rotateX(Math.PI/2);
  var col = C(e.color || lc);
  var fill = new T.Mesh(geo, new T.MeshBasicMaterial({
    color: col, transparent: true, opacity: num(e.opacity, 0.12),
    side: T.DoubleSide, depthWrite: false
  }));
  fill.position.y = 0.16;
  g.add(fill);
  var pts = poly.map(function(p){ return new T.Vector3(p[0], 0.2, p[1]); });
  pts.push(pts[0].clone());
  var line = new T.Line(new T.BufferGeometry().setFromPoints(pts),
    new T.LineBasicMaterial({ color: col, transparent: true, opacity: 0.75 }));
  g.add(line);
  return g;
}

/* 树：实例化，成片种植时几乎零成本 */
function makeTree(e){
  var T = S.THREE, g = new T.Group();
  var n = Math.max(1, Math.round(num(e.count, 1)));
  var R = rng(num(e.seed, 9));
  var spread = e.spread || [0, 0];
  var trunkGeo = new T.CylinderGeometry(0.28, 0.36, 3, 6);
  var crownGeo = new T.IcosahedronGeometry(1, 0);
  var trunkMat = stdMat('trunk', { color: C(0x7a6552), roughness: 1 });
  var crownMat = new T.MeshStandardMaterial({
    map: TEX.foliage, color: C(0x9ecfa4), roughness: 0.95, flatShading: true
  });
  var trunks = new T.InstancedMesh(trunkGeo, trunkMat, n);
  var crowns = new T.InstancedMesh(crownGeo, crownMat, n);
  var m = new T.Matrix4(), q = new T.Quaternion(), sv = new T.Vector3(), pv = new T.Vector3();
  var base = [0, 0, 0];                     /* 位置由装配阶段统一写入 obj.position */
  for (var i=0;i<n;i++){
    var x = base[0] + (R()-0.5) * spread[0];
    var z = base[2] + (R()-0.5) * spread[1];
    var sc = 0.8 + R()*0.7;
    pv.set(x, 1.5*sc, z); sv.set(sc, sc, sc);
    m.compose(pv, q, sv); trunks.setMatrixAt(i, m);
    pv.set(x, 3.4*sc, z);
    var s2 = sc * (1.6 + R()*0.7);
    sv.set(s2, s2*0.9, s2);
    m.compose(pv, q, sv); crowns.setMatrixAt(i, m);
  }
  trunks.instanceMatrix.needsUpdate = true;
  crowns.instanceMatrix.needsUpdate = true;
  trunks.castShadow = crowns.castShadow = true;
  g.add(trunks); g.add(crowns);
  return g;
}

/* 状态标记：告警光柱 + 地面脉冲环 */
function statusMarker(status, radius, topY){
  var T = S.THREE;
  var g = new T.Group();
  var col = C(statusColor(status));
  var beamH = Math.max(10, topY * 0.5);
  var beam = new T.Mesh(
    new T.CylinderGeometry(radius*0.16, radius*0.16, beamH, 10, 1, true),
    new T.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.3,
      blending: T.AdditiveBlending, side: T.DoubleSide, depthWrite: false })
  );
  beam.position.y = beamH/2;
  g.add(beam);
  var ring = new T.Mesh(new T.RingGeometry(radius*0.5, radius*0.62, 40),
    new T.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.6,
      blending: T.AdditiveBlending, side: T.DoubleSide, depthWrite: false }));
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.4;
  g.add(ring);
  g.userData.pulse = function(t){
    var k = (t * 0.8) % 1;
    ring.scale.setScalar(1 + k*1.6);
    ring.material.opacity = 0.6 * (1 - k);
  };
  return g;
}

/* 告警点：独立图层用，脉冲更急 */
function makeAlarmMarker(e){
  var T = S.THREE, g = new T.Group();
  var col = C(e.level === 'warning' ? '#ffb23f' : '#ff5a5f');
  var s = num(e.scale, 1);
  var beam = new T.Mesh(new T.CylinderGeometry(1.1*s, 1.1*s, 26*s, 8, 1, true),
    new T.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.34,
      blending: T.AdditiveBlending, side: T.DoubleSide, depthWrite: false }));
  beam.position.y = 13*s;
  g.add(beam);
  var rings = [];
  for (var i=0;i<2;i++){
    var ring = new T.Mesh(new T.RingGeometry(2.4*s, 3.0*s, 40),
      new T.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.55,
        blending: T.AdditiveBlending, side: T.DoubleSide, depthWrite: false }));
    ring.rotation.x = -Math.PI/2;
    ring.position.y = 0.5;
    ring.userData.off = i * 0.5;
    g.add(ring); rings.push(ring);
  }
  g.userData.pulse = function(t){
    for (var i=0;i<rings.length;i++){
      var k = ((t * 0.7 + rings[i].userData.off) % 1);
      rings[i].scale.setScalar(1 + k*1.5);
      rings[i].material.opacity = 0.55 * (1 - k);
    }
  };
  return g;
}

var BUILDERS = {
  tower: makeTower, plant: makePlant, warehouse: makeWarehouse, block: makeBlock,
  road: makeRoad, pipe: makePipe, vehicle: makeVehicle, zone: makeZone,
  tree: makeTree, alarm: makeAlarmMarker
};

/* ══════════════════════════════════════════════════════════
   6. 场景装配
   ══════════════════════════════════════════════════════════ */
var POINT_TYPES = { tower:1, plant:1, warehouse:1, block:1, tree:1, alarm:1 };

function initScene(){
  var T = S.THREE, P = palette();
  var stage = $('stage');

  var renderer = new T.WebGLRenderer({
    antialias: true, alpha: true, powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = num(ENV.exposure, P.exposure);
  renderer.shadowMap.enabled = ENV.shadow !== false;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.localClippingEnabled = true;
  stage.appendChild(renderer.domElement);
  S.renderer = renderer;

  /* 透明底：沙盘浮在页面渐变之上，比满屏天空色更像「一台沙盘模型」 */
  var scene = new T.Scene();
  scene.background = null;
  S.scene = scene;

  var cam = new T.PerspectiveCamera(
    num(CAMCFG.fov, 42),
    stage.clientWidth / Math.max(1, stage.clientHeight),
    num(CAMCFG.near, 1),
    num(CAMCFG.far, 4000)
  );
  S.camera = cam;

  /* 灯光：太阳给方向与阴影，半球光给环境色，别让暗部死黑 */
  var hemi = new T.HemisphereLight(P.hemiSky, P.hemiGnd, P.hemiI);
  scene.add(hemi);
  var amb = new T.AmbientLight(0xdfefff, P.ambI);
  scene.add(amb);

  var sun = new T.DirectionalLight(P.sun, P.sunI);
  var bs = baseSize();
  sun.position.set(bs.w*0.5, Math.max(bs.w, bs.d)*1.45, bs.d*0.45);
  sun.castShadow = ENV.shadow !== false;
  if (sun.castShadow){
    var sc = Math.max(bs.w, bs.d) * 0.72;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -sc; sun.shadow.camera.right = sc;
    sun.shadow.camera.top = sc;   sun.shadow.camera.bottom = -sc;
    sun.shadow.camera.near = 1;   sun.shadow.camera.far = Math.max(bs.w, bs.d)*3;
    sun.shadow.bias = -0.0006;
    sun.shadow.normalBias = 0.12;
    sun.shadow.radius = 2.4;
  }
  scene.add(sun);
  scene.add(sun.target);

  /* 反光板：沙盘右下补一盏冷光，把轮廓勾出来 */
  var rim = new T.DirectionalLight(0x59c8e8, 0.35);
  rim.position.set(-bs.w*0.6, bs.h*3, -bs.d*0.55);
  scene.add(rim);

  scene.add(buildBase());
  assembleLayers();
  initClipPlane();
  initControls();
  buildUI();
  onResize();
  window.addEventListener('resize', onResize);
}

/* 按图层装配实体；每个实体挂 entityId 供拾取回查 */
function assembleLayers(){
  var T = S.THREE;
  S.pickables = [];
  LAYERS.forEach(function(L){
    var lg = new T.Group();
    lg.name = 'layer:' + L.id;
    var lc = L.color || '#35e0ff';
    var on = L.on !== false;
    lg.visible = on;
    S.layerMap[L.id] = { def:L, group:lg, color:lc, on:on, count:0 };

    (L.entities || []).forEach(function(e){
      var fn = BUILDERS[e.type];
      if (!fn){
        console.warn('[sandbox] 未知构件类型:', e.type, '实体:', e.id);
        return;
      }
      var obj;
      try { obj = fn(e, lc); }
      catch(err){ console.error('[sandbox] 构建失败', e.id, err); return; }

      if (POINT_TYPES[e.type]){
        var p = e.position || [0,0,0];
        obj.position.set(num(p[0],0), num(p[1],0), num(p[2],0));
        if (e.rotation) obj.rotation.y = num(e.rotation, 0);
      }
      obj.userData.entityId = e.id;
      obj.userData.entityType = e.type;
      obj.traverse(function(o){
        o.userData.entityId = e.id;
        if (o.isMesh){ o.userData.pickable = true; S.pickables.push(o); }
        if (o.userData && o.userData.pulse) S.pulsers.push(o);
      });
      lg.add(obj);
      S.layerMap[L.id].count++;
      var rec = { def:e, obj:obj, layer:L.id, marker:null };
      S.entMap[e.id] = rec;
      /* 状态标记统一在这里挂：构件工厂不管状态，运行时才能安全地增删 */
      if (e.status && e.status !== 'normal' && POINT_TYPES[e.type]) attachMarker(rec, lc);
    });
    S.scene.add(lg);
  });
  S.needTagRefresh = true;
}

/* 状态标记的挂载/卸载：光柱从楼顶升起，脉冲环贴地 */
function attachMarker(rec, lc){
  var e = rec.def, obj = rec.obj;
  if (!obj) return;
  var h = num((e.size || [0, 12])[1], 12);
  var w = e.size ? Math.max(num(e.size[0], 10), num(e.size[2], 10)) : 10;
  var m = statusMarker(e.status, Math.max(4, w * 0.55), h * 1.05 + 4);
  obj.add(m);
  S.pulsers.push(m);
  rec.marker = m;
  void lc;
}

function detachMarker(rec){
  if (!rec.marker) return;
  if (rec.obj) rec.obj.remove(rec.marker);
  var i = S.pulsers.indexOf(rec.marker);
  if (i >= 0) S.pulsers.splice(i, 1);
  rec.marker = null;
}

/* 运行时改实体：状态 / 指标 / 名称。接实时数据只需调这一个入口 */
function updateEntity(id, patch){
  var rec = S.entMap[id];
  if (!rec || !patch) return false;
  var e = rec.def;
  if (patch.name !== undefined) e.name = patch.name;
  /* 用 in 判断：允许显式传 undefined/[] 清空指标 */
  if ('metrics' in patch) e.metrics = patch.metrics || [];
  if (patch.status !== undefined && patch.status !== e.status){
    e.status = patch.status;
    if (rec.obj){
      detachMarker(rec);
      if (e.status !== 'normal' && POINT_TYPES[e.type]){
        var lm = S.layerMap[rec.layer];
        attachMarker(rec, lm ? lm.color : '#35e0ff');
      }
    }
  }
  S.needTagRefresh = true;
  if (S.selected === id) selectEntity(id, false);
  return true;
}

/* 剖切：单平面沿 X 或 Z 切入，先把剖面线定好再交给材质 */
function initClipPlane(){
  var T = S.THREE;
  if (!CLIPCFG.enabled) return;
  var axis = (CLIPCFG.axis || 'x').toLowerCase();
  var n = axis === 'z' ? new T.Vector3(0,0,-1) : new T.Vector3(-1,0,0);
  S.clip.plane = new T.Plane(n, num(CLIPCFG.value, 9999));
  S.clip.axis = axis;
  S.clip.on = false;
}

function applyClip(){
  var T = S.THREE;
  if (!S.clip.plane) return;
  var planes = S.clip.on ? [S.clip.plane] : [];
  S.scene.traverse(function(o){
    if (!o.isMesh || !o.material) return;
    var ms = Array.isArray(o.material) ? o.material : [o.material];
    for (var i=0;i<ms.length;i++){
      var m = ms[i];
      if (m.clippingPlanes === undefined) continue;
      /* 材质是共享的：原始 side 必须缓存，否则关掉剖切会把双面材质永久改单面 */
      if (m.userData.__side === undefined) m.userData.__side = m.side;
      m.clippingPlanes = planes;
      m.side = S.clip.on ? T.DoubleSide : m.userData.__side;
      m.needsUpdate = true;
    }
  });
}

function setClipRatio(r){
  if (!S.clip.plane) return;
  var bs = baseSize();
  var half = (S.clip.axis === 'z' ? bs.d : bs.w) / 2;
  S.clip.on = r < 0.995;
  /* 平面方程 n·p + c = 0（n 朝负轴），c>half 时全保留、c<-half 时全切掉 */
  S.clip.plane.constant = -half * 1.05 + clamp(r, 0, 1) * (half * 2.1);
  applyClip();
  var el = $('clip-val');
  if (el) el.textContent = S.clip.on ? (Math.round((1-r)*100) + '%') : '关';
}

/* ══════════════════════════════════════════════════════════
   7. 相机与交互
   ══════════════════════════════════════════════════════════ */
var CTRL = null;

function initControls(){
  var T = S.THREE;
  var bs = baseSize();
  var p = CAMCFG.position || [bs.w*0.62, bs.h*2 + Math.max(bs.w,bs.d)*0.62, bs.d*0.72];
  var t = CAMCFG.target || [0, 0, 0];
  CTRL = {
    target: new T.Vector3(num(t[0],0), num(t[1],0), num(t[2],0)),
    theta: Math.atan2(num(p[0],0) - num(t[0],0), num(p[2],0) - num(t[2],0)),
    phi: 0,
    radius: 0,
    minPolar: (num(CAMCFG.minPolar, 12)) * Math.PI/180,
    maxPolar: (num(CAMCFG.maxPolar, 82)) * Math.PI/180,
    minRadius: num(CAMCFG.minRadius, Math.max(bs.w,bs.d)*0.22),
    maxRadius: num(CAMCFG.maxRadius, Math.max(bs.w,bs.d)*2.4),
    autoSpeed: num(CAMCFG.autoRotateSpeed, 0.16),
    spin: CAMCFG.autoRotate === true,
    tween: null,
    drag: null
  };
  var dx = num(p[0],0)-num(t[0],0), dy = Math.max(1, num(p[1],0)-num(t[1],0)), dz = num(p[2],0)-num(t[2],0);
  CTRL.radius = Math.sqrt(dx*dx + dy*dy + dz*dz);
  CTRL.phi = Math.acos(clamp(dy / CTRL.radius, -1, 1));
  S.spin = CTRL.spin;

  var dom = S.renderer.domElement;
  var last = null;

  dom.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
  dom.addEventListener('pointerdown', function(ev){
    dom.setPointerCapture(ev.pointerId);
    last = { x:ev.clientX, y:ev.clientY, btn: ev.button };
    CTRL.tween = null;
    dom.style.cursor = 'grabbing';
  });
  dom.addEventListener('pointermove', function(ev){
    if (!last){ hoverAt(ev.clientX, ev.clientY); return; }
    var dx2 = ev.clientX - last.x, dy2 = ev.clientY - last.y;
    if (last.btn === 2 || ev.shiftKey){
      /* 平移：贴着观众屏幕平面走 */
      var speed = CTRL.radius * 0.0016;
      var right = new T.Vector3().setFromMatrixColumn(S.camera.matrix, 0);
      var fwd = new T.Vector3().setFromMatrixColumn(S.camera.matrix, 2);
      fwd.y = 0; fwd.normalize();
      CTRL.target.addScaledVector(right, -dx2*speed);
      CTRL.target.addScaledVector(fwd, dy2*speed);
    } else {
      CTRL.theta -= dx2 * 0.005;
      CTRL.phi = clamp(CTRL.phi - dy2 * 0.004, CTRL.minPolar, CTRL.maxPolar);
    }
    last.x = ev.clientX; last.y = ev.clientY;
  });
  dom.addEventListener('pointerup', function(ev){
    dom.releasePointerCapture && dom.releasePointerCapture(ev.pointerId);
    if (last && Math.abs(ev.clientX-last.x) < 3 && Math.abs(ev.clientY-last.y) < 3 && last.btn === 0){
      pickAt(ev.clientX, ev.clientY);
    }
    last = null;
    dom.style.cursor = 'grab';
  });
  dom.addEventListener('pointerleave', function(){ last = null; });
  dom.addEventListener('wheel', function(ev){
    ev.preventDefault();
    CTRL.tween = null;
    var k = Math.exp(clamp(ev.deltaY, -160, 160) * 0.0016);
    CTRL.radius = clamp(CTRL.radius * k, CTRL.minRadius, CTRL.maxRadius);
  }, { passive:false });
  dom.style.cursor = 'grab';

  applyCamera();
}

function applyCamera(){
  var c = CTRL, cam = S.camera;
  var sp = Math.sin(c.phi), cp = Math.cos(c.phi);
  cam.position.set(
    c.target.x + c.radius * sp * Math.sin(c.theta),
    c.target.y + c.radius * cp,
    c.target.z + c.radius * sp * Math.cos(c.theta)
  );
  cam.lookAt(c.target);
}

function flyTo(pos, target, ms){
  var c = CTRL;
  var tgt = new S.THREE.Vector3(num(target[0],0), num(target[1],0), num(target[2],0));
  var dx = num(pos[0],0)-tgt.x, dy = num(pos[1],0)-tgt.y, dz = num(pos[2],0)-tgt.z;
  var r = Math.sqrt(dx*dx+dy*dy+dz*dz);
  var phi = Math.acos(clamp(dy/r, -1, 1));
  c.tween = {
    t: 0, dur: (ms || 900)/1000,
    from: { theta:c.theta, phi:c.phi, radius:c.radius, target:c.target.clone() },
    to:   { theta: Math.atan2(dx, dz), phi: clamp(phi, c.minPolar, c.maxPolar), radius: r, target: tgt }
  };
}

function focusEntity(id){
  var rec = S.entMap[id];
  if (!rec) return;
  var p = rec.obj.getWorldPosition(new S.THREE.Vector3());
  var h = num((rec.def.size||[10])[1], 14);
  var dist = Math.max(46, h * 2.6);
  var theta = CTRL.theta;
  flyTo([
    p.x + Math.sin(theta) * dist * 0.9,
    p.y + dist * 0.78,
    p.z + Math.cos(theta) * dist * 0.9
  ], [p.x, p.y + h*0.35, p.z], 900);
}

function updateTween(dt){
  var c = CTRL;
  if (c.spin && !c.tween) c.theta += dt * c.autoSpeed;
  if (!c.tween) return;
  var tw = c.tween;
  tw.t = Math.min(1, tw.t + dt / tw.dur);
  var k = easeInOut(tw.t);
  c.theta = lerp(tw.from.theta, tw.to.theta, k);
  c.phi = lerp(tw.from.phi, tw.to.phi, k);
  c.radius = lerp(tw.from.radius, tw.to.radius, k);
  c.target.lerpVectors(tw.from.target, tw.to.target, k);
  if (tw.t >= 1) c.tween = null;
}

/* ── 拾取 ─────────────────────────────────── */
var RAY = null, VEC = null;
function pickEntity(clientX, clientY){
  var T = S.THREE;
  if (!RAY){ RAY = new T.Raycaster(); VEC = new T.Vector2(); }
  var rect = S.renderer.domElement.getBoundingClientRect();
  VEC.set(((clientX-rect.left)/rect.width)*2-1, -((clientY-rect.top)/rect.height)*2+1);
  RAY.setFromCamera(VEC, S.camera);
  var hits = RAY.intersectObjects(S.pickables, false);
  for (var i=0;i<hits.length;i++){
    var id = hits[i].object.userData.entityId;
    if (id && S.entMap[id] && S.entMap[id].obj.visible !== false) return id;
  }
  return null;
}

function pickAt(x, y){
  var id = pickEntity(x, y);
  selectEntity(id, true);
}

function hoverAt(x, y){
  var id = pickEntity(x, y);
  if (id === S.hoverId) return;
  S.hoverId = id;
  S.renderer.domElement.style.cursor = id ? 'pointer' : 'grab';
}

/* ══════════════════════════════════════════════════════════
   8. 主循环
   ══════════════════════════════════════════════════════════ */
var LAST = 0, ANIM_T = 0;

function animate(now){
  S.raf = requestAnimationFrame(animate);
  var t = (now || 0) / 1000;
  var dt = LAST ? Math.min(0.06, t - LAST) : 0.016;
  LAST = t;
  ANIM_T += dt;

  updateTween(dt);
  applyCamera();

  /* 推演时间推进 */
  if (S.playing){
    S.t = (S.t + dt) % Math.max(1, S.dur);
    if (S.t < dt) S.t = 0;
    syncTimeline(false);
  }
  var act = S.activity;

  /* 实体动画：车辆 / 管线流光 */
  for (var id in S.entMap){
    var ud = S.entMap[id].obj.userData;
    if (ud && ud.anim) ud.anim(ANIM_T, act);
  }
  /* 告警脉冲：装配期收集，避免每帧遍历全场景 */
  for (var pi=0; pi<S.pulsers.length; pi++){
    var pu = S.pulsers[pi].userData.pulse;
    if (pu) pu(ANIM_T);
  }
  updateLayerTweens(dt);

  S.renderer.render(S.scene, S.camera);
  if (S.needTagRefresh || (S.frame++ % 2 === 0)) updateTags();
}

/* ── 场景内 HTML 标签（不引 CSS2DRenderer，自己投影） ── */
function tagTargets(){
  var pri = [], sec = [];
  for (var id in S.entMap){
    var rec = S.entMap[id];
    var e = rec.def;
    if (e.label === false) continue;
    if (e.type === 'vehicle') continue;            /* 车多，标签只会糊成一片 */
    if (!S.layerMap[rec.layer] || !S.layerMap[rec.layer].on) continue;
    if (e.status && e.status !== 'normal') pri.push(rec);
    else if (e.name) sec.push(rec);
  }
  return pri.concat(sec).slice(0, 40);
}

function updateTags(){
  var T = S.THREE, layer = $('labels');
  var list = tagTargets();
  var placed = [];
  var i = 0;
  for (; i<list.length; i++){
    var rec = list[i];
    var el = S.tagPool[i];
    if (!el){
      el = document.createElement('div');
      el.className = 'sb-tag';
      layer.appendChild(el);
      S.tagPool[i] = el;
    }
    var e = rec.def;
    var cls = 'sb-tag';
    if (e.status && e.status !== 'normal') cls += ' ' + e.status;
    if (S.selected === e.id) cls += ' sel';
    el.className = cls;
    el.textContent = e.name || e.id;

    var p = rec.obj.getWorldPosition(new T.Vector3());
    var yOff = num((e.size||[0,10])[1], 10) * 0.5 + 6;
    if (e.type === 'tower' || e.type === 'plant' || e.type === 'warehouse') p.y += yOff;
    else p.y += 5;
    p.project(S.camera);
    if (p.z > 1 || p.z < -1){
      el.classList.remove('on');
      continue;
    }
    var x = (p.x * 0.5 + 0.5) * S.renderer.domElement.clientWidth;
    var y = (-p.y * 0.5 + 0.5) * S.renderer.domElement.clientHeight;

    /* 屏幕空间避让：普通标签互相压就直接不显示；告警与选中永远优先 */
    var important = (e.status && e.status !== 'normal') || S.selected === e.id;
    var clash = false;
    for (var pk=0; pk<placed.length; pk++){
      if (Math.abs(placed[pk][0]-x) < 52 && Math.abs(placed[pk][1]-y) < 15){ clash = true; break; }
    }
    if (clash && !important){ el.classList.remove('on'); continue; }
    placed.push([x, y]);
    el.style.transform = 'translate(-50%,-100%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    el.classList.add('on');
  }
  for (; i<S.tagPool.length; i++) S.tagPool[i].classList.remove('on');
  S.needTagRefresh = false;
}

function onResize(){
  if (!S.renderer) return;
  var stage = $('stage');
  var w = stage.clientWidth || window.innerWidth;
  var h = stage.clientHeight || window.innerHeight;
  S.camera.aspect = w / Math.max(1, h);
  S.camera.updateProjectionMatrix();
  S.renderer.setSize(w, h);
  S.needTagRefresh = true;
}

/* ══════════════════════════════════════════════════════════
   9. HUD 绑定
   ══════════════════════════════════════════════════════════ */
function buildUI(){
  /* 标题区 */
  $('sb-title').textContent = META.title || '数字沙盘';
  $('sb-sub').textContent = (META.subtitle || 'DIGITAL SANDBOX').toUpperCase();
  $('sb-badge').textContent = META.badge || '沙盘';
  document.title = (META.title || '数字沙盘') + (META.badge ? ' · ' + META.badge : '');

  /* 图层列表 */
  var box = $('layer-list');
  box.innerHTML = '';
  var total = 0;
  LAYERS.forEach(function(L){
    var rec = S.layerMap[L.id];
    if (!rec) return;
    total += rec.count;
    var row = document.createElement('div');
    row.className = 'layer' + (rec.on ? ' on' : '');
    row.dataset.layer = L.id;
    row.innerHTML = '<span class="sw"></span><span class="nm">' + (L.label || L.id) +
                    '</span><span class="ct">' + rec.count + '</span>';
    row.addEventListener('click', function(){
      var now = !S.layerMap[L.id].on;
      setLayer(L.id, now);
      row.classList.toggle('on', now);
    });
    box.appendChild(row);
  });
  var lc = $('layer-count');
  if (lc) lc.textContent = total + ' 项';

  /* KPI */
  var kg = $('kpi-grid');
  kg.innerHTML = '';
  KPIS.slice(0, 4).forEach(function(k){
    var d = document.createElement('div');
    d.className = 'kpi';
    var tr = (k.trend === undefined || k.trend === null) ? ''
           : '<div class="tr' + (num(k.trend,0) < 0 ? ' dn' : '') + '">' +
             (num(k.trend,0) >= 0 ? '+' : '') + num(k.trend,0) + '%</div>';
    d.innerHTML = '<div class="lb">' + (k.label || '') + '</div>' +
                  '<div class="vl">' + fmtVal(k.value, k.unit) + '</div>' + tr;
    kg.appendChild(d);
  });
  if (!KPIS.length) kg.style.display = 'none';

  /* 告警 */
  var al = $('alarm-list');
  al.innerHTML = '';
  ALARMS.forEach(function(a){
    var d = document.createElement('div');
    d.className = 'al ' + (a.level === 'warning' ? 'warning' : 'critical');
    d.innerHTML = '<span class="i"></span><span class="tx">' + (a.text || '') +
                  '</span><span class="tm">' + (a.time || '') + '</span>';
    if (a.entityId){
      d.addEventListener('click', function(){ selectEntity(a.entityId, true); });
    }
    al.appendChild(d);
  });
  if (!ALARMS.length){
    al.innerHTML = '<div style="font-size:11px;color:var(--ink-3);padding:3px 0">当前无告警</div>';
  }

  /* 机位 */
  var pb = $('preset-bar');
  pb.innerHTML = '';
  PRESETS.forEach(function(pr, i){
    var b = document.createElement('div');
    b.className = 'pbtn' + (i === 0 ? ' on' : '');
    b.textContent = pr.label || pr.id;
    b.addEventListener('click', function(){
      flyTo(pr.position || [0,200,300], pr.target || [0,0,0], 900);
      Array.prototype.forEach.call(pb.children, function(c){ c.classList.remove('on'); });
      b.classList.add('on');
    });
    pb.appendChild(b);
  });
  if (!PRESETS.length) pb.style.display = 'none';

  /* 时间轴 */
  var tl = $('hud-bottom');
  if (!TIMELINE.enabled){
    tl.style.display = 'none';
  } else {
    var track = $('tl-track');
    var frames = (TIMELINE.frames || []).slice().sort(function(a,b){ return num(a.t,0) - num(b.t,0); });
    frames.forEach(function(f){
      var pct = clamp(num(f.t,0) / Math.max(1, S.dur), 0, 1) * 100;
      var t = document.createElement('div');
      t.className = 'tl-tick';
      t.style.left = pct + '%';
      track.appendChild(t);
      if (f.label){
        var lb = document.createElement('div');
        lb.className = 'tl-lb';
        lb.style.left = pct + '%';
        lb.textContent = f.label;
        track.appendChild(lb);
      }
    });
    S.playing = TIMELINE.autoplay !== false;
    $('tl-play').addEventListener('click', function(){ setPlaying(!S.playing); });
    var seek = function(ev){
      var r = track.getBoundingClientRect();
      var k = clamp((ev.clientX - r.left) / Math.max(1, r.width), 0, 1);
      S.t = k * S.dur;
      syncTimeline(true);
    };
    var dragging = false;
    track.addEventListener('pointerdown', function(ev){ dragging = true; seek(ev); });
    window.addEventListener('pointermove', function(ev){ if (dragging) seek(ev); });
    window.addEventListener('pointerup', function(){ dragging = false; });
    syncTimeline(true);
  }

  /* 剖切 */
  var cr = $('clip-range');
  if (!CLIPCFG.enabled){
    $('clip-wrap').style.display = 'none';
  } else {
    cr.value = String(Math.round(num(CLIPCFG.value, 1) * 100));
    setClipRatio(num(CLIPCFG.value, 1));
    cr.addEventListener('input', function(){ setClipRatio(parseFloat(cr.value) / 100); });
  }

  /* 工具按钮 */
  $('btn-reset').addEventListener('click', function(){
    if (!CTRL){ FB.zoom = 1; FB.theta = Math.PI*0.25; return; }
    var pr = PRESETS[0];
    if (pr) flyTo(pr.position || [0,200,300], pr.target || [0,0,0], 800);
    else CTRL.target.set(0, 0, 0);
  });
  var spinBtn = $('btn-spin');
  if (CTRL){
    spinBtn.classList.toggle('on', !!CTRL.spin);
    spinBtn.addEventListener('click', function(){
      CTRL.spin = !CTRL.spin;
      spinBtn.classList.toggle('on', CTRL.spin);
    });
  } else {
    spinBtn.classList.add('on');
    spinBtn.addEventListener('click', function(){
      FB.auto = !FB.auto;
      spinBtn.classList.toggle('on', FB.auto);
    });
  }

  /* 时钟 */
  var clock = $('sb-clock');
  var tick = function(){
    var d = new Date();
    var p2 = function(n){ return n < 10 ? '0' + n : '' + n; };
    clock.textContent = p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
  };
  tick(); setInterval(tick, 1000);

  setMode(CTRL ? '写实三维' : '等距二维', !!CTRL);
}

/* ── 图层显隐：不碰材质（材质是共享的），用「从沙盘里升起/落下」的表达 ── */
var LAYER_TWEENS = [];
function setLayer(id, on){
  var rec = S.layerMap[id];
  if (!rec || rec.on === on) return;
  rec.on = on;
  S.needTagRefresh = true;
  if (!rec.group) return;                    /* 二维降级：只改状态，重绘时生效 */
  if (on) rec.group.visible = true;
  LAYER_TWEENS.push({
    grp: rec.group, t: 0, dur: num(0.26, 0.26), on: on,
    fromS: rec.group.scale.y, fromY: rec.group.position.y
  });
  S.needTagRefresh = true;
}

function updateLayerTweens(dt){
  for (var i=LAYER_TWEENS.length-1; i>=0; i--){
    var tw = LAYER_TWEENS[i];
    tw.t = Math.min(1, tw.t + dt / tw.dur);
    var k = easeInOut(tw.t);
    if (tw.on){
      tw.grp.scale.y = lerp(tw.fromS, 1, k);
      tw.grp.position.y = lerp(tw.fromY, 0, k);
    } else {
      tw.grp.scale.y = lerp(tw.fromS, 0.02, k);
      tw.grp.position.y = lerp(tw.fromY, -10, k);
    }
    if (tw.t >= 1){
      if (!tw.on) tw.grp.visible = false;
      tw.grp.scale.y = 1;
      tw.grp.position.y = 0;
      LAYER_TWEENS.splice(i, 1);
    }
  }
}

/* ── 选中详情 ─────────────────────────────── */
function selectEntity(id, focus){
  S.selected = id;
  S.needTagRefresh = true;
  var empty = $('ins-empty'), body = $('ins-body');
  if (!id || !S.entMap[id]){
    body.classList.remove('on');
    empty.style.display = 'block';
    return;
  }
  var e = S.entMap[id].def;
  empty.style.display = 'none';
  body.classList.add('on');
  $('ins-name').textContent = e.name || e.id;
  $('ins-type').textContent = (e.type || '') + ' / ' + id;
  var st = $('ins-status');
  var stt = e.status || 'normal';
  var stMap = { normal:'正常运行', warn:'预警', alarm:'告警', off:'离线' };
  st.innerHTML = '<span class="st ' + stt + '">' + (stMap[stt] || stt) + '</span>';

  var mbox = $('ins-metrics');
  mbox.innerHTML = '';
  (e.metrics || []).forEach(function(m){
    var pct = m.pct !== undefined ? clamp(num(m.pct, 0), 0, 100) : null;
    var d = document.createElement('div');
    d.className = 'mt';
    d.innerHTML = '<div class="mt-h"><span>' + (m.label || '') + '</span><b>' +
                  (m.value === undefined ? '--' : m.value) + '</b></div>' +
                  (pct === null ? '' : '<div class="mt-t"><div class="mt-f" style="width:' + pct + '%"></div></div>');
    mbox.appendChild(d);
  });
  if (!(e.metrics || []).length){
    mbox.innerHTML = '<div style="font-size:11px;color:var(--ink-3)">该实体未配置指标</div>';
  }
  if (focus) focusEntity(id);
}

/* ── 时间轴 ───────────────────────────────── */
function setPlaying(v){
  S.playing = v;
  var b = $('tl-play');
  if (!b) return;
  b.innerHTML = v
    ? '<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>'
    : '<svg viewBox="0 0 12 12"><path d="M2 1l8 5-8 5z"/></svg>';
}

function syncTimeline(force){
  var frames = (TIMELINE.frames || []);
  if (!frames.length) return;
  var sorted = frames.slice().sort(function(a,b){ return num(a.t,0) - num(b.t,0); });
  var act = num(sorted[0].activity, 1), label = sorted[0].label || '';
  for (var i=0;i<sorted.length;i++){
    var f = sorted[i], next = sorted[i+1];
    if (next && S.t >= num(f.t,0) && S.t < num(next.t,0)){
      var k = (S.t - num(f.t,0)) / Math.max(0.001, num(next.t,0) - num(f.t,0));
      act = lerp(num(f.activity,1), num(next.activity,1), k);
      label = k < 0.5 ? (f.label || '') : (next.label || '');
      break;
    }
    if (!next){ act = num(f.activity,1); label = f.label || ''; }
  }
  S.activity = act;
  var pct = clamp(S.t / Math.max(1, S.dur), 0, 1);
  var fill = $('tl-fill'), knob = $('tl-knob'), lb = $('tl-label');
  if (fill) fill.style.width = (pct*100).toFixed(2) + '%';
  if (knob) knob.style.left = (pct*100).toFixed(2) + '%';
  if (lb) lb.textContent = label + ' ' + Math.round(pct*100) + '%';
  if (force){
    Array.prototype.forEach.call(document.querySelectorAll('.tl-lb'), function(el){
      el.classList.toggle('on', el.textContent === label);
    });
  }
}

/* ══════════════════════════════════════════════════════════
   10. 二维等距降级（无 WebGL / three 拉不下来时）
   ══════════════════════════════════════════════════════════ */
var FB = { theta: Math.PI*0.25, zoom: 1, canvas:null, ctx:null, dpr:1, drag:null, t:0, auto:false };

function fallback2D(reason){
  if (S.mode === '2d' || S.mode === '3d') return;
  S.mode = '2d';
  $('boot').classList.add('out');
  var wrap = $('fallback');
  wrap.classList.add('on');
  FB.canvas = $('fb-canvas');
  FB.ctx = FB.canvas.getContext('2d');
  FB.dpr = Math.min(window.devicePixelRatio || 1, 2);
  $('fb-tip').textContent = '浏览器未启用三维渲染（' + (reason || 'WebGL 不可用') + '）\n已切换为等距二维沙盘，交互与图层仍可用';

  /* 降级态仍需 HUD：手工建立图层/实体索引，详情卡与告警回挂照常可用 */
  LAYERS.forEach(function(L){
    var on = L.on !== false;
    S.layerMap[L.id] = { def:L, group:null, color:L.color || '#35e0ff', on:on, count:(L.entities||[]).length };
    (L.entities || []).forEach(function(e){
      if (e && e.id) S.entMap[e.id] = { def:e, obj:null, layer:L.id };
    });
  });
  buildUI();
  setMode('等距二维', false);

  var resize = function(){
    FB.canvas.width = wrap.clientWidth * FB.dpr;
    FB.canvas.height = wrap.clientHeight * FB.dpr;
    FB.canvas.style.width = wrap.clientWidth + 'px';
    FB.canvas.style.height = wrap.clientHeight + 'px';
  };
  resize();
  window.addEventListener('resize', function(){ resize(); });

  FB.canvas.addEventListener('pointerdown', function(e){
    FB.drag = { x:e.clientX, theta:FB.theta };
  });
  window.addEventListener('pointermove', function(e){
    if (!FB.drag) return;
    FB.theta = FB.drag.theta + (e.clientX - FB.drag.x) * 0.006;
  });
  window.addEventListener('pointerup', function(){ FB.drag = null; });
  FB.canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    FB.zoom = clamp(FB.zoom * Math.exp(-e.deltaY * 0.0012), 0.4, 3);
  }, { passive:false });

  var loop = function(){
    FB.t += 0.016;
    if (FB.auto) FB.theta += 0.0018;
    draw2D();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);

  /* 降级态同样暴露接口，验证脚本与外部数据接入不必区分模式 */
  window.sandbox = {
    version: '0.1.0',
    cfg: CFG,
    state: S,
    mode: function(){ return S.mode; },
    stats: function(){
      return {
        mode: S.mode,
        layers: Object.keys(S.layerMap).length,
        entities: Object.keys(S.entMap).length,
        pickables: 0,
        tags: 0, calls: -1, triangles: -1
      };
    },
    select: function(id){
      if (!id || !S.entMap[id]) return false;
      selectEntity(id, false);
      return true;
    },
    update: function(id, patch){ return updateEntity(id, patch); },
    updateAll: function(list){
      var n = 0;
      (list || []).forEach(function(it){ if (it && updateEntity(it.id, it)) n++; });
      return n;
    },
    layer: function(id, on){ setLayer(id, !!on); return S.layerMap[id] ? S.layerMap[id].on : false; },
    clip: function(){ return false; },
    preset: function(i){ var pr = PRESETS[i]; if (!pr) return false; FB.theta = Math.PI*0.25; return true; },
    play: function(v){ setPlaying(v !== false); return S.playing; },
    seek: function(t){ S.t = clamp(num(t,0), 0, S.dur); syncTimeline(true); return S.t; }
  };
  window.__SANDBOX_READY__ = true;
}

function draw2D(){
  var ctx = FB.ctx, cv = FB.canvas;
  if (!ctx) return;
  var W = cv.width / FB.dpr, H = cv.height / FB.dpr;
  ctx.setTransform(FB.dpr, 0, 0, FB.dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  var bs = baseSize();
  var scale = Math.min(W / (bs.w + bs.d) * 1.55, H / ((bs.w + bs.d) * 0.55)) * FB.zoom;
  var cx = W / 2, cy = H / 2 + (bs.w + bs.d) * 0.06 * scale;
  var ct = Math.cos(FB.theta), st = Math.sin(FB.theta);

  function P(x, y, z){
    var rx = x*ct - z*st, rz = x*st + z*ct;
    return [cx + (rx - rz) * 0.866 * scale, cy + (rx + rz) * 0.5 * scale - y * scale];
  }
  function poly(pts, fill, stroke, lw){
    ctx.beginPath();
    for (var i=0;i<pts.length;i++){
      var p = pts[i];
      if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
    }
    ctx.closePath();
    if (fill){ ctx.fillStyle = fill; ctx.fill(); }
    if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
  }
  function depthOf(x, z){ return (x*ct - z*st) + (x*st + z*ct); }

  /* 底座 */
  var hw = bs.w/2, hd = bs.d/2;
  poly([P(-hw,0,-hd), P(hw,0,-hd), P(hw,0,hd), P(-hw,0,hd)], 'rgba(12,30,44,.95)', 'rgba(53,224,255,.55)', 1.5);
  poly([P(-hw,-bs.h,-hd), P(-hw,0,-hd), P(hw,0,-hd), P(hw,-bs.h,-hd)], 'rgba(6,16,24,.95)');
  poly([P(hw,-bs.h,hd), P(hw,0,hd), P(hw,0,-hd), P(hw,-bs.h,-hd)], 'rgba(9,22,32,.95)');

  /* 收集可绘制实体并按深度排序 */
  var items = [];
  function addFor(L){
    var rec = S.layerMap[L.id];
    if (!rec || !rec.on) return;
    (L.entities || []).forEach(function(e){
      var isPt = POINT_TYPES[e.type];
      var pos = e.position || [0,0,0];
      var d = isPt ? depthOf(num(pos[0],0), num(pos[2],0)) : 0;
      if (e.type === 'road' || e.type === 'pipe' || e.type === 'zone'){
        var pts = e.points || e.polygon || [];
        if (pts.length) d = depthOf(num(pts[0][0],0), num(pts[0][pts.length > 2 ? 2 : 1],0));
      }
      items.push({ e:e, L:L, d:d, pos:pos });
    });
  }
  LAYERS.forEach(addFor);
  items.sort(function(a,b){ return a.d - b.d; });

  items.forEach(function(it){
    var e = it.e, L = it.L, col = L.color || '#35e0ff';
    var pos = it.pos;
    var x = num(pos[0],0), z = num(pos[2],0);

    if (e.type === 'road' || e.type === 'pipe'){
      var pts = e.points || [];
      if (pts.length < 2) return;
      ctx.beginPath();
      for (var i=0;i<pts.length;i++){
        var p = P(num(pts[i][0],0), 0.5, num(pts[i][2],0));
        if (i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);
      }
      ctx.strokeStyle = e.type === 'pipe' ? col : 'rgba(140,170,190,.5)';
      ctx.lineWidth = e.type === 'pipe' ? 2 : Math.max(2, num(e.width,12) * scale * 0.5);
      ctx.lineCap = 'round';
      ctx.stroke();
      return;
    }
    if (e.type === 'zone'){
      var pg = e.polygon || [];
      if (pg.length < 3) return;
      poly(pg.map(function(p){ return P(num(p[0],0), 0.4, num(p[1],0)); }),
           (e.color || col) + '22', (e.color || col) + '99', 1);
      return;
    }
    if (e.type === 'vehicle'){
      var path = e.path || e.points || [];
      if (path.length < 2) return;
      var k = ((FB.t * 0.05 + num(e.phase,0.5)) % 1);
      var idx = Math.min(path.length-1, Math.floor(k * (path.length-1)));
      var pv = P(num(path[idx][0],0), 1.4, num(path[idx][2],0));
      ctx.beginPath(); ctx.arc(pv[0], pv[1], 2.6, 0, 6.2832);
      ctx.fillStyle = '#dff2fb'; ctx.fill();
      return;
    }
    if (e.type === 'tree'){
      var n = Math.max(1, Math.round(num(e.count,1)));
      for (var j=0;j<n;j++){
        var tx = x + (j%5 - 2) * 6, tz = z + (Math.floor(j/5) - 2) * 6;
        var tp = P(tx, 3, tz);
        ctx.beginPath(); ctx.arc(tp[0], tp[1], 2.2*scale*0.06 + 1.4, 0, 6.2832);
        ctx.fillStyle = 'rgba(90,150,100,.8)'; ctx.fill();
      }
      return;
    }

    /* 体块类：楼宇 / 厂房 / 仓储 / 通用 */
    var sz = e.size || [20,18,20];
    var w = num(sz[0],20), h = num(sz[1],18), dd = num(sz[2],20);
    var hwid = z;
    var p0 = P(x-w/2, 0, z-dd/2), p1 = P(x+w/2, 0, z-dd/2),
        p2 = P(x+w/2, 0, z+dd/2), p3 = P(x-w/2, 0, z+dd/2);
    var t0 = P(x-w/2, h, z-dd/2), t1 = P(x+w/2, h, z-dd/2),
        t2 = P(x+w/2, h, z+dd/2), t3 = P(x-w/2, h, z+dd/2);
    var stc = statusColor(e.status);
    poly([p1, p2, t2, t1], 'rgba(20,40,56,.92)');
    poly([p2, p3, t3, t2], 'rgba(13,28,40,.92)');
    poly([t0, t1, t2, t3], 'rgba(52,86,110,.96)', stc, 1);
    if (e.name && h > 12){
      ctx.fillStyle = 'rgba(200,230,245,.7)';
      ctx.font = '10px "PingFang SC",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(e.name, (t0[0]+t2[0])/2, (t0[1]+t2[1])/2 - 4);
    }
    void hwid;
  });
}

function setMode(label, ok){
  var el = $('sb-mode');
  if (!el) return;
  el.textContent = label;
  el.className = ok ? 'ok' : '';
}

/* ══════════════════════════════════════════════════════════
   11. 启动：three 三源回退 → 三维场景 / 二维降级
   ══════════════════════════════════════════════════════════ */
var THREE_SOURCES = (CFG.threeSources && CFG.threeSources.length) ? CFG.threeSources : [
  'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js',
  'https://unpkg.com/three@0.149.0/build/three.min.js',
  'https://cdn.staticfile.org/three.js/0.149.0/three.min.js'
];

function loadScript(src, timeout){
  return new Promise(function(resolve, reject){
    var s = document.createElement('script');
    var done = false;
    var timer = setTimeout(function(){
      if (done) return;
      done = true; s.remove(); reject(new Error('timeout ' + src));
    }, timeout || 6000);
    s.src = src; s.async = true;
    s.onload = function(){ if (done) return; done = true; clearTimeout(timer); resolve(); };
    s.onerror = function(){ if (done) return; done = true; clearTimeout(timer); reject(new Error('error ' + src)); };
    document.head.appendChild(s);
  });
}

async function boot(){
  var errs = [];
  for (var i=0;i<THREE_SOURCES.length;i++){
    try {
      await loadScript(THREE_SOURCES[i], 6000);
      if (window.THREE && window.THREE.WebGLRenderer) break;
    } catch(e){ errs.push(e.message); }
  }
  if (!window.THREE || !window.THREE.WebGLRenderer){
    console.warn('[sandbox] three 加载失败', errs);
    fallback2D('three 未加载');
    return;
  }
  /* WebGL 可用性探测：某些沙箱/远程桌面能加载 three 但拿不到上下文 */
  try {
    var probe = document.createElement('canvas');
    var gl = probe.getContext('webgl2') || probe.getContext('webgl');
    if (!gl) throw new Error('no webgl context');
  } catch(e){
    fallback2D('WebGL 不可用');
    return;
  }

  S.THREE = window.THREE;
  S.mode = '3d';
  try {
    initTextures();
    initScene();
    requestAnimationFrame(animate);
    $('boot').classList.add('out');
    setTimeout(function(){ var b = $('boot'); if (b && b.parentNode) b.parentNode.removeChild(b); }, 700);
  } catch(e){
    console.error('[sandbox] 场景初始化失败', e);
    S.mode = 'boot';
    fallback2D('场景初始化失败');
    return;
  }

  /* 外部可编程接口：接真实数据、做自动化验证都走这里 */
  window.sandbox = {
    version: '0.1.0',
    cfg: CFG,
    state: S,
    mode: function(){ return S.mode; },
    stats: function(){
      var r = S.renderer;
      return {
        mode: S.mode,
        layers: Object.keys(S.layerMap).length,
        entities: Object.keys(S.entMap).length,
        pickables: S.pickables.length,
        tags: document.querySelectorAll('.sb-tag.on').length,
        calls: r ? r.info.render.calls : -1,
        triangles: r ? r.info.render.triangles : -1
      };
    },
    select: function(id){ selectEntity(id, true); return true; },
    update: function(id, patch){ return updateEntity(id, patch); },
    updateAll: function(list){
      var n = 0;
      (list || []).forEach(function(it){ if (it && updateEntity(it.id, it)) n++; });
      return n;
    },
    layer: function(id, on){ setLayer(id, !!on); return S.layerMap[id] ? S.layerMap[id].on : false; },
    clip: function(r){ setClipRatio(r); return S.clip.on; },
    preset: function(i){
      var pr = PRESETS[i];
      if (!pr) return false;
      flyTo(pr.position || [0,200,300], pr.target || [0,0,0], 900);
      return true;
    },
    play: function(v){ setPlaying(v !== false); return S.playing; },
    seek: function(t){ S.t = clamp(num(t,0), 0, S.dur); syncTimeline(true); return S.t; }
  };
  window.__SANDBOX_READY__ = true;
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
