<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>数字孪生原型 · 参数化骨架</title>
<style>
  :root{
    --bg:#050b14; --panel:rgba(11,24,42,.74); --panel-2:rgba(9,18,33,.92);
    --line:rgba(0,229,255,.20); --line-2:rgba(0,229,255,.38);
    --txt:#dbe9f7; --txt-2:#8fa8c4; --txt-3:#5d7691;
    --cyan:#00e5ff; --blue:#3b82f6; --ok:#22d3a6; --warn:#faad14; --crit:#ff4d4f; --purple:#8b5cf6;
    --r:10px; --shadow:0 10px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  #stage{position:absolute;inset:0}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

  /* ---------- 通用玻璃面板 + 四角装饰（ThreeUI 风格 HUD） ---------- */
  .panel{
    position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);
  }
  .panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}
  .panel::before{left:-1px;top:-1px;border-left:2px solid var(--cyan);border-top:2px solid var(--cyan)}
  .panel::after{right:-1px;bottom:-1px;border-right:2px solid var(--cyan);border-bottom:2px solid var(--cyan)}
  .p-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);
    font-size:13px;font-weight:700;letter-spacing:.5px}
  .p-hd i{width:3px;height:13px;background:var(--cyan);border-radius:2px;box-shadow:0 0 8px var(--cyan)}
  .p-bd{padding:10px 12px;font-size:12px}

  /* ---------- 顶栏 ---------- */
  #topbar{left:16px;right:16px;top:14px;height:56px;display:flex;align-items:center;
    padding:0 16px;gap:16px;z-index:20}
  #topbar h1{margin:0;font-size:18px;letter-spacing:1px;font-weight:700}
  #topbar .sub{font-size:12px;color:var(--txt-2);margin-top:2px}
  .chips{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
  .chip{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);
    background:rgba(0,229,255,.07);color:var(--txt-2);white-space:nowrap}
  .chip.mock{border-color:rgba(250,173,20,.45);color:var(--warn);background:rgba(250,173,20,.10)}
  .chip.live{border-color:rgba(34,211,166,.45);color:var(--ok);background:rgba(34,211,166,.10)}

  /* ---------- 左栏：KPI + 设备清单 ---------- */
  #left{left:16px;top:84px;width:270px;bottom:96px;display:flex;flex-direction:column;z-index:15}
  #left .scroll{overflow:auto;padding:10px 12px;flex:1}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi{background:rgba(0,229,255,.06);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .kpi .v{font-size:19px;font-weight:700;color:#fff;line-height:1.15;
    font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(0,229,255,.35)}
  .kpi .v small{font-size:11px;color:var(--txt-2);margin-left:2px;font-weight:400}
  .kpi .l{font-size:11px;color:var(--txt-2);margin-top:3px}
  .devlist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .dev{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;
    border:1px solid transparent;background:rgba(255,255,255,.02);transition:.15s}
  .dev:hover{background:rgba(0,229,255,.10);border-color:var(--line-2)}
  .dev.on{background:rgba(0,229,255,.16);border-color:var(--cyan)}
  .dev .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dev .nm{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dev .st{font-size:11px;color:var(--txt-3)}

  /* ---------- 右栏：信息弹窗 ---------- */
  #right{right:16px;top:84px;width:296px;max-height:calc(100% - 200px);z-index:15;display:flex;flex-direction:column}
  #right .scroll{overflow:auto;padding:10px 12px}
  .prop{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
  .prop .k{color:var(--txt-2);font-size:12px}
  .prop .v{font-size:12px;color:#fff;text-align:right;word-break:break-all}
  .mt{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
  .mt .bar{flex:1;margin:0 8px;height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;align-self:center}
  .mt .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}
  .empty{color:var(--txt-3);font-size:12px;text-align:center;padding:26px 0;line-height:1.9}

  /* ---------- 底栏：漫游控制 + 图例 + 性能 ---------- */
  #bottom{left:16px;right:16px;bottom:14px;height:70px;display:flex;align-items:center;
    padding:0 14px;gap:14px;z-index:20}
  .btn{font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;user-select:none;
    border:1px solid var(--line-2);background:rgba(0,229,255,.08);color:var(--txt);transition:.15s}
  .btn:hover{background:rgba(0,229,255,.20)}
  .btn.on{background:var(--cyan);color:#04202b;border-color:var(--cyan);font-weight:700}
  .btn.ghost{border-color:rgba(255,255,255,.14);background:transparent;color:var(--txt-2)}
  .legend{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
  .lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt-2)}
  .lg i{width:9px;height:9px;border-radius:2px;display:block}
  .perf{font-size:11px;color:var(--txt-3);font-variant-numeric:tabular-nums;white-space:nowrap}
  .seg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt-2)}
  .seg input[type=range]{width:100px;accent-color:var(--cyan)}

  /* ---------- 3D 标签 ---------- */
  .tag{pointer-events:auto;cursor:pointer;transform:translate(-50%,-100%);
    background:rgba(6,18,32,.86);border:1px solid var(--line-2);border-radius:5px;
    padding:3px 8px;font-size:11px;line-height:1.35;color:#eaf6ff;white-space:nowrap;
    box-shadow:0 3px 12px rgba(0,0,0,.55);transition:.15s}
  .tag:hover{background:rgba(0,229,255,.24);border-color:var(--cyan);z-index:20}
  .tag .s{font-size:9px;margin-left:5px;padding:0 4px;border-radius:3px}
  .tag .s.ok{background:rgba(34,211,166,.18);color:var(--ok)}
  .tag .s.warn{background:rgba(250,173,20,.18);color:var(--warn)}
  .tag .s.crit{background:rgba(255,77,79,.20);color:var(--crit)}
  .tag .s.off{background:rgba(255,255,255,.10);color:var(--txt-3)}
  .tag.alarm{border-color:var(--crit);animation:bl 1.1s infinite}
  @keyframes bl{0%,100%{box-shadow:0 0 0 rgba(255,77,79,0)}50%{box-shadow:0 0 16px rgba(255,77,79,.75)}}

  /* ---------- 悬浮提示 ---------- */
  #tip{position:absolute;z-index:60;pointer-events:none;display:none;
    background:rgba(4,14,26,.94);border:1px solid var(--cyan);border-radius:6px;
    padding:6px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.6);max-width:260px}
  #tip b{color:#fff}
  #tip .m{color:var(--txt-2);font-size:11px}

  /* ---------- 加载遮罩 ---------- */
  #loading{position:absolute;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 40%,#0a1a2f 0%,#04080f 70%)}
  #loading .box{text-align:center;width:280px}
  #loading .t{font-size:14px;letter-spacing:2px;color:var(--cyan)}
  #loading .bar{margin:14px 0 8px;height:3px;background:rgba(255,255,255,.10);border-radius:2px;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));
    transition:width .25s}
  #loading .p{font-size:12px;color:var(--txt-3);font-variant-numeric:tabular-nums}
  #loading.off{opacity:0;pointer-events:none;transition:opacity .5s}

  /* ---------- 屏幕自适应 ---------- */
  @media (max-width:1440px){#left{width:238px}#right{width:262px}}
  @media (max-width:1180px){
    #right{display:none}
    #left{width:214px}
    .legend{display:none}
  }
  @media (max-width:900px){
    #left{display:none}
    #topbar h1{font-size:15px}
  }
  .hide{display:none !important}
.wbtn{display:inline-flex;align-items:center;padding:3px 9px;margin-right:2px;border-radius:4px;
  border:1px solid var(--line);color:var(--txt-2);cursor:pointer;font-size:12px;user-select:none;
  transition:.15s}
.wbtn:hover{color:var(--txt-1);border-color:var(--cyan)}
.wbtn.on{background:rgba(0,229,255,.14);border-color:var(--cyan);color:var(--cyan)}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>

  <div id="topbar" class="panel">
    <div>
      <h1 id="ui-title">数字孪生原型</h1>
      <div class="sub" id="ui-sub">参数化骨架 · Mock 数据</div>
    </div>
    <div class="chips">
      <span class="chip" id="ui-scene">场景：—</span>
      <span class="chip mock" id="ui-mode">数据模式：Mock</span>
      <span class="chip" id="ui-count">资产：0</span>
    </div>
  </div>

  <div id="left" class="panel">
    <div class="p-hd"><i></i><span>业务指标</span></div>
    <div class="scroll">
      <div class="kpis" id="ui-kpis"></div>
      <div class="p-hd" style="margin:12px -12px 8px;border-top:1px solid var(--line)">
        <i></i><span>设备清单</span></div>
      <div class="devlist" id="ui-devs"></div>
    </div>
  </div>

  <div id="right" class="panel">
    <div class="p-hd"><i></i><span>对象详情</span><span style="margin-left:auto;color:var(--txt-3);
      font-weight:400;cursor:pointer" id="ui-close">✕</span></div>
    <div class="scroll" id="ui-info">
      <div class="empty">点击场景中的设备<br/>或左侧清单查看详情</div>
    </div>
  </div>

  <div id="bottom" class="panel">
    <span class="btn" id="btn-play">▶ 巡检漫游</span>
    <span class="btn ghost" id="btn-reset">重置机位</span>
    <span class="btn ghost" id="btn-fit">自动取景</span>
    <span class="seg"><label>速度</label><input type="range" id="ui-speed" min="0.3" max="3" step="0.1" value="1" /><b id="ui-speed-v" style="color:var(--cyan);width:26px">1×</b></span>
    <span class="btn ghost" id="btn-label">标签</span>
    <span class="btn ghost" id="btn-alarm">告警</span>
    <span class="btn ghost" id="btn-wire">线框</span>
    <span class="seg"><label>时段</label>
      <span class="wbtn on" data-w="day">白天</span><span class="wbtn" data-w="sunset">黄昏</span
      ><span class="wbtn" data-w="night">夜晚</span><span class="wbtn" data-w="cyber">科技</span>
    </span>
    <div class="legend">
      <span class="lg"><i style="background:var(--ok)"></i>正常</span>
      <span class="lg"><i style="background:var(--warn)"></i>预警</span>
      <span class="lg"><i style="background:var(--crit)"></i>告警</span>
      <span class="lg"><i style="background:var(--txt-3)"></i>停用</span>
    </div>
    <span class="btn ghost" id="ui-tier" title="画质档位：点击循环切换（P 键同效）">画质 均衡</span>
    <span class="perf" id="ui-perf">FPS —</span>
  </div>

  <div id="tip"></div>

  <div id="loading">
    <div class="box">
      <div class="t">SCENE LOADING</div>
      <div class="bar"><i id="ldbar"></i></div>
      <div class="p" id="ldtxt">0%</div>
    </div>
  </div>
</div>

<script id="twin-boot">
/* --- CDN 探测回退链：unpkg → jsdelivr → 友好报错 ---
   引擎源码在下方 text/plain 槽（惰性），探测成功后注入 importmap，
   再以 Blob URL 动态 import 唤醒。importmap 每文档仅允许一份，
   故导入期失败不走换源重试，直接给出重试按钮。 */
(function () {
  var CDNS = [
    'https://unpkg.com/three@0.160.0/',
    'https://cdn.jsdelivr.net/npm/three@0.160.0/'
  ];
  var i = 0;
  function fail() {
    var box = document.querySelector('#loading .box');
    if (!box) { alert('三维引擎加载失败：CDN 不可达'); return; }
    box.innerHTML =
      '<div class="t" style="color:#ff8585">三维引擎加载失败</div>' +
      '<div style="color:#9fb4c8;font:12px/1.7 system-ui;margin:12px 0 14px">' +
      'unpkg / jsdelivr 均不可达，请检查网络（或代理）后重试。</div>' +
      '<button onclick="location.reload()" style="cursor:pointer;background:#1c6dd0;color:#fff;' +
      'border:0;border-radius:4px;padding:7px 26px;font:13px system-ui">重新加载</button>';
  }
  function probe() {
    if (i >= CDNS.length) { fail(); return; }
    var base = CDNS[i];
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); else { i++; probe(); } }, 6000);
    fetch(base + 'package.json', { mode: 'cors', signal: ctl ? ctl.signal : undefined })
      .then(function (r) {
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var im = document.createElement('script');
        im.type = 'importmap';
        im.textContent = JSON.stringify({ imports: {
          'three': base + 'build/three.module.js',
          'three/addons/': base + 'examples/jsm/'
        }});
        document.head.appendChild(im);
        window.__TWIN_CDN__ = base;          // Draco else 分支等跟随同一 CDN
        var src = document.getElementById('twinEngineSrc').textContent;
        var url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
        import(url).catch(fail);
      })
      .catch(function () { clearTimeout(timer); i++; probe(); });
  }
  probe();
})();
</script>
<script type="text/plain" id="twinEngineSrc">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }      from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }     from 'three/addons/loaders/DRACOLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Sky }             from 'three/addons/objects/Sky.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
/* v0.3 写实增强：后处理链（GTAO 环境光遮蔽 / Bloom 辉光 / SMAA 抗锯齿 / OutputPass 色调映射） */
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass }        from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass }        from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { RGBELoader }      from 'three/addons/loaders/RGBELoader.js';
import { SSRPass }         from 'three/addons/postprocessing/SSRPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';

/* =========================================================================
 * 1. 默认配置（一切靠它驱动；外部可用 window.__TWIN_CONFIG__ 覆盖任意片段）
 * ========================================================================= */
const DEFAULT_CONFIG = {
  meta: { title: '大宗商品仓储园区 · 数字孪生', subtitle: '参数化原型 · Mock 数据', dataMode: 'mock' },
  sceneType: 'warehouse',                 // warehouse | plant | park | bulk
  /* 环境：preset 决定光照与天空；day/sunset 默认物理天空 shader（Sky），night/cyber 走渐变穹顶 */
  env: {
    preset: 'day',                        // day | sunset | night | cyber
    sky: 'shader',                        // shader（物理天空） | hdri（实拍 HDR 天空，最逼真） | texture（sky-*.jpg） | gradient（纯渐变）
    bgTop: '#0b2545', bgBottom: '#03080f',// cyber 风格 / 贴图缺失时的渐变兜底
    realism: true,                        // 写实模式：弱化青色描边、关科技网格、启接触阴影
    edgeOpacity: 0.12,                    // 写实模式下构件描边透明度（ realism=false 时用 0.35 ）
    ground: '#0e1c2c', gridColor: '#123049', gridSize: 600, gridDivisions: 60,
    gridOpacity: 0.06,                    // 科技网格线强度；写实风建议 <=0.2，设 0 则完全隐藏
    groundTex: 'concrete',                // lawn | concrete | asphalt | none —— 地面贴图
    groundTexRepeat: 8,   // 高对比裂缝类贴图（concrete/asphalt）高空 repeat>10 出斑马纹；低对比贴图（lawn）可用 24-40，按对比度定
    haze: [0x081422, 320, 1100],          // [color, near, far]
    exposure: 1.05, sunDirection: [120, 160, 80], sunIntensity: 2.2
  },
  /* 贴图：路径由 scaffold 注入（DEFAULT_TEXTURES → 内联成 data URI）。
     留空 / 加载失败 → 自动回退程序化纯色，断网照样能跑。
     这里不写死路径：骨架同时存在于「模块脚本」与「离线 bundle」两处，写死会让
     同一张图被内联两遍（体积翻倍），也会在 file:// 下留下必然失败的请求。 */
  textures: {},
  camera: {
    fov: 45, position: [150, 105, 175], target: [0, 8, 0],
    autoFit: true,                        // 装配完成后按资产包围盒自动取景（配置改完不担心跑出画面）
    minDistance: 25, maxDistance: 900, maxPolarAngle: 1.47, autoRotate: false, autoRotateSpeed: 0.35
  },
  performance: { maxPixelRatio: 2, shadows: true, shadowMapSize: 2048, antialias: true, cullGrid: true,
    /* v0.3 写实后处理链：GTAO + Bloom + SMAA。全部可关，关掉即退回 v0.2 直出管线 */
    postfx: true,                       // 总开关（false = 完全不建 composer）
    ao: true,                           // GTAO 环境光遮蔽：墙角/设备底部/堆叠缝隙的暗角，真实感第一来源
    aoRadius: 3.2,                      // AO 采样半径（米）：大场地 3~4，室内小场景 0.5~1
    aoIntensity: 1.25,                  // AO 混合强度（0.6 保守 / 1.0 标准 / >1 更戏剧）
    aoThickness: 1.5,                   // 遮挡厚度
    bloom: true,                        // 辉光：夜景灯光/告警光柱/自发光面板
    bloomStrength: 0.32,                // 白天要低（0.3 左右），夜景由 applyWeather 自动提到 ~0.85
    bloomThreshold: 1.6,                // 亮度阈值：作用在 tone mapping 前的 HDR 线性域！
                                        // 0.9 的旧默认连亮天空都在辉光（黄昏整幅白雾）；
                                        // 1.6 只让灯光/高光发光。夜景灯光 intensity>2，依然有效
    bloomRadius: 0.5,
    smaa: true,                         // 后处理抗锯齿（走 composer 后 MSAA 失效，靠 SMAA 补）
    ssr: true,                          // 屏幕空间反射（v0.5）：罐体/集装箱倒映天空与地面，金属玻璃质感关键
    ssrIntensity: 0.55,                 // 反射强度（0.3 保守 / 0.55 标准 / 1.0 全镜面）
    ssrMaxDistance: 120,                // 反射追踪距离（米），大场地可放大
    ssrThickness: 0.5,
    /* v0.11 集成显卡适配：画质档位。'auto' = 按 GPU 型号自动挑，也可显式指定档位名 */
    quality: 'auto',                    // auto | potato | low | medium | high | ultra
    autoQuality: true,                  // 运行时掉帧自动降档（调速器）
    staticShadows: true,                // 静态场景：相机不动就不重画阴影图（集显最大一笔省下的开销）

/* --- GPU 探测：临时 canvas 取 UNMASKED_RENDERER，用完立刻失活，不占上下文 --- */
function detectGPU(){
  const info = { renderer:'', vendor:'', igpu:false, software:false, mobile:false, tier:'medium' };
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl2') || c.getContext('webgl');
    if (gl){
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg){
        info.renderer = String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '');
        info.vendor   = String(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)   || '');
      }
      const lose = gl.getExtension('WEBGL_lose_context'); if (lose) lose.loseContext();
    }
  } catch(e){}
  const R = (info.renderer + ' ' + info.vendor).toLowerCase();
  if (/swiftshader|llvmpipe|softwarerasterizer|basic render|microsoft basic/.test(R)) info.software = true;
  else if (/nvidia|geforce|rtx|quadro|radeon|rx [0-9]|vega|apple m[0-9]/.test(R)) info.igpu = false;
  else if (/intel|uhd|hd graphics|iris|arc/.test(R)) info.igpu = true;
  else if (/mali|adreno|powervr|apple a[0-9]/.test(R)){ info.igpu = true; info.mobile = true; }
  else if (/apple gpu/.test(R)) info.igpu = true;

  let t;
  if (info.software)                       t = 'potato';
  else if (info.mobile)                    t = 'low';
  else if (info.igpu){
    if (/iris|arc|uhd *7|uhd *graphics *7/.test(R)) t = 'medium';       // Iris Xe / Arc / 11 代后 UHD
    else if (/hd graphics|uhd/.test(R))             t = 'low';          // HD 4000~620 / UHD 600~620
    else                                            t = 'medium';
  } else                                   t = 'high';                  // 独显
  // 弱 CPU（≤4 线程）再降一档：集显机器上 CPU 往往是同一颗，几何提交也会拖后腿
  const cores = navigator.hardwareConcurrency || 8;
  if (cores <= 4 && TIER_ORDER.indexOf(t) > 0) t = TIER_ORDER[TIER_ORDER.indexOf(t) - 1];
  info.tier = t;
  return info;
}

      const bw = Math.max(1, Math.round(w * bScale)), bh = Math.max(1, Math.round(h * bScale));
      bloomPass = new UnrealBloomPass(new THREE.Vector2(bw, bh),
        (P.bloomStrength != null) ? P.bloomStrength : 0.32,
        (P.bloomRadius != null) ? P.bloomRadius : 0.5,
        (P.bloomThreshold != null) ? P.bloomThreshold : 0.9);
      const _bloomResize = bloomPass.setSize.bind(bloomPass);
      bloomPass.setSize = (W, H) => _bloomResize(Math.max(1, Math.round(W * bScale)),
                                                 Math.max(1, Math.round(H * bScale)));
      composer.addPass(bloomPass);
    }
    if (P.smaa){
      try { smaaPass = new SMAAPass(w, h); composer.addPass(smaaPass); }
      catch(e){ smaaPass = null; }                    // SMAA 依赖内嵌纹理数据，失败不影响主链
    }
    composer.addPass(new OutputPass());               // tone mapping + sRGB
    if (P.grade !== false){                            // v0.6 电影调色：对比度/饱和度/暗角（显示空间，可控）
      try {
        gradePass = new ShaderPass({
          uniforms: {
            tDiffuse: { value: null },
            uContrast:   { value: (P.gradeContrast != null) ? P.gradeContrast : 1.05 },
            uSaturation: { value: (P.gradeSaturation != null) ? P.gradeSaturation : 1.03 },
            uVignette:   { value: (P.gradeVignette != null) ? P.gradeVignette : 0.18 }
          },
          vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float uContrast; uniform float uSaturation; uniform float uVignette;
            varying vec2 vUv;
            void main(){
              vec4 c = texture2D(tDiffuse, vUv);
              c.rgb = (c.rgb - 0.5) * uContrast + 0.5;
              float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
              c.rgb = mix(vec3(l), c.rgb, uSaturation);
              vec2 uv = vUv - 0.5;
              c.rgb *= 1.0 - uVignette * smoothstep(0.35, 0.95, length(uv));
              gl_FragColor = c;
            }`
        });
        composer.addPass(gradePass);                   // 链尾：电影调色
      } catch(e){ gradePass = null; }
    }
  } catch(e){
    // 软件渲染 / 老设备 / 显存不足：整链废弃，退回 v0.2 的直出管线，页面照常可用
    console.warn('[twin] 后处理链不可用，回退直出渲染：', e && e.message);
    composer = null; gtaoPass = null; bloomPass = null; smaaPass = null;
  }
}
function setPostFX(on){                               // 调试入口：tw.setPostFX(false)
  if (!on && composer){
    /* v0.11：显式释放 RT。集显上 composer 的 RT 加起来可以有几百 MB，
       只置 null 不 dispose，显存要等 GC —— 切档来回几次就 OOM（WebGL context lost）*/
    try {
      for (const p of composer.passes) if (p && p.dispose) p.dispose();
      if (composer.renderTarget1) composer.renderTarget1.dispose();
      if (composer.renderTarget2) composer.renderTarget2.dispose();
    } catch(e){}
  }
  CONFIG.performance.postfx = !!on;
  composer = null; gtaoPass = null; bloomPass = null; smaaPass = null; ssrPass = null; gradePass = null;
  if (on) setupPostFX();
  return !!composer;
}

/* =========================================================================
 * 2c. v0.11 运行时画质管理（切档 / 像素比 / 静态阴影 / 距离剔除 / 调速器）
 * ========================================================================= */
function syncPixelRatio(){
  const P = CONFIG.performance;
  const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
  const pr = Math.min(window.devicePixelRatio || 1, P.maxPixelRatio || 1);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  if (composer){ composer.setPixelRatio(pr); composer.setSize(w, h); }
}

/* 切档：除贴图分辨率（已解码的拉不回来）外全部即时生效 */
function applyQualityRuntime(name, reason){
  const tier = QUALITY_TIERS[name];
  if (!tier) return false;
  const P = CONFIG.performance;
  const prev = CURRENT_QUALITY;
  if (prev === name && !reason) return true;
  CURRENT_QUALITY = name;
  for (const k of Object.keys(tier)) if (k !== 'label') P[k] = tier[k];
  P.quality = name;

  // 阴影：开关 / 类型 / 分辨率（换分辨率必须 dispose 旧 map，否则 three 复用小尺寸贴图 → 糊成一片）
  renderer.shadowMap.enabled = !!P.shadows;
  renderer.shadowMap.type = (P.shadowMapSize <= 1024) ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = !P.staticShadows;
  if (typeof sun !== 'undefined' && sun){
    sun.castShadow = !!P.shadows;
    if (sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }
    sun.shadow.mapSize.set(P.shadowMapSize, P.shadowMapSize);
    if (typeof SHADOW_MAP !== 'undefined') SHADOW_MAP = P.shadowMapSize;
  }
  renderer.shadowMap.needsUpdate = true;

  // 后处理：整链重建（比逐个 pass 改参数可靠）
  setPostFX(!!P.postfx);
  syncPixelRatio();
  buildCullList();
  markShadowDirty();
  updateQualityChip(reason || '');
  return true;
}

/* --- 小物件距离剔除：货箱子位 / 护栏 / 斜撑 / 树 / 立柱，远处本来就只有几个像素 --- */
const CULLABLES = [];
function insideGLB(o){                                  // 沿父链判断是否属于外部 GLB 资产
  let p = o;
  while (p){ if (p.userData && p.userData.glbRoot) return true; p = p.parent; }
  return false;
}
function buildCullList(){
  CULLABLES.length = 0;
  const P = CONFIG.performance;
  if (!P.cullDistance) return;
  scene.traverse(o => {
    if (!o.isMesh || o.isInstancedMesh || !o.geometry || !o.visible) return;
    /* ⚠️ GLB 模型的子网格绝不能剔：一个储罐拆成罐壳/法兰/爬梯十几个 mesh，
       每个的包围球半径都不到 2m，按「小零件」规则会被整批隐藏 —— 罐体直接凭空消失
       （v11 首版实测：1号/2号储罐只剩地上两个接触阴影圈）。 */
    if (insideGLB(o)) return;
    const g = o.geometry;
    if (!g.boundingSphere) g.computeBoundingSphere();
    const bs = g.boundingSphere;
    if (!bs) return;
    const sc = Math.max(o.scale.x, o.scale.y, o.scale.z) || 1;
    const r = bs.radius * sc;
    if (r <= 0.02 || r > 2.6) return;                    // 只剔"小零件"，大件一律不碰
    o.updateWorldMatrix(true, false);
    const wp = new THREE.Vector3().setFromMatrixPosition(o.matrixWorld);
    /* 剔除距离按尺寸分档：0.5m 的纸箱 90m 外看不见，2m 的护栏 220m 外还行。
       再乘 detail 系数（低档更激进），上限由 cullDistance 兜底 */
    const base = (r < 0.6) ? 90 : (r < 1.2) ? 170 : 240;
    const lim = Math.min(base * (0.55 + 0.45 * (P.detail || 1)), P.cullDistance);
    CULLABLES.push({ o, wp, lim2: lim * lim, vis: true });
  });
}
let cullFrame = 0;
function tickCull(){
  if (!CULLABLES.length) return;
  if ((cullFrame++ & 3) !== 0) return;                   // 每 4 帧检查一次，摊薄开销
  const cp = camera.position;
  for (let i = 0; i < CULLABLES.length; i++){
    const c = CULLABLES[i];
    const v = cp.distanceToSquared(c.wp) < c.lim2;
    if (v !== c.vis){ c.vis = v; c.o.visible = v; }
  }
}

/* --- 静态阴影：只在相机移动中每 0.2s 刷一次，停稳后补一张就彻底停手 --- */
const _shadowCam = new THREE.Vector3(), _shadowTgt = new THREE.Vector3();
let _shadowIdle = 0, _shadowDirty = true;
function markShadowDirty(){ _shadowDirty = true; _shadowIdle = 0; }
function tickStaticShadow(dt){
  const P = CONFIG.performance;
  if (!P.shadows || !P.staticShadows) { return; }
  const moved = camera.position.distanceToSquared(_shadowCam) > 0.02 ||
                controls.target.distanceToSquared(_shadowTgt) > 0.02;
  if (moved){
    _shadowCam.copy(camera.position); _shadowTgt.copy(controls.target);
    _shadowIdle = 0; _shadowDirty = true;
  } else _shadowIdle += dt;
  if (_shadowDirty || (moved && _shadowIdle === 0)) renderer.shadowMap.needsUpdate = true;
  _shadowDirty = false;
}

/* --- 自适应调速器：真掉帧就自动降一档，别让用户自己找菜单 --- */
const GOVERNOR = { ring: [], cooldown: 3.0, warmup: 0, drops: 0 };
function governorTick(dt){
  const P = CONFIG.performance;
  if (!P.autoQuality) return;
  GOVERNOR.warmup += dt;
  if (GOVERNOR.warmup < 5.0) return;                     // 启动期（PMREM/贴图解码）必然卡，不判定
  GOVERNOR.cooldown -= dt;
  GOVERNOR.ring.push(dt);
  if (GOVERNOR.ring.length > 90) GOVERNOR.ring.shift();
  if (GOVERNOR.ring.length < 60 || GOVERNOR.cooldown > 0) return;
  let s = 0; for (const v of GOVERNOR.ring) s += v;
  const avg = s / GOVERNOR.ring.length;
  const fps = 1 / Math.max(avg, 1e-4);
  if (fps < 26){                                          // 低于 26fps 认为不可接受
    /* 降级顺序：先降渲染分辨率（最线性、最不心疼），降到 0.6× 还卡才降档。
       直接降档会让画面"啪"地掉一个档次（AO 没了/货箱变少），体验反而更差 */
    if (P.maxPixelRatio > 0.62){
      P.maxPixelRatio = Math.max(0.6, P.maxPixelRatio - 0.15);
      syncPixelRatio();
      GOVERNOR.ring.length = 0; GOVERNOR.cooldown = 3.0; GOVERNOR.drops++;
      console.info('[twin] 掉帧：渲染分辨率降至', P.maxPixelRatio.toFixed(2), '×（实测', fps.toFixed(1), 'fps）');
      updateQualityChip('降分辨率 ' + P.maxPixelRatio.toFixed(2) + '×');
      return;
    }
    const i = TIER_ORDER.indexOf(CURRENT_QUALITY);
    if (i > 0){
      applyQualityRuntime(TIER_ORDER[i - 1], '掉帧自动降档');
      GOVERNOR.ring.length = 0; GOVERNOR.cooldown = 3.5; GOVERNOR.drops++;
      console.info('[twin] 自动降档 →', CURRENT_QUALITY, '（实测', fps.toFixed(1), 'fps）');
    }
  }
}
function updateQualityChip(extra){
  const el = document.getElementById('ui-tier');
  if (!el) return;
  const t = QUALITY_TIERS[CURRENT_QUALITY];
  el.textContent = '画质 ' + (t ? t.label : CURRENT_QUALITY) + (extra ? '（' + extra + '）' : '');
  el.title = 'GPU：' + (GPU.renderer || '未知') + '\n点击切换档位（P 键也可）';
}

/* --- 时段预设：一次切换光照 / 雾 / 曝光 / 天空贴图 ---
   注意：Sky 的 PMREM 环境贴图本身就提供了大量漫射光（IBL），
   hemi/amb/fill 必须压得很低，否则阴影区被填白、对比度消失（过曝 = 一眼假）。 */
const WEATHER = {
  // bloom：辉光强度。白天必须低（阳光已很亮，再发光就过曝发白），夜景靠它撑灯光质感
  // v0.3 曝光校准：sun×exposure（进入 ACES 的线性亮度尺度）应落在 1.2~2.2，
  // 旧版 day 是 6.5×0.72=4.7，过曝 2~3 档 —— 中灰地面直接推到 0.85+，整幅泛白"雪原"
  // v0.3 雾色校准：day/sunset 的雾原来是亮蓝白（0xc6daec），600m 场地远端整片"白纱"
  day:    { sun:2.4,  sunColor:0xfff3e0, hemiSky:0xbcd8ff, hemiGround:0x6d7a58, hemi:0.40,
            amb:0.16, fill:0.16, fillColor:0xbcd8ff, fog:0x8fa5b8, exposure:0.95, bloom:0.20 },
  sunset: { sun:1.6,  sunColor:0xffb070, hemiSky:0xffb27a, hemiGround:0x3a3f52, hemi:0.08,
            amb:0.02, fill:0.05, fillColor:0xff9a6a, fog:0xa8826a, exposure:0.7, bloom:0.22 },
  night:  { sun:0.18, sunColor:0x9fc0ff, hemiSky:0x2a4a7a, hemiGround:0x0b1622, hemi:0.05,
            amb:0.015, fill:0.05, fillColor:0x3f7fd6, fog:0x0a1526, exposure:0.8, bloom:0.85 },
  cyber:  { sun:1.1,  sunColor:0xffffff, hemiSky:0x9fd4ff, hemiGround:0x0b1622, hemi:0.20,
            amb:0.08, fill:0.16, fillColor:0x3f7fd6, fog:0x081422, exposure:0.95, bloom:0.42 }
};
const SKY_TEX_OF = { day:'skyDay', sunset:'skySunset', night:'skyNight', cyber:null };
/* HDRI 时段映射 + PMREM 环境贴图缓存（PMREM 昂贵，同一天空只预滤波一次） */
const HDRI_OF = { day:'hdriDay', sunset:'hdriSunset' };
const HDRI_ENV = new Map();   // hdr url -> { bg: equirectTex, env: pmremTex }

/* --- 贴图加载：带缓存 + 静默失败（失败即保持程序化回退，页面绝不报错） --- */
const TEX_CACHE = new Map();
/* scaffold 内联的补充贴图（normal/rough 由命名约定运行时推导，HTML 文本里不出现，
   由 scaffold 注入 window.__TWIN_TEX_URI__ 映射；手动维护页面时忽略即可） */
function texURI(u){ return (window.__TWIN_TEX_URI__ || {})[u] || u; }
/* v0.11：贴图降采样。集显共享系统内存，2048² 三通道（albedo+normal+rough）
   全量上传就是几十 MB 的显存 + 每帧采样带宽；1080p 下和 1024² 肉眼几乎无差。
   canvas 缩放后直接顶替 t.image —— 此刻贴图尚未上传（首次 render 才上传），安全。 */
function downscaleImage(img, max){
  const w = img.width || img.naturalWidth || 0, h = img.height || img.naturalHeight || 0;
  if (!w || !h) return img;
  const m = Math.max(w, h);
  if (m <= max) return img;
  const s = max / m;
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s));
  c.height = Math.max(1, Math.round(h * s));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function loadTex(url, cb){
  if (!url) return;
  url = texURI(url);
  if (TEX_CACHE.has(url)){ if (cb) cb(TEX_CACHE.get(url)); return; }
  new THREE.TextureLoader().load(url, (t) => {
    const cap = (CONFIG.performance && CONFIG.performance.texMaxSize) || 2048;
    if (t.image){
      const small = downscaleImage(t.image, cap);
      if (small !== t.image){ t.image = small; t.needsUpdate = true; }
    }
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = THREE.SRGBColorSpace;
    // 各向异性过滤：地面/道路贴图在大视角（俯视+斜看）下极易糊成一片，
    // 16 是主流 GPU 上限——这一行对"清晰=真实"的收益比贴图升分辨率更高
    // v0.11：低档位降到 4，各向异性采样同样吃显存带宽（集显最缺的就是带宽）
    const anisoCap = cap >= 2048 ? 16 : (cap >= 1024 ? 8 : 4);
    try { t.anisotropy = Math.min(anisoCap, renderer.capabilities.getMaxAnisotropy() || 1); } catch(e){}
    TEX_CACHE.set(url, t);
    if (cb) cb(t);
  }, undefined, () => {});
}
/* 取贴图路径（配置里没配 → 返回 null，构件自动走纯色回退） */
const T = (k) => (CONFIG.textures || {})[k] || null;

/* --- HDRI 实拍天空（Poly Haven CC0 .hdr）加载：等距柱状 → 背景 + PMREM 环境反射 --- */
const HDR_CACHE = new Map();
const rgbeLoader = new RGBELoader();
function loadHDR(url, cb){
  if (!url) return;
  url = texURI(url);
  if (HDR_CACHE.has(url)){ if (cb) cb(HDR_CACHE.get(url)); return; }
  rgbeLoader.load(url, (t) => {
    t.mapping = THREE.EquirectangularReflectionMapping;
    /* HDR 是线性数据，不做 sRGB 转换（RGBELoader 默认即 LinearSRGBColorSpace） */
    HDR_CACHE.set(url, t);
    if (cb) cb(t);
  }, undefined, () => {});
}

/* v0.6：IBL（环境反射）默认强度按天空模式自适应。
   旧 0.15 是 Preetham 程序天空时代的防过曝值（Sky shader 太阳周边 radiance 极高，
   0.5 会把中灰材质洗白 40%+ 亮度）；HDRI 实拍天空的 radiance 是真实有限动态范围，
   0.15 会把天空漫反射 + 金属镜面反射一起掐死（暗部死灰、罐体哑光塑料感）。
   HDRI 下提到 0.40，shader/贴图天空保持 0.15 不变。 */
const IBL_DEFAULT = (CONFIG.env && CONFIG.env.sky === 'hdri') ? 0.40 : 0.15;

/* 生成一个「贴图材质」：先返回纯色材质，贴图到位后自动替换（不阻塞装配）
   命名约定：url 为 xxx.jpg 时，自动挂载同目录 xxx-normal.png / xxx-rough.jpg（存在才挂） */
function texMat(url, rx, ry, opts){
  const m = new THREE.MeshStandardMaterial(Object.assign({ color:0xffffff, roughness:0.9, metalness:0.05,
    /* v0.6：IBL 默认强度。必须在这里显式给默认值 —— MeshStandardMaterial 自带
       envMapIntensity=1（非 null），applyEnvMaps 里的 == null 判断永远不命中。
       HDRI 实拍天空下用 IBL_DEFAULT=0.40，Preetham 程序天空保持 0.15 防过曝 */
    envMapIntensity: IBL_DEFAULT }, opts || {}));
  PBR_MATS.push(m);                                   // 登记：时段切换时统一刷新 envMap
  if (skyEnvMap){ m.envMap = skyEnvMap;
    /* v0.3：默认 0.15。物理天空 PMREM 的 radiance 极高（太阳周边尤甚），
       0.5 的旧默认会让 IBL 反射贡献全场 40%+ 亮度，把中灰材质整片"洗白"。
       金属/玻璃类构件用 opts.envMapIntensity 显式调高。 */
    if (m.envMapIntensity == null) m.envMapIntensity = IBL_DEFAULT; }
  if (!url) return m;
  loadTex(url, (t) => {
    const c = t.clone(); c.needsUpdate = true;
    c.repeat.set(rx || 1, ry || rx || 1);
    // 贴图到位后基色复位为白（或 opts.tint）：避免深色兜底色把贴图压暗；
    // tint 让同一张贴图可派生多档色相（台阶岩层色带 / 排土场分层）
    m.map = c; m.color.set(opts && opts.tint != null ? opts.tint : 0xffffff); m.needsUpdate = true;
  });
  const rep = () => { const c = m.map; return c ? [c.repeat.x, c.repeat.y] : [rx || 1, ry || rx || 1]; };
  const nUrl = url.replace(/\.(jpg|jpeg|png)$/i, '-normal.png');
  const rUrl = url.replace(/\.(jpg|jpeg|png)$/i, '-rough.jpg');
  loadTex(nUrl, (t) => {                       // 法线：微观几何（混凝土麻面 / 钢板波纹 / 草地起伏）
    const c = t.clone(); c.needsUpdate = true;
    const [px, py] = rep(); c.repeat.set(px, py);
    m.normalMap = c;
    const ns = (opts && opts.normalScale != null) ? opts.normalScale : 0.9;
    m.normalScale.set(ns, ns); m.needsUpdate = true;
  });
  loadTex(rUrl, (t) => {                       // 粗糙度：G 通道乘区（锈迹 / 磨光 / 脏污）
    const c = t.clone(); c.needsUpdate = true;
    const [px, py] = rep(); c.repeat.set(px, py);
    m.roughnessMap = c;
    // 贴图 G 均值约 0.5：把基准粗糙度提到 2 倍，使最终观感接近调用方语义
    if (m.roughness != null) m.roughness = Math.min(1, m.roughness * 2);
    m.needsUpdate = true;
  });
  return m;
}
/* 给已有材质挂贴图 */
function withTex(mat, url, rx, ry){
  if (!url) return mat;
  loadTex(url, (t) => {
    const c = t.clone(); c.needsUpdate = true;
    c.repeat.set(rx || 1, ry || rx || 1);
    mat.map = c; mat.needsUpdate = true;
  });
  return mat;
}

/* --- 渐变天空穹顶（cyber 风格 / 贴图缺失时的兜底） --- */
function skyGradMaterial(env){
  return new THREE.ShaderMaterial({
    uniforms: { top:{value:new THREE.Color(env.bgTop)}, bottom:{value:new THREE.Color(env.bgBottom)} },
    vertexShader: [
      'varying vec3 vPos;',
      'void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }'
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 top; uniform vec3 bottom; varying vec3 vPos;',
      'void main(){ float h = normalize(vPos).y * 0.5 + 0.5;',

const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(2400, 48, 24), skyGradMaterial(CONFIG.env));

/* --- 环境贴图（金属/玻璃反射用，无 HDR 文件也能有质感） --- */
const pmrem = new THREE.PMREMGenerator(renderer);

   场景里其他物体（如接触阴影的透明面片）整批不渲染（实测踩坑，逐项二分定位）。
   材质级 envMap 是每个 program 的 texture binding，无此问题。 */
let skyEnvMap = null;
const PBR_MATS = [];                  // 所有需要环境反射的材质（mat/texMat 创建时登记）
function applyEnvMaps(){
  for (const m of PBR_MATS){
    if (!m.isMeshStandardMaterial && !m.isMeshPhysicalMaterial) continue;
    m.envMap = skyEnvMap;
    /* 未显式定制的材质（含直接 new 的）压到 0.15；构造默认值 1 无法与"用户显式传 1"区分，
       但显式传高强度的构件都 ≠ 1，故此处把 1 视为未定制是安全的 */
    if (m.envMapIntensity == null || m.envMapIntensity === 1) m.envMapIntensity = IBL_DEFAULT;
    m.needsUpdate = true;

/* --- 物理天空（Preetham 模型）：太阳方向 = 灯光方向，天空与环境反射物理一致 ---

   架构：Sky mesh 只存在于专用 skyScene，由 CubeCamera 渲成 cube render target，
   主场景只挂 scene.background（three 内部 background box，depthTest:false 且最先绘制，
   与场景物体零交互）—— Sky mesh 若直接进主场景，其全屏 fragment 在部分软件渲染器
   （SwiftShader）上会盖掉同帧其他不透明物体（实测踩坑：接触阴影整片消失）。 */
const skyScene = new THREE.Scene();                 // PMREM 专用 scene：只装天空，避免把地面几何烘焙进环境贴图

const skyCubeCam = new THREE.CubeCamera(0.1, 100000, skyCubeRT);
const SKY_PRESETS = {
  day:    { turbidity: 6.0,  rayleigh: 2.2, mie: 0.005, g: 0.80 },
  sunset: { turbidity: 9.0,  rayleigh: 3.6, mie: 0.008, g: 0.86 },
  night:  { turbidity: 12.0, rayleigh: 0.7, mie: 0.004, g: 0.75 },
  cyber:  { turbidity: 14.0, rayleigh: 1.4, mie: 0.006, g: 0.80 }
};
function sunDirVec(){ return new THREE.Vector3().fromArray(CONFIG.env.sunDirection).normalize(); }
function applySkyPreset(p){
  const s = SKY_PRESETS[p] || SKY_PRESETS.day, u = skyDome.material.uniforms;
  u.turbidity.value = s.turbidity; u.rayleigh.value = s.rayleigh;
  u.mieCoefficient.value = s.mie; u.mieDirectionalG.value = s.g;
  /* v0.3：分时段调整"天空里的太阳"位置。Preetham 天空没有夜晚概念——
     只要太阳在天上，rayleigh 再低夜空也是白的（实测夜景全屏泛白的根因）。
     night 把太阳沉到地平线以下，夜间照明交给月光(低强度 DirectionalLight)
     与人工光源；sunset 把太阳压到地平线附近，橙红浓霞。 */
  const d = sunDirVec();
  if (p === 'night'){
    u.sunPosition.value.set(d.x, -Math.abs(d.y) - 60, d.z);
  } else if (p === 'sunset'){
    u.sunPosition.value.set(d.x, Math.max(6, d.y * 0.10), d.z);
  } else {
    u.sunPosition.value.copy(d);

}
function refreshSkyEnv(){
  skyCubeCam.update(renderer, skyScene);            // Sky → cube RT（background 源）
  scene.background = skyCubeRT.texture;

  skyEnvMap = rt.texture;

/* --- 灯光：半球 + 主光（带阴影） + 补光 --- */
const hemiLight = new THREE.HemisphereLight(0x9fd4ff, 0x0b1622, 0.85); scene.add(hemiLight);

/* --- 时段切换：光照 + 雾 + 曝光 + 天空背景 一步到位 --- */
let curWeather = CONFIG.env.preset || 'day';
function applyWeather(p){
  const w = WEATHER[p] || WEATHER.day;
  curWeather = p; CONFIG.env.preset = p;
  markShadowDirty();                                   // v0.11：换时段后静态阴影图必须重画一张
  sun.intensity = w.sun; sun.color.setHex(w.sunColor);
  hemiLight.intensity = w.hemi; hemiLight.color.setHex(w.hemiSky); hemiLight.groundColor.setHex(w.hemiGround);
  ambLight.intensity = w.amb;
  fillLight.intensity = w.fill; fillLight.color.setHex(w.fillColor);
  renderer.toneMappingExposure = w.exposure;
  if (bloomPass && w.bloom != null) bloomPass.strength = w.bloom;   // 夜景辉光自动加强

  if (mode === 'hdri'){                              // 实拍 HDR：背景走物理天空，envMap 用 HDRI 真实反射
    const hurl = HDRI_OF[p] && (CONFIG.textures || {})[HDRI_OF[p]];
    if (hurl){
      /* 数字孪生多为俯视视角：equirect 全景的地平线以下（植被/地面）会顶进背景里，
         看起来像"灰雾地面"。故背景仍用 Preetham skyDome（任意朝向都是天空），
         HDRI 专职贡献 PMREM 环境反射——罐体/集装箱倒映真实天空（含云层亮度层次），
         比 Preetham 的完美平滑天空更接近实拍。 */
      applySkyPreset(p);
      skyMesh.visible = false;
      refreshSkyEnv();                               // 背景 = Preetham cube RT（俯视正确）
      const cached = HDRI_ENV.get(hurl);
      if (cached){
        skyEnvMap = cached.env; applyEnvMaps();
      } else {
        loadHDR(hurl, (tex) => {
          const rt = pmrem.fromEquirectangular(tex);
          skyEnvMap = rt.texture;
          HDRI_ENV.set(hurl, { bg: null, env: skyEnvMap });
          applyEnvMaps();
        });
      }
      return;
    }
    /* 该时段无 HDR（night/cyber）→ 落到下方 shader / gradient 兜底 */
  }
  if (mode === 'shader' && p !== 'cyber'){           // 物理天空：cube RT 背景 + PMREM 环境反射
    applySkyPreset(p);
    skyMesh.visible = false;
    refreshSkyEnv();
    return;
  }
  const key = SKY_TEX_OF[p], url = (mode === 'texture') && key && (CONFIG.textures || {})[key];
  if (url){                                          // texture 模式：等距柱状全景贴图
    loadTex(url, (t) => {
      const tt = t.clone(); tt.needsUpdate = true;
      tt.mapping = THREE.EquirectangularReflectionMapping;
      scene.background = tt;
      skyEnvMap = tt; applyEnvMaps();                // 金属/玻璃反射直接采样真实天空
      skyMesh.visible = false;
    });
    return;
  }
  scene.background = null; skyMesh.visible = true;   // cyber / gradient 模式：渐变穹顶
  if (skyMesh.material) skyMesh.material.dispose();
  skyMesh.material = skyGradMaterial(CONFIG.env);
  skyEnvMap = pmremEnv; applyEnvMaps();
}

/* --- 地面：贴图化（含法线/粗糙度）+ 可选科技网格线 --- */
function buildGround(env){
  const g = new THREE.Group();
  /* 注意：texMat 在贴图加载完成后会把 color 复位成白（或 opts.tint）。
     想让 env.ground 真正压住地面亮度，必须走 tint —— 只写 color 会被贴图覆盖掉。
     groundTint 缺省时保持旧行为（贴图原色），不破坏既有预设。 */
  const gOpts = { color: env.ground, roughness: 0.95, metalness: 0.04 };
  if (env.groundTint != null) gOpts.tint = env.groundTint;
  const groundMat = texMat((CONFIG.textures || {})[env.groundTex], env.groundTexRepeat, env.groundTexRepeat, gOpts);
  /* env.pitHole = {x, z, rx, rz}：地面在采场开口处挖椭圆洞（Shape + hole），
     露出坑内台阶与坡面；洞口略小于采场境界，坑壁从洞口中"长出"，不露缝。
     有洞口时科技网格线整体关闭（否则网格会飘在洞口上方）。 */
  const hole = env.pitHole;
  let ground;
  if (hole && hole.rx){
    const half = env.gridSize / 2;
    const sh = new THREE.Shape();
    sh.moveTo(-half, -half); sh.lineTo(half, -half); sh.lineTo(half, half); sh.lineTo(-half, half); sh.closePath();
    const p = new THREE.Path();
    p.absellipse(hole.x || 0, -(hole.z || 0), hole.rx, hole.rz, 0, Math.PI * 2, true);
    sh.holes.push(p);
    ground = new THREE.Mesh(new THREE.ShapeGeometry(sh, 24), groundMat);
    ground.rotation.x = -Math.PI / 2;
  } else {
    ground = new THREE.Mesh(new THREE.PlaneGeometry(env.gridSize, env.gridSize), groundMat);
    ground.rotation.x = -Math.PI / 2;
  }
  ground.receiveShadow = CONFIG.performance.shadows;
  g.add(ground);
  const op = (hole && hole.rx) ? 0 : (env.gridOpacity == null ? 0.28 : env.gridOpacity);
  if (op > 0){
    const grid = new THREE.GridHelper(env.gridSize, env.gridDivisions,
      new THREE.Color(env.gridColor), new THREE.Color(env.gridColor));
    grid.material.transparent = true; grid.material.opacity = op;
    grid.position.y = 0.02;
    g.add(grid);
  }
  return g;
}
const groundGroup = buildGround(CONFIG.env);
scene.add(groundGroup);
applyWeather(curWeather);                    // 首次应用时段（之后可由底部工具条切换）

/* =========================================================================
 * 3. 通用工具：材质 / 线框描边 / 标签 / 加载进度

const pickables = [];      // 可拾取对象（Mesh，带 userData.assetId）
const assets = new Map();  // id -> { cfg, object3d, label, baseMaterials[] }
const pulsing = [];        // 需要呼吸动画的材质

/* 以下状态量在「场景装配」阶段就会被读取（applyStatus → renderDeviceList），

let selected = null, helper = null, tween = null;
let alarmOn = true, wireOn = false, labelOn = CONFIG.labels.show;

function mat(color, opts = {}){
  const m = new THREE.MeshStandardMaterial(Object.assign({
    color: new THREE.Color(color), roughness: 0.55, metalness: 0.25,
    envMapIntensity: IBL_DEFAULT   // 同 texMat：显式默认，opts 可覆盖（金属/玻璃传更高值）
  }, opts));
  PBR_MATS.push(m);                                   // 登记：时段切换时统一刷新 envMap
  if (skyEnvMap){ m.envMap = skyEnvMap;
    /* v0.3：默认 0.15。物理天空 PMREM 的 radiance 极高（太阳周边尤甚），
       0.5 的旧默认会让 IBL 反射贡献全场 40%+ 亮度，把中灰材质整片"洗白"。
       金属/玻璃类构件用 opts.envMapIntensity 显式调高。 */
    if (m.envMapIntensity == null) m.envMapIntensity = IBL_DEFAULT; }

}
/* 写实模式下描边透明度由配置决定（科技风 0.35 / 写实风默认 0.12） */
function edgeOpacity(){
  return CONFIG.env.realism ? (CONFIG.env.edgeOpacity == null ? 0.12 : CONFIG.env.edgeOpacity) : 0.35;
}
function edgesOf(mesh, color = 0x00e5ff, opacity){
  const e = new THREE.LineSegments(
    new THREE.EdgesGeometry(mesh.geometry, 28),
    new THREE.LineBasicMaterial({ color, transparent:true, opacity: opacity == null ? edgeOpacity() : opacity })
  );
  e.position.copy(mesh.position); e.rotation.copy(mesh.rotation); e.scale.copy(mesh.scale);
  return e;
}
/* 圆角盒：真实物体的棱角有微小圆角高光过渡，尖角盒的高光是一条尖线（塑料感来源） */
function rbox(w, h, d, r, seg){
  const rr = Math.max(0.001, Math.min(r == null ? 0.12 : r, Math.min(w, h, d) / 2 - 0.001));
  if (!Number.isFinite(w) || !Number.isFinite(h) || !Number.isFinite(d) || !Number.isFinite(rr)){
    console.error('[rbox] 非法尺寸参数', w, h, d, r, '→ radius', rr, new Error().stack);
  }
  return new RoundedBoxGeometry(w, h, d, seg || 2, rr);
}
/* v0.10：mergeGeometries 要求参与合并的几何体「index 全有或全无」。
   RoundedBoxGeometry 在 segments>1 时内部 toNonIndexed()（index=null），
   而 CylinderGeometry / BoxGeometry 原生 indexed —— 混用直接抛
   "make sure index attribute exists among all geometries, or in none of them"。
   统一转 non-indexed 最省心（立柱/斜撑这类小件顶点数不敏感）。
   踩坑记录：v0.10 首次给货架加 CylinderGeometry 斜撑时炸出这条错。 */
function mergeSafe(list){
  const gs = list.map(g => (g && g.index) ? g.toNonIndexed() : g);
  const m = mergeGeometries(gs);
  if (!m) console.error('[mergeSafe] 合并失败，几何体数：', gs.length);
  return m;
}
function shade(obj, cast = true){
  obj.traverse(o => { if (o.isMesh){ o.castShadow = cast; o.receiveShadow = true; } });
  return obj;
}
/* --- 接触阴影：资产底部一片径向渐变暗斑，补足「落在地上」的落地感 ---
   动态阴影只来自太阳一个方向，背光面与物体间隙缺少暗部；contact shadow 用最便宜的方式补齐。
   注意：用顶点色 alpha 而非黑色 alpha 贴图 —— 部分软件渲染环境（SwiftShader）下
   canvas 渐变贴图的 alpha 通道会丢失，整片暗斑直接不可见（实测踩坑）。 */
function contactShadow(w, d){
  const geo = new THREE.PlaneGeometry(1, 1, 12, 12);
  const pos = geo.attributes.position, n = pos.count;
  const col = new Float32Array(n * 4);
  for (let i = 0; i < n; i++){
    const x = pos.getX(i), y = pos.getY(i);
    const r = Math.min(1, Math.sqrt(x * x + y * y) * 2);      // 0 中心 → 1 边缘
    const a = Math.pow(1 - r, 1.6);
    col[i * 4] = 0; col[i * 4 + 1] = 0; col[i * 4 + 2] = 0; col[i * 4 + 3] = a;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 4));
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    transparent: true, vertexColors: true, depthWrite: false, opacity: 0.9 }));
  m.rotation.x = -Math.PI/2;
  m.scale.set(Math.max(2, w), Math.max(2, d), 1);
  m.renderOrder = 3;                 // 透明类最后画：压在地面贴图之上、墙之后
  return m;
}
function makeTag(cfg){
  const el = document.createElement('div');
  el.className = 'tag';
  el.innerHTML = '<span>' + (cfg.name || cfg.id) + '</span>';
  if (CONFIG.labels.showStatus){
    const s = st(cfg.status);
    el.innerHTML += '<span class="s ' + s.cls + '">' + s.text + '</span>';
    if (cfg.status === 'alarm') el.classList.add('alarm');
  }
  el.addEventListener('click', (e) => { e.stopPropagation(); selectAsset(cfg.id, true); });
  const o = new CSS2DObject(el);
  o.position.set(0, cfg.tagHeight || 0, 0);
  return o;
}
function attachAsset(cfg, obj, tagY){
  const ambient = !!cfg.ambient;            // 环境配景（草坪/道路/树林/路灯）：不拾取 / 不进清单 / 不参与取景
  obj.userData.assetId = cfg.id;
  obj.userData.ambient = ambient;
  assets.set(cfg.id, { cfg, object3d: obj, tagEl: null, tagObj: null, ambient });
  obj.traverse(o => { if (o.isMesh && !o.userData.assetId) o.userData.assetId = cfg.id; });
  if (!ambient) obj.traverse(o => { if (o.isMesh) pickables.push(o); });
  if (CONFIG.env.realism && !ambient && !obj.userData.noCS){   // 接触阴影：补足落地感
    const b0 = new THREE.Box3().setFromObject(obj);
    if (!b0.isEmpty()){
      const cs = contactShadow(b0.max.x - b0.min.x, b0.max.z - b0.min.z);
      cs.position.set((b0.min.x + b0.max.x)/2 - obj.position.x, b0.min.y - obj.position.y + 0.1,
                      (b0.min.z + b0.max.z)/2 - obj.position.z);
      obj.add(cs);
    }
  }
  if (CONFIG.labels.show && !ambient){
    /* 标签密度：'all' 全挂（几十个标签在大场景里必然糊成一团）；
       'key' 只挂异常 + 显式 tag:true 的关键资产，其余靠 hover 提示。
       大场景（>20 个业务资产）建议 key。 */
    const dens = CONFIG.labels.density || 'all';
    const keep = dens === 'all' || cfg.tag === true ||
                 cfg.status === 'alarm' || cfg.status === 'warn' || cfg.status === 'off';
    if (keep){
    if (!tagY){
      const box = new THREE.Box3().setFromObject(obj);
      tagY = (box.max.y - obj.position.y) + 6;
    }
    const tag = makeTag(Object.assign({ tagHeight: tagY }, cfg));
    let host = obj;
    if (obj.userData.tagAt){                 // 管线等世界坐标构件：标签单独挂到指定世界点
      host = new THREE.Object3D();
      host.position.copy(obj.userData.tagAt);
      scene.add(host);
    }
    host.add(tag);
    const rec = assets.get(cfg.id);
    rec.tagEl = tag.element; rec.tagObj = tag;
    }
  }
  scene.add(obj);
  return obj;
}

function buildWarehouse(cfg){
  const [w,h,d] = cfg.size, t = 0.8, g = new THREE.Group();
  const base = new THREE.Mesh(rbox(w, 0.6, d, 0.15), mat(0x152739));
  base.position.y = 0.3; g.add(base);

  const wallMat = cfg.seeThrough
    ? new THREE.MeshPhysicalMaterial({ color: cfg.wallColor == null ? 0x2f6f96 : cfg.wallColor,
        transparent:true, opacity: cfg.wallOpacity == null ? 0.20 : cfg.wallOpacity,
        roughness:0.12, metalness:0.05, side:THREE.DoubleSide, depthWrite:false })
    : texMat(T('wallSteel'), Math.max(2, w/20), Math.max(1, h/9), { color:0xffffff, roughness:0.62, metalness:0.35 });
  const specs = [ [0,-d/2,w,t], [0,d/2,w,t], [-w/2,0,t,d], [w/2,0,t,d] ];
  for (const [x,z,bw,bd] of specs){
    const wall = new THREE.Mesh(rbox(bw,h,bd, 0.1), wallMat);
    wall.position.set(x, h/2, z); wall.renderOrder = 2; g.add(wall);
  }
  // 屋顶
  let roof;
  if (cfg.roof === 'arch'){
    roof = new THREE.Mesh(new THREE.CylinderGeometry(w/2, w/2, d, 28, 1, true, 0, Math.PI), texMat(T('wallSteel'), Math.max(2, w/20), 1, { color:0xffffff, roughness:0.7, metalness:0.2 }));
    roof.rotation.x = -Math.PI/2;
    roof.scale.z = Math.max(0.18, (h*0.55)/(w/2));
    roof.position.y = h;
  } else if (cfg.roof === 'gable'){
    const s = new THREE.Shape();
    s.moveTo(-w/2, 0); s.lineTo(w/2, 0); s.lineTo(0, h*0.55); s.closePath();
    roof = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth:d, bevelEnabled:false }), texMat(T('wallSteel'), Math.max(2, w/20), 1, { color:0xffffff, roughness:0.7, metalness:0.2 }));
    roof.position.set(0, h, -d/2);
  } else {
    roof = new THREE.Mesh(rbox(w+1.2, 0.8, d+1.2, 0.2), texMat(T('wallSteel'), Math.max(2, w/20), 1, { color:0xffffff, roughness:0.7, metalness:0.2 }));
    roof.position.y = h + 0.4;
  }
  g.add(roof);
  /* 屋顶剖切：数字孪生必须能看见库内货位，实心屋顶一盖就成"彩色大棚"。
     roofOpacity 0.2~0.35 是甜点——既保留屋面存在的体量感，又能俯视看到货架阵列。 */
  if (cfg.roofOpacity != null && cfg.roofOpacity < 1 && roof.material){
    roof.material.transparent = true;
    roof.material.opacity = cfg.roofOpacity;
    roof.material.depthWrite = false;
    roof.material.side = THREE.DoubleSide;
    roof.renderOrder = 3;
  }
  /* ===== v0.9 结构细节：门式刚架 + 檩条 + 屋脊通风器 + 采光带 + 卷帘门雨棚 + 落水管 =====
     「透视看库内」靠半透明墙板实现，但钢结构必须实体——真实仓库本就是「钢骨架 + 彩钢板围护」，
     骨架可见反而更像建筑；只有墙板+屋顶实心、连根柱子都没有，才是"彩色大棚塑料感"的根源。
     全部按 BoxGeometry 拼装后 mergeGeometries 合并成 5 个 mesh，避免上百 draw call。 */
  const mFrame  = mat(0x616b77, { metalness:0.72, roughness:0.40 });   // 主刚架（涂装钢）
  const mPurlin = mat(0x555f6a, { metalness:0.68, roughness:0.46 });   // 檩条 / 屋脊通风器
  const mDoor   = mat(0x767f8a, { metalness:0.55, roughness:0.44 });   // 卷帘门板 / 门框 / 雨棚
  const mCave   = mat(0x23282e, { metalness:0.35, roughness:0.70 });   // 门洞内腔（凹陷感）
  const mPipe   = mat(0x4d555e, { metalness:0.60, roughness:0.50 });   // 落水管
  const frameG = [], purlinG = [], doorG = [], caveG = [], pipeG = [];

  const halfD = d / 2, eave = h * 0.80, rise = Math.max(1.2, h - eave);
  const nB = Math.max(3, Math.round(w / 11));                 // 刚架榀数（柱距 ~11m）
  const isArch = (cfg.roof === 'arch');

  // —— 刚架：立柱 + 斜梁（双坡）/ 拱肋（拱形，7 段折线近似半圆）——
  for (let i = 0; i <= nB; i++){
    const x = -w / 2 + (w / nB) * i;
    for (const sz of [-1, 1]){
      const col = new THREE.BoxGeometry(0.5, eave, 0.5);
      col.translate(x, eave / 2, sz * (halfD - 0.25));
      frameG.push(col);
    }
    if (isArch){
      const N = 7;
      for (let k = 0; k < N; k++){
        const a0 = Math.PI * (k / N), a1 = Math.PI * ((k + 1) / N);
        const z0 = Math.cos(a0) * halfD, y0 = eave + Math.sin(a0) * rise;
        const z1 = Math.cos(a1) * halfD, y1 = eave + Math.sin(a1) * rise;
        const seg = new THREE.BoxGeometry(0.38, 0.42, Math.hypot(z1 - z0, y1 - y0) + 0.06);
        seg.rotateX(Math.atan2(-(y1 - y0), -(z1 - z0)));
        seg.translate(x, (y0 + y1) / 2, (z0 + z1) / 2);
        frameG.push(seg);
      }
    } else {
      for (const sz of [-1, 1]){
        const len = Math.hypot(halfD, rise);
        const seg = new THREE.BoxGeometry(0.42, 0.46, len);
        seg.rotateX(Math.atan2(-rise, -sz * halfD));          // 檐口 → 屋脊
        seg.translate(x, (eave + h) / 2, sz * halfD / 2);
        frameG.push(seg);
      }
      const tie = new THREE.BoxGeometry(0.28, 0.28, d - 0.5); // 柱顶系杆
      tie.translate(x, eave - 0.55, 0);
      frameG.push(tie);
    }
  }

  // —— 檩条（沿纵向贯穿全长）——
  const nP = isArch ? 7 : 4;
  for (let k = 1; k <= nP; k++){
    const u = k / (nP + 1);
    let yy, zz;
    if (isArch){ const a = Math.PI * u; zz = Math.cos(a) * halfD; yy = eave + Math.sin(a) * rise; }
    else { zz = halfD * (1 - u); yy = eave + rise * u; }
    for (const sz of (isArch ? [1] : [-1, 1])){
      const p = new THREE.BoxGeometry(w, 0.16, 0.16);
      p.translate(0, yy, sz * zz);
      purlinG.push(p);
    }
  }

  // —— 采光带（屋面中段半透明浅蓝，"天窗"感）——
  const skyMat = new THREE.MeshPhysicalMaterial({ color:0xbcd8ff, transparent:true, opacity:0.42,
    roughness:0.15, metalness:0.10, side:THREE.DoubleSide, depthWrite:false });
  for (const sz of (isArch ? [1] : [-1, 1])){
    let yy, zz;
    if (isArch){ const a = Math.PI * 0.34; zz = Math.cos(a) * halfD; yy = eave + Math.sin(a) * rise; }
    else { zz = halfD * 0.62; yy = eave + rise * 0.38; }
    const band = new THREE.BoxGeometry(w * 0.88, 0.10, 2.4);
    band.translate(0, yy + 0.20, sz * zz);
    const bm = new THREE.Mesh(band, skyMat); bm.renderOrder = 4; g.add(bm);
  }

  // —— 屋脊通风器（双坡才有屋脊）——
  if (!isArch){
    const cap = new THREE.BoxGeometry(w * 0.92, 0.85, 1.9);
    cap.translate(0, h + 0.5, 0); purlinG.push(cap);
    for (let i = 0; i <= 8; i++){
      const st = new THREE.BoxGeometry(0.18, 0.5, 1.2);
      st.translate(-w * 0.44 + (w * 0.88 / 8) * i, h + 0.05, 0); purlinG.push(st);
    }
  }

  // —— 卷帘门（正面 nDoor 樘）：门洞 + 门框 + 卷帘箱 + 门板横纹 + 挑雨棚 + 吊杆 ——
  /* 外立面构件必须落在墙外表面之外：墙厚 t=0.8，外表面在 halfD + t/2 = halfD + 0.4。
     v0.9 首版把门设在 halfD+0.12、落水管 +0.18、窗带 +0.06 —— 全部埋进墙里，
     结果是"钢架透过半透明墙能看见，门和雨棚却一点不剩"。 */
  const nDoor = Math.max(2, Math.min(4, Math.round(w / 42)));
  const dw = 4.6, dh = Math.min(5.2, h * 0.36);
  for (let i = 0; i < nDoor; i++){
    const x = -w / 2 + (w / nDoor) * (i + 0.5), zf = halfD + 0.45;
    const cave = new THREE.BoxGeometry(dw, dh, 0.25);
    cave.translate(x, dh / 2, zf - 0.22); caveG.push(cave);
    for (const sx of [-1, 1]){
      const jamb = new THREE.BoxGeometry(0.28, dh + 0.4, 0.5);
      jamb.translate(x + sx * (dw / 2 + 0.14), (dh + 0.4) / 2, zf); doorG.push(jamb);
    }
    const head = new THREE.BoxGeometry(dw + 0.9, 0.72, 0.68);
    head.translate(x, dh + 0.62, zf + 0.06); doorG.push(head);
    for (let k = 0; k < 5; k++){
      const sl = new THREE.BoxGeometry(dw - 0.1, 0.14, 0.10);
      sl.translate(x, dh - 0.35 - k * (dh - 0.6) / 5, zf + 0.02); doorG.push(sl);
    }
    const can = new THREE.BoxGeometry(dw + 2.0, 0.20, 3.4);
    can.rotateX(-0.06); can.translate(x, dh + 1.5, zf + 1.6); doorG.push(can);
    for (const sx of [-1, 1]){
      const rod = new THREE.BoxGeometry(0.10, 0.9, 0.10);
      rod.translate(x + sx * (dw / 2 + 0.7), dh + 1.95, zf + 2.9); doorG.push(rod);
    }
  }

  // —— 落水管（两侧纵墙）+ 纵墙窗带 ——
  const nPipe = Math.max(3, Math.round(w / 24));
  for (let i = 0; i <= nPipe; i++){
    const x = -w / 2 + (w / nPipe) * i;
    for (const sz of [-1, 1]){
      const p = new THREE.BoxGeometry(0.22, eave, 0.22);
      p.translate(x, eave / 2, sz * (halfD + 0.52)); pipeG.push(p);
    }
  }
  const winMat = new THREE.MeshPhysicalMaterial({ color:0x9fc4e8, transparent:true, opacity:0.55,
    roughness:0.10, metalness:0.05, side:THREE.DoubleSide, depthWrite:false });
  for (const sz of [-1, 1]){
    const wb = new THREE.BoxGeometry(w * 0.82, 1.3, 0.12);
    wb.translate(0, eave * 0.70, sz * (halfD + 0.44));
    const wm = new THREE.Mesh(wb, winMat); wm.renderOrder = 4; g.add(wm);
  }

  if (frameG.length)  g.add(new THREE.Mesh(mergeGeometries(frameG),  mFrame));
  if (purlinG.length) g.add(new THREE.Mesh(mergeGeometries(purlinG), mPurlin));
  if (doorG.length)   g.add(new THREE.Mesh(mergeGeometries(doorG),   mDoor));
  if (caveG.length)   g.add(new THREE.Mesh(mergeGeometries(caveG),   mCave));
  if (pipeG.length)   g.add(new THREE.Mesh(mergeGeometries(pipeG),   mPipe));
  // 写实模式下仅留极淡的轮廓线（科技风由配置抬升）
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d), 28),
    new THREE.LineBasicMaterial({ color:0x00e5ff, transparent:true, opacity: edgeOpacity() * 0.8 }));
  edge.position.y = h/2; g.add(edge);
  g.position.fromArray(cfg.position || [0,0,0]);
  return shade(g);
}

function buildRack(cfg){
  const [w,h,d] = cfg.size, bays = cfg.bays || 10, levels = cfg.levels || 4;
  const g = new THREE.Group(), parts = [], beams = [], guards = [], step = w/bays, lh = h/levels;
  const rn = seeded((cfg.seed != null) ? cfg.seed : (bays * 131 + levels * 17 + 5));
  /* v0.11：细节密度倍率。集显上最有效的降面手段不是砍货架骨架（合并后只有 3 个 draw call），
     而是子位货箱数量 —— 每货位 6 个子位 × 240 个货位 = 上千个箱体，占全场三角面三分之一 */
  const det = (CONFIG.performance && CONFIG.performance.detail != null) ? CONFIG.performance.detail : 1;

  /* —— 立柱片（upright frame）：立柱 + 地脚板 + 柱顶封盖 + 层间横撑 ——
     真实横梁式货架的最小单元是「片」：两根立柱 + 其间横撑/斜撑，横梁再沿 X 把各片连起来 */
  for (let i = 0; i <= bays; i++){
    const xi = -w/2 + i*step;
    for (const z of [-d/2, d/2]){
      const pg = rbox(0.45, h, 0.45, 0.05, 1); pg.translate(xi, h/2, z); parts.push(pg);
      const bp = rbox(0.92, 0.16, 0.92, 0.03, 1); bp.translate(xi, 0.08, z); parts.push(bp);   // 地脚板
      const cp = rbox(0.52, 0.14, 0.52, 0.03, 1); cp.translate(xi, h + 0.07, z); parts.push(cp); // 柱顶封盖
    }
    for (let l = 0; l <= levels; l++){
      const hg = rbox(0.13, 0.13, d, 0.03, 1); hg.translate(xi, l*lh, 0); parts.push(hg);       // 横撑（沿 Z 连前后柱）
    }
  }
  /* —— 斜撑：Y-Z 平面连续 Z 字（货架最醒目的识别特征，缺了它就像几根竹竿）——
     绕 X 轴旋转把 Y 轴对齐到 (0, lh, ±d)，故 θ = atan2(d, lh) */
  const diagLen = Math.sqrt(d*d + lh*lh), da = Math.atan2(d, lh);
  for (let i = 0; i <= bays; i++){
    const xi = -w/2 + i*step;
    for (let l = 0; l < levels; l++){
      if (det < 0.5 && (i % 2)) continue;               // 保命档：斜撑隔片省略，远看仍是 Z 字
      const dg = new THREE.CylinderGeometry(0.07, 0.07, diagLen, 6);
      dg.rotateX((l % 2 === 0) ? da : -da);
      dg.translate(xi, (l + 0.5) * lh, 0);
      parts.push(dg);
    }
  }
  const frame = new THREE.Mesh(mergeSafe(parts), mat(0x4a6b8a, { metalness:0.70, roughness:0.36 }));
  g.add(frame);

  /* —— 承载横梁：每层前后各一根，橙色安全色（RAL2004 是真实货架横梁标配色，
     在灰蓝场景里这一抹橙是「工业感」的关键，全灰会死板） */
  for (let l = 1; l <= levels; l++){
    for (const z of [-d/2, d/2]){
      const bg = rbox(w, 0.30, 0.42, 0.06, 1); bg.translate(0, l*lh, z); beams.push(bg);
    }
  }
  /* —— 端部防撞护栏：黄黑警示色（与橙色横梁区分开，独立 mesh）。
     真实仓库货架端部必装，1m 高也是画面里最好的尺度参照物 —— */
  const gLen = Math.min(d * 0.9, 16);
  for (const sx of [-1, 1]){
    const ox = sx * (w/2 + 1.15);
    for (const oz of [-gLen/2 + 0.15, 0, gLen/2 - 0.15]){
      const pg = rbox(0.17, 1.05, 0.17, 0.03, 1); pg.translate(ox, 0.52, oz); guards.push(pg);
    }
    for (const hy of [0.55, 0.95]){
      const rb = rbox(0.15, 0.17, gLen, 0.03, 1); rb.translate(ox, hy, 0); guards.push(rb);
    }
  }
  const beamMesh = new THREE.Mesh(mergeSafe(beams), mat(0xc85a20, { metalness:0.55, roughness:0.45 }));
  g.add(beamMesh);
  const guardMesh = new THREE.Mesh(mergeSafe(guards), mat(0xe0a818, { metalness:0.42, roughness:0.52 }));
  g.add(guardMesh);

  /* —— 托盘 + 货箱：两个 InstancedMesh。
     关键：一个「货位」是 5.6m 宽 × 14.9m 深，若只塞一个大方块，货物会变成一块地板砖
     （v0.10 首版实测被判定为「扁平黄褐色板状」）。故每个货位再切 COLS×ROWS 个独立子位，
     每个子位 = 1 托盘 + 1 货箱，各自随机高度/朝向/缺货 —— 视觉上才是一摞摞箱子。
     面数控制：托盘用 BoxGeometry（12 tris）而非 rbox（108 tris），子位数翻 6 倍也不炸。 */
  const COLS = det >= 0.75 ? 2 : 1;
  const ROWS = det >= 0.75 ? 3 : (det >= 0.45 ? 2 : 1);
  const sub = COLS * ROWS;
  const count = bays*levels*sub, bw = step*0.72, bd = d*0.62;
  const sw = bw/COLS, sd = bd/ROWS;
  const pk = [];
  const pTop = new THREE.BoxGeometry(sw*0.92, 0.07, sd*0.92); pTop.translate(0, 0.115, 0); pk.push(pTop);
  for (const oz of [-sd*0.36, 0, sd*0.36]){
    const st = new THREE.BoxGeometry(sw*0.92, 0.11, 0.15); st.translate(0, 0.045, oz); pk.push(st);
  }
  const pallet = new THREE.InstancedMesh(mergeSafe(pk),
    mat(0xb0874e, { roughness:0.93, metalness:0.02 }), count);
  const cargo = new THREE.InstancedMesh(rbox(sw*0.86, 1, sd*0.86, 0.05, 1),
    texMat(T('crate'), 1, 1, { roughness:0.86, metalness:0.04 }), count);

  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), YAX = new THREE.Vector3(0,1,0);
  const pos = new THREE.Vector3(), scl = new THREE.Vector3();
  const pal = [0xb08046, 0x9aa7b5, 0x4f7fae, 0xc4a06a];
  const fill = (cfg.fill == null) ? 0.75 : cfg.fill;
  let n = 0;
  for (let b = 0; b < bays; b++){
    for (let l = 0; l < levels; l++){
      const bx = -w/2 + step*(b+0.5), by = l*lh;
      for (let ci = 0; ci < COLS; ci++){
        for (let ri = 0; ri < ROWS; ri++){
          const cx = bx + (ci - (COLS-1)/2) * sw, cz = (ri - (ROWS-1)/2) * sd;
          if (rn() < fill * 0.94){                        // 子位也随机缺货，避免整层齐刷刷
            const hgt = lh * 0.66 * (0.55 + rn() * 0.45);
            const kx = 0.84 + rn() * 0.16, kz = 0.84 + rn() * 0.16;
            const jx = (rn() - 0.5) * 0.16, jz = (rn() - 0.5) * 0.16, jr = (rn() - 0.5) * 0.14;
            m4.compose(pos.set(cx + jx, by + 0.16 + hgt/2, cz + jz),
                       q.setFromAxisAngle(YAX, jr),
                       scl.set(sw*0.86*kx, hgt, sd*0.86*kz));
            cargo.setMatrixAt(n, m4);
            cargo.setColorAt(n, new THREE.Color(pal[(b + l + ci + ri) % pal.length]));
            m4.compose(pos.set(cx + jx*0.7, by, cz + jz*0.7), q.setFromAxisAngle(YAX, jr*0.6), scl.set(1,1,1));
            pallet.setMatrixAt(n, m4);
          } else {
            m4.makeScale(0.001, 0.001, 0.001);            // 空位压到看不见，省一次分支
            cargo.setMatrixAt(n, m4); pallet.setMatrixAt(n, m4);
          }
          n++;
        }
      }
    }
  }
  for (const im of [cargo, pallet]){
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    im.castShadow = CONFIG.performance.shadows;
    g.add(im);
  }
  g.position.fromArray(cfg.position || [0,0,0]);
  return shade(g);
}

function buildYard(cfg){
  const [w,d] = cfg.size, rows = cfg.rows || 3, cols = cfg.cols || 6;
  const g = new THREE.Group();
  const pad = new THREE.Mesh(new THREE.BoxGeometry(w, 0.4, d), mat(0x1a2c3c));
  pad.position.y = 0.2; g.add(pad);
  const cellW = w/cols, cellD = d/rows, count = rows*cols;
  const geo = cfg.stack === 'box'
    ? rbox(cellW*0.55, 9, cellD*0.55, 0.3)
    : new THREE.ConeGeometry(cellW*0.42, 11, 14);
  const stack = new THREE.InstancedMesh(geo, texMat(T('ore'), 2, 2, { roughness:0.92, metalness:0.02 }), count);
  const m4 = new THREE.Matrix4(), pal = [0x6b5a3e, 0x4a4f56, 0x7a6a4c, 0x565e66];
  let n = 0;
  for (let r = 0; r < rows; r++){
    for (let c = 0; c < cols; c++){
      const hgt = 0.6 + ((Math.sin(r*5.1 + c*2.7)+1)/2) * 0.7;
      m4.makeScale(1, hgt, 1);
      m4.setPosition(-w/2 + cellW*(c+0.5), (cfg.stack === 'box' ? 9 : 11) * hgt / 2 + 0.4, -d/2 + cellD*(r+0.5));
      stack.setMatrixAt(n, m4);
      stack.setColorAt(n, new THREE.Color(pal[(r+c) % pal.length]));
      n++;
    }
  }
  stack.instanceMatrix.needsUpdate = true;
  if (stack.instanceColor) stack.instanceColor.needsUpdate = true;
  stack.castShadow = CONFIG.performance.shadows;
  g.add(stack);
  g.position.fromArray(cfg.position || [0,0,0]);
  return shade(g);
}

function buildTank(cfg){
  const r = cfg.radius || 12, h = cfg.height || 24, g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 36), texMat(T('tank'), Math.max(2, r/6), Math.max(1, h/12), { metalness:0.55, roughness:0.44 }));
  body.position.y = h/2; g.add(body);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(r, 36, 16, 0, Math.PI*2, 0, Math.PI/2), texMat(T('tank'), Math.max(2, r/6), 2, { metalness:0.6, roughness:0.4 }));
  dome.position.y = h; dome.scale.y = 0.42;            // 压扁罐顶，避免整体读成「球罐」
  g.add(dome);
  const skirt = new THREE.Mesh(new THREE.CylinderGeometry(r*1.02, r*1.06, 1.2, 36), mat(0x39505f));
  skirt.position.y = 0.6; g.add(skirt);
  const band = new THREE.Mesh(new THREE.TorusGeometry(r*1.01, 0.35, 8, 40), mat(0x00e5ff, { emissive:0x00e5ff, emissiveIntensity:0.5 }));
  band.rotation.x = Math.PI/2; band.position.y = h * (cfg.level == null ? 0.6 : cfg.level); g.add(band);
  for (let i = 0; i < 9; i++){                       // 爬梯
    const step = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.22, 0.22), mat(0x6d8296));
    step.position.set(r*1.02, 2 + i*2.4, 0); g.add(step);
  }
  g.position.fromArray(cfg.position || [0,0,0]);
  return shade(g);
}

function buildSilo(cfg){
  const r = cfg.radius || 10, h = cfg.height || 32, hopper = 8, g = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(r, hopper, 28), mat(0x7f8fa0, { metalness:0.4 }));
  cone.position.y = hopper/2; cone.rotation.x = Math.PI; g.add(cone);   // 锥斗：0 → hopper
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 28), texMat(T('wallConcrete'), Math.max(2, r/6), Math.max(1, h/12), { metalness:0.25, roughness:0.62 }));
  body.position.y = hopper + h/2; g.add(body);                          // 罐身紧接锥斗，不留缝
  const cap = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 12, 0, Math.PI*2, 0, Math.PI/2), texMat(T('wallConcrete'), 4, 2, { metalness:0.25, roughness:0.62 }));
  cap.position.y = hopper + h; cap.scale.y = 0.5; g.add(cap);
  for (const [dx,dz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){                 // 支腿
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, hopper, 10), mat(0x52657a));
    leg.position.set(dx*r*0.85, hopper/2, dz*r*0.85); g.add(leg);
  }
  g.position.fromArray(cfg.position || [0,0,0]);
  return shade(g);
}

function stripeTexture(){
  const c = document.createElement('canvas'); c.width = 64; c.height = 8;
  const x = c.getContext('2d');
  x.fillStyle = '#2b6f8c'; x.fillRect(0,0,64,8);
  x.fillStyle = '#7ff0ff'; x.fillRect(0,0,20,8);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(14, 1);
  return t;
}
function buildPipeline(cfg){
  const pts = (cfg.points || []).map(p => new THREE.Vector3().fromArray(p));
  if (pts.length < 2) return new THREE.Group();
  const curve = new THREE.CatmullRomCurve3(pts);
  const g = new THREE.Group();
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(40, pts.length*24), cfg.radius || 0.8, 12, false),
    mat(0x2f7f9c, { metalness:0.7, roughness:0.3 }));
  g.add(tube);
  if (cfg.flow){
    const flowTex = stripeTexture();
    const sleeve = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(40, pts.length*24), (cfg.radius||0.8)*1.22, 12, false),
      new THREE.MeshBasicMaterial({ map:flowTex, transparent:true, opacity:0.32, blending:THREE.AdditiveBlending, depthWrite:false }));
    g.add(sleeve);
    movers.push({ kind:'flow', tex:flowTex, speed:0.35 });
  }
  const stepN = Math.max(2, Math.round(curve.getLength()/22));
  for (let i = 0; i <= stepN; i++){
    const p = curve.getPointAt(i/stepN);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, Math.max(1, p.y), 8), mat(0x3b5266));
    leg.position.set(p.x, p.y/2, p.z); g.add(leg);
  }
  const mid = curve.getPointAt(0.5);
  g.userData.tagAt = new THREE.Vector3(mid.x, mid.y + 14, mid.z);
  g.userData.noCS = true;                          // 细长管线：整片椭圆阴影不合比例
  return shade(g);
}

function buildConveyor(cfg){
  const L = cfg.length || 100, g = new THREE.Group();
  const belt = new THREE.Mesh(new THREE.BoxGeometry(L, 0.5, 4.4), mat(0x35485a));
  belt.position.y = 9; g.add(belt);
  const tex = stripeTexture(); tex.repeat.set(Math.round(L/6), 1);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(L, 3.6),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:0.5 }));
  top.rotation.x = -Math.PI/2; top.position.y = 9.3; g.add(top);
  movers.push({ kind:'flow', tex, speed:0.6 });
  const n = Math.max(2, Math.round(L/16));
  for (let i = 0; i <= n; i++){
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.6, 9, 0.6), mat(0x2c3f50));
    leg.position.set(-L/2 + (L/n)*i, 4.5, 0); g.add(leg);
  }
  g.position.fromArray(cfg.position || [0,0,0]);
  g.rotation.y = (cfg.rotation || 0) * Math.PI/180;
  g.userData.noCS = true;                          // 长廊道：整片椭圆阴影不合比例
  return shade(g);
}

function buildVehicle(cfg){
  const g = new THREE.Group();
  const cabMat = mat(cfg.color || 0xe8eef5, { metalness:0.35, roughness:0.5 });
  const cab = new THREE.Mesh(rbox(4.4, 3.4, 6, 0.5), cabMat);
  cab.position.set(4.2, 2.4, 0); g.add(cab);
  const glass = new THREE.Mesh(rbox(3.6, 1.7, 5.2, 0.2), glassMat());
  glass.position.set(4.2, 3.1, 0); g.add(glass);
  if (cfg.body === 'tank'){                                   // 洒水车 / 罐车：卧罐 + 端封 + 爬梯 + 喷洒护栏
    const tank = new THREE.Mesh(new THREE.CylinderGeometry(1.95, 1.95, 9.6, 20).rotateZ(Math.PI / 2),
      mat(0xdfe6ee, { metalness:0.4, roughness:0.4 }));
    tank.position.set(-3.4, 3.5, 0); g.add(tank);
    for (const ex of [-8.1, 1.3]){

    }
    const ladder = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.6, 0.12), mat(0x6d8296));
    ladder.position.set(-3.4, 5.6, 0); g.add(ladder);
    const rail = new THREE.Mesh(new THREE.BoxGeometry(7.5, 0.14, 3.4), mat(0x8d969e));
    rail.position.set(-3.4, 5.5, 0); g.add(rail);
  } else if (cfg.body === 'pickup'){                          // 指挥车 / 皮卡
    const box = new THREE.Mesh(rbox(4.6, 1.6, 5.0, 0.35), mat(0x3d5772));
    box.position.set(-2.2, 2.2, 0); g.add(box);
  } else {
    const box = new THREE.Mesh(rbox(12, 3.8, 6.2, 0.45), mat(0x2f6ea8, { metalness:0.4 }));

  const wheelGeo = new THREE.CylinderGeometry(1.5, 1.5, 1.1, 14).rotateZ(Math.PI/2);

    const w = new THREE.Mesh(wheelGeo, mat(0x151b22, { roughness:0.9 }));
    w.position.set(x, 1.5, z); g.add(w);
  }
  g.scale.setScalar(cfg.size == null ? 1 : cfg.size);         // 整体缩放（皮卡 0.6 / 大车 1.2）
  g.position.fromArray(cfg.position || [0,0,0]);
  if (cfg.path && cfg.path.length > 1){
    movers.push({ kind:'vehicle', obj:g,
      curve:new THREE.CatmullRomCurve3(cfg.path.map(p => new THREE.Vector3().fromArray(p))),
      t:(cfg.phase == null ? 0 : cfg.phase), speed:(cfg.speed || 12) / 600 });
  }
  return shade(g);
}

function buildBox(cfg){                              // GLTF 失败时的程序化占位
  const s = cfg.size || [6,10,4];

  m.position.y = s[1]/2;
  const g = new THREE.Group(); g.add(m); g.add(edgesOf(m, 0x8b5cf6, 0.5));
