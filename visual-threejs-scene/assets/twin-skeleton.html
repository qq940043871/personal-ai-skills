}

/* --- 货物托盘：木托盘底座 + 堆叠货物箱（装卸区散货的"生活痕迹"） --- */
function buildPallet(cfg){
  const g = new THREE.Group();
  const px = (cfg.size && cfg.size[0]) || 2.4, pz = (cfg.size && cfg.size[1]) || 2.4;
  const layers = cfg.layers || 2;
  const wood = mat(0x8a6b3e, { roughness:0.9, metalness:0 });
  const crate = mat(0x7a5c3a, { roughness:0.82, metalness:0.02 });
  /* 木托盘：底 3 横条 + 面板 4 竖条 */
  const deck = [];
  for (let i = 0; i < 3; i++){ const s = new THREE.BoxGeometry(px*0.94, 0.14, 0.2); s.translate(0, 0.07, -pz*0.32 + pz*0.32*i); deck.push(s); }
  for (let i = 0; i < 4; i++){ const s = new THREE.BoxGeometry(0.2, 0.1, pz*0.94); s.translate(-px*0.36 + px*0.24*i, 0.2, 0); deck.push(s); }
  g.add(new THREE.Mesh(mergeGeometries(deck), wood));
  /* 货物箱：每层 2~3 个错开堆叠 */
  const boxes = [];
  for (let l = 0; l < layers; l++){
    const n = 2 + (l % 2 ? 1 : 2);
    for (let b = 0; b < n; b++){
      const bw = px*0.5, bh = 0.75, bd = pz*0.5;
      const bx = rbox(bw*0.94, bh, bd*0.94, 0.08);
      bx.translate((b - (n-1)/2) * px*0.30, 0.3 + l*bh + bh/2, 0);
      boxes.push(bx);
    }
  }
  g.add(new THREE.Mesh(mergeGeometries(boxes), crate));
  g.position.fromArray(cfg.position || [0,0,0]);
  g.rotation.y = (cfg.rotation || 0) * Math.PI/180;
  return shade(g);
}


/* --- 现代办公楼：幕墙贴图 + 裙房 + 屋顶设备 + 入口雨棚 --- */
function buildOffice(cfg){
  const [w,h,d] = cfg.size, g = new THREE.Group();
  const floors = cfg.floors || Math.max(3, Math.round(h/4.2));
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    texMat(T('glass'), Math.max(2, w/6), Math.max(2, floors*0.9),
           { color:0xffffff, roughness:0.18, metalness:0.55 }));
  body.position.y = h/2; g.add(body);
  if (cfg.podium){                                       // 裙房：底部外扩一圈
    const ph = Math.min(h*0.55, cfg.podium * 4.2);
    const pod = new THREE.Mesh(rbox(w*1.16, ph, d*1.16, 0.25),
      texMat(T('wallConcrete'), Math.max(2, w/8), Math.max(1, ph/4), { roughness:0.72, metalness:0.08 }));
    pod.position.y = ph/2; g.add(pod);
  }
  const cap = new THREE.Mesh(rbox(w+0.9, 0.7, d+0.9, 0.15), mat(0xdfe6ec, { roughness:0.8 }));
  cap.position.y = h + 0.35; g.add(cap);                 // 屋面板
  for (let i = 0; i < (cfg.roofUnits == null ? 3 : cfg.roofUnits); i++){
    const ew = w * (0.10 + 0.05 * ((i*7) % 3));
    const unit = new THREE.Mesh(new THREE.BoxGeometry(ew, 2.2, ew*0.8), mat(0x8d99a6, { metalness:0.5, roughness:0.6 }));
    unit.position.set(-w/2 + w*(0.20 + 0.30*i), h + 1.8, (i%2 ? d*0.14 : -d*0.14)); g.add(unit);
  }
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(w*0.16, 4.4, d*0.28), mat(0xb6bfc8, { roughness:0.75 }));
  shaft.position.set(w*0.28, h + 2.9, 0); g.add(shaft);   // 电梯机房
  const entry = new THREE.Mesh(new THREE.BoxGeometry(w*0.26, 4.2, 0.6),
    mat(0x1b3a4f, { roughness:0.12, metalness:0.7 }));
  entry.position.set(0, 2.1, d/2 + 0.3); g.add(entry);    // 玻璃门厅
  const canopy = new THREE.Mesh(new THREE.BoxGeometry(w*0.34, 0.5, 7), mat(0x3f4d5c, { metalness:0.4, roughness:0.5 }));
  canopy.position.set(0, 4.7, d/2 + 3.2); g.add(canopy);  // 入口雨棚
  for (const sx of [-w*0.14, w*0.14]){
    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 4.7, 10), mat(0x6d7a88));
    col.position.set(sx, 2.35, d/2 + 6.4); g.add(col);
  }
  const eg = edgesOf(new THREE.Mesh(new THREE.BoxGeometry(w, h, d)), 0x00e5ff, 0.16);
  eg.position.y = h/2; g.add(eg);
  g.position.fromArray(cfg.position || [0,0,0]);
  g.rotation.y = (cfg.rotation || 0) * Math.PI/180;
  return shade(g);
}

/* --- 单棵树：树干 + 三球树冠（俯瞰为圆形绿团，正视也有体积） --- */
function buildTree(cfg){
  const h = cfg.height || 12, r = cfg.canopy || 5.2, g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.62, h*0.4, 8),
    mat(0x6b4f35, { roughness:0.95, metalness:0 }));
  trunk.position.y = h*0.20; g.add(trunk);
  const rn = seeded(cfg.seed || Math.abs((cfg.position||[0,0,0])[0]) + 7);
  const base = new THREE.Color(cfg.leafColor || 0x3d6b33);
  /* 树冠 = 5~6 个压扁椭球簇 + 每瓣色相/明度微调，打破"完美绿球"的卡通感 */
  const lobes = 5 + Math.floor(rn()*2);
  for (let i = 0; i < lobes; i++){
    const s = 0.45 + rn()*0.6;
    const tint = base.clone().offsetHSL(rn()*0.05 - 0.025, rn()*0.08, rn()*0.10 - 0.05);
    const leaf = mat(tint, { roughness:0.92, metalness:0, flatShading:true });
    const c = new THREE.Mesh(new THREE.IcosahedronGeometry(r*s, 1), leaf);
    const a = rn()*6.283;
    c.position.set(Math.cos(a)*r*0.55*rn(), h*0.60 + (rn()-0.5)*r*0.5, Math.sin(a)*r*0.55*rn());
    c.scale.set(0.9 + rn()*0.3, 0.62 + rn()*0.35, 0.9 + rn()*0.3);
    g.add(c);
  }
  g.position.fromArray(cfg.position || [0,0,0]);
  return shade(g);
}

/* --- 树林：区域内批量种树，合并成 2 个 draw call --- */
function buildGrove(cfg){
  const [w,d] = cfg.size || [80,40], n = cfg.count || 24, g = new THREE.Group();
  const rn = seeded(cfg.seed || 11);
  const trunkG = [], leafG = [], leafHi = [];
  const leafBase = new THREE.Color(cfg.leafColor || 0x3d6b33);
  const leafDark = leafBase.clone().offsetHSL(0, 0.02, -0.07);   // 内层深绿（阴影）
  const leafLite = leafBase.clone().offsetHSL(0.02, -0.02, 0.06); // 外层受光亮绿
  for (let i = 0; i < n; i++){
    const x = (rn()-0.5)*w, z = (rn()-0.5)*d;
    const hh = 9 + rn()*7, rr = 3.2 + rn()*2.6;
    const tk = new THREE.CylinderGeometry(0.32, 0.5, hh*0.42, 6); tk.translate(x, hh*0.21, z); trunkG.push(tk);
    /* 树冠：1 主冠 + 4 侧冠（压扁椭球、不规则簇）；内层深绿 / 外层亮绿，打破"绿球"感 */
    const main = new THREE.IcosahedronGeometry(rr, 1);
    main.scale(1, 0.72, 1); main.translate(x, hh*0.60, z); leafG.push(main);
    const lobes = [[0.66, 0.55, 0.30, 0.74], [0.60, -0.52, -0.28, 0.70],
                   [0.52, 0.18, -0.55, 0.68], [0.48, -0.15, 0.52, 0.66]];
    for (let k = 0; k < 4; k++){
      const [lr, lx, lz, ly] = lobes[k];
      const c = new THREE.IcosahedronGeometry(rr*lr, 1);
      c.scale(1, ly, 1); c.translate(x + lx*rr, hh*0.48, z + lz*rr);
      (k % 2 ? leafHi : leafG).push(c);
    }
  }
  if (trunkG.length) g.add(new THREE.Mesh(mergeGeometries(trunkG), mat(0x6b4f35, { roughness:0.95, metalness:0 })));
  if (leafG.length)  g.add(new THREE.Mesh(mergeGeometries(leafG), mat(leafDark, { roughness:0.92, metalness:0, flatShading:true })));
  if (leafHi.length) g.add(new THREE.Mesh(mergeGeometries(leafHi), mat(leafLite, { roughness:0.92, metalness:0, flatShading:true })));
  g.position.fromArray(cfg.position || [0,0,0]);
  return shade(g);
}

/* --- 道路：沥青贴图 + 中心虚线 + 路缘石 --- */
function buildRoad(cfg){
  const [w,d] = cfg.size || [16,200], g = new THREE.Group();
  const road = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    texMat(T('asphalt'), Math.max(1, w/8), Math.max(1, d/8), { roughness:0.92, metalness:0.03 }));
  road.rotation.x = -Math.PI/2; road.position.y = 0.06; road.receiveShadow = true; g.add(road);
  if (cfg.lane !== false){
    const n = Math.max(4, Math.round(d/9)), dash = new THREE.Group();
    const dm = new THREE.MeshBasicMaterial({ color:0xeaeadf });
    for (let i = 0; i < n; i++){
      const s = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 4.2), dm);
      s.rotation.x = -Math.PI/2; s.position.set(0, 0.12, -d/2 + (d/n)*(i+0.5)); dash.add(s);
    }
    g.add(dash);
  }
  if (cfg.curb !== false){
    for (const sx of [-w/2-0.6, w/2+0.6]){
      const c = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.34, d), mat(0xb9bfc6, { roughness:0.85 }));
      c.position.set(sx, 0.17, 0); g.add(c);
    }
  }
  g.position.fromArray(cfg.position || [0,0,0]);
  g.rotation.y = (cfg.rotation || 0) * Math.PI/180;
  return shade(g, false);
}

/* --- 草坪 --- */
function buildLawn(cfg){
  const [w,d] = cfg.size || [60,40], g = new THREE.Group();
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    texMat(T('lawn'), Math.max(1, w/10), Math.max(1, d/10), { roughness:0.95, metalness:0 }));
  p.rotation.x = -Math.PI/2; p.position.y = 0.04; p.receiveShadow = true; g.add(p);
  g.position.fromArray(cfg.position || [0,0,0]);
  return shade(g, false);
}

/* --- 功能区地面色块 zone ---
   数字孪生大屏的标配：把「A区/B区/E区堆场」这类业务分区在地面上实实在在地划出来。
   没有它，观众只能看到一堆建筑，看不出「库区」这个概念。
   填充用极低不透明度（0.06~0.14），描边用高亮色，四角加 L 形角标（比整圈实线更像仪表盘）。
   约定：默认 ambient（纯视觉，不进清单/不拾取/不占资产数）。 */
function buildZone(cfg){
  const [w, d] = cfg.size || [60, 40];
  const g = new THREE.Group();
  const col = cfg.color == null ? 0x22d3ee : cfg.color;
  const hw = w/2, hd = d/2, y = 0.12;

  const pad = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    new THREE.MeshBasicMaterial({ color: col, transparent: true,
      opacity: cfg.opacity == null ? 0.10 : cfg.opacity, depthWrite: false }));
  pad.rotation.x = -Math.PI/2; pad.position.y = 0.07; pad.renderOrder = 2;
  g.add(pad);

  const lineMat = new THREE.LineBasicMaterial({ color: col, transparent: true,
    opacity: cfg.lineOpacity == null ? 0.75 : cfg.lineOpacity });
  const seg = (x1, z1, x2, z2) => {
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2)]);
    g.add(new THREE.Line(geo, lineMat));
  };
  seg(-hw, -hd, hw, -hd); seg(hw, -hd, hw, hd);
  seg(hw, hd, -hw, hd);   seg(-hw, hd, -hw, -hd);

  // 四角 L 形角标：沿边收进去一段，端头加粗视觉砝码
  const c = Math.min(w, d) * (cfg.cornerRatio || 0.14);
  const cm = new THREE.LineBasicMaterial({ color: col, transparent: true,
    opacity: cfg.lineOpacity == null ? 0.9 : cfg.lineOpacity });
  const corner = (x1, z1, x2, z2) => {
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x1, y + 0.02, z1), new THREE.Vector3(x2, y + 0.02, z2)]);
    g.add(new THREE.Line(geo, cm));
  };
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx, sz]) => {
    corner(sx * hw, sz * hd, sx * (hw - c), sz * hd);
    corner(sx * hw, sz * hd, sx * hw, sz * (hd - c));
  });

  g.position.fromArray(cfg.position || [0, 0, 0]);
  g.userData.noCS = true;
  return g;
}

/* --- 停车场：沥青 + 白色车位线 + 停放车辆 --- */
function buildParking(cfg){
  const cols = cfg.cols || 8, rows = cfg.rows || 1, g = new THREE.Group();
  const cw = cfg.cellW || 6, cd = cfg.cellD || 12, W = cols*cw, D = rows*cd;
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(W, D),
    texMat(T('asphalt'), Math.max(1, W/8), Math.max(1, D/8), { roughness:0.92, metalness:0.03 }));
  pad.rotation.x = -Math.PI/2; pad.position.y = 0.05; pad.receiveShadow = true; g.add(pad);
  const lines = [];
  for (let i = 0; i <= cols; i++){ const l = new THREE.BoxGeometry(0.24, 0.02, D); l.translate(-W/2 + cw*i, 0, 0); lines.push(l); }
  for (let j = 0; j <= rows; j++){ const l = new THREE.BoxGeometry(W, 0.02, 0.24); l.translate(0, 0, -D/2 + cd*j); lines.push(l); }
  g.add(new THREE.Mesh(mergeGeometries(lines), new THREE.MeshBasicMaterial({ color:0xf0f2ee })));
  const cars = cfg.occupied == null ? Math.round(cols*rows*0.7) : cfg.occupied;
  const rn = seeded(cfg.seed || 7), bodies = [], cabs = [], pal = [0xdfe4ea, 0x9fb0c0, 0x3c5a78, 0xb8453a, 0x3a4a5c];
  for (let i = 0; i < cars; i++){
    const cx = -W/2 + cw*((i % cols) + 0.5), cz = -D/2 + cd*(Math.floor(i/cols) + 0.5);
    const b = rbox(4.4, 1.7, 9.0, 0.35, 1); b.translate(cx, 1.0, cz); bodies.push(b);
    const c = rbox(4.0, 1.1, 3.2, 0.25, 1); c.translate(cx, 2.35, cz - 1.4); cabs.push(c);
  }
  if (bodies.length){
    g.add(new THREE.Mesh(mergeGeometries(bodies), mat(pal[Math.floor(rn()*pal.length)], { metalness:0.45, roughness:0.4 })));
    g.add(new THREE.Mesh(mergeGeometries(cabs), mat(0x2b3a4a, { roughness:0.22, metalness:0.65 })));
  }
  g.position.fromArray(cfg.position || [0,0,0]);

}

/* --- 路灯带：沿路径布灯，合并 2 个 draw call --- */
function buildLampRow(cfg){
  const pts = (cfg.points || []).map(p => new THREE.Vector3().fromArray(p));
  if (pts.length < 2) return new THREE.Group();
  const curve = new THREE.CatmullRomCurve3(pts);
  const n = cfg.count || Math.max(2, Math.round(curve.getLength()/42));
  const H = cfg.height || 9, g = new THREE.Group(), poles = [], heads = [];
  for (let i = 0; i < n; i++){
    const p = curve.getPointAt(i/(n-1 || 1));
    const po = new THREE.CylinderGeometry(0.22, 0.34, H, 8); po.translate(p.x, H/2, p.z); poles.push(po);
    const he = new THREE.BoxGeometry(1.8, 0.42, 0.9);        he.translate(p.x + 3, H - 0.5, p.z); heads.push(he);

  g.add(new THREE.Mesh(mergeGeometries(poles), mat(0x8b949e, { metalness:0.6, roughness:0.45 })));
  g.add(new THREE.Mesh(mergeGeometries(heads), mat(0x2a333d, { metalness:0.4 })));

  return shade(g, false);
}

/* --- 园区标识牌：Canvas 文字贴图（字体缺失也只是牌面变素，不报错） --- */
function signTexture(text, sub){
  try{
    const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
    const x = c.getContext('2d');
    x.fillStyle = '#0b2536'; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = '#00e5ff'; x.fillRect(0, 0, c.width, 10); x.fillRect(0, c.height - 10, c.width, 10);
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = '#eaf6ff';
    x.font = 'bold 108px "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif';
    x.fillText(text || '', c.width/2, sub ? c.height * 0.40 : c.height * 0.5);
    if (sub){
      x.fillStyle = '#8fd6ff';
      x.font = 'bold 52px "Microsoft YaHei","Noto Sans CJK SC",sans-serif';
      x.fillText(sub, c.width/2, c.height * 0.75);
    }
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }catch(e){ return null; }
}

/* --- 装卸月台：混凝土台 + 卷帘门阵列 + 雨棚 + 登车桥 + 防撞块 + 车位线 --- */

  const [w,d] = cfg.size || [120,24], bays = cfg.bays || 6;

  pad.position.y = H/2; g.add(pad);
  const wall = new THREE.Mesh(rbox(w, WH_, 0.8, 0.12),
    texMat(T('wallSteel'), Math.max(2, w/20), Math.max(1, WH_/9), { color:0xffffff, roughness:0.62, metalness:0.35 }));
  wall.position.set(0, H + WH_/2, -d/2 + 0.4); g.add(wall);
  const step = w/bays, doors = [], frames = [], bridges = [], bumpers = [];
  for (let i = 0; i < bays; i++){

    const dr = rbox(step*0.52, Math.min(8.5, WH_*0.66), 0.5, 0.08);
    dr.translate(cx, H + Math.min(8.5, WH_*0.66)/2, -d/2 + 0.98); doors.push(dr);
    const fr = rbox(step*0.60, Math.min(9.4, WH_*0.74), 0.34, 0.06);
    fr.translate(cx, H + Math.min(9.4, WH_*0.74)/2, -d/2 + 0.70); frames.push(fr);
    const br = rbox(step*0.34, 0.18, 3.4, 0.05);
    br.rotateX(-0.06); br.translate(cx, H + 0.02, d/2 - 1.4); bridges.push(br);
    for (const sx of [-step*0.22, step*0.22]){
      const bu = rbox(0.9, 0.7, 0.5, 0.12); bu.translate(cx + sx, H + 0.35, d/2 - 0.35); bumpers.push(bu);
    }
  }
  g.add(new THREE.Mesh(mergeGeometries(frames), mat(0x3b4954, { metalness:0.55, roughness:0.45 })));
  g.add(new THREE.Mesh(mergeGeometries(doors), mat(0x0b1620, { metalness:0.3, roughness:0.72 })));
  g.add(new THREE.Mesh(mergeGeometries(bridges), mat(0x8a939c, { metalness:0.7, roughness:0.35 })));
  g.add(new THREE.Mesh(mergeGeometries(bumpers), mat(0x1c1f22, { roughness:0.95 })));
  // 雨棚：只出挑 8m，压在门前（太大就成了"帐篷"）

  canopy.position.set(0, H + WH_ + 1.3, d/2 - cD/2 + 0.4); canopy.rotation.x = -0.04; g.add(canopy);
  const poles = [];
  for (let i = 0; i <= bays; i++){

    p.translate(-w/2 + step*i, (H + WH_ + 1.2)/2, d/2 - cD + 0.8); poles.push(p);
  }
  g.add(new THREE.Mesh(mergeGeometries(poles), mat(0x77838f, { metalness:0.55, roughness:0.45 })));
  // 月台前沿黄色警示带 + 前方车道边线
  const warn = new THREE.Mesh(new THREE.BoxGeometry(w, 0.06, 0.6), new THREE.MeshBasicMaterial({ color:0xd9a52b }));
  warn.position.set(0, H + 0.05, d/2 - 0.3); g.add(warn);
  g.position.fromArray(cfg.position || [0,0,0]);
  g.rotation.y = (cfg.rotation || 0) * Math.PI/180;

/* --- 围墙：沿折线布立柱 + 栅栏板（各合并成 1 个 Mesh，2 个 draw call） --- */
function buildFence(cfg){
  const pts = (cfg.points || []).map(p => new THREE.Vector3().fromArray(p));
  if (pts.length < 2) return new THREE.Group();
  const curve = new THREE.CatmullRomCurve3(pts, cfg.closed !== false, 'catmullrom', 0.02);
  const H = cfg.height || 2.4, seg = Math.max(2, Math.round(curve.getLength()/4));
  const g = new THREE.Group(), posts = [], panels = [], rails = [];
  for (let i = 0; i <= seg; i++){
    const t = i/seg, p = curve.getPointAt(Math.min(1, t));
    const po = new THREE.BoxGeometry(0.34, H, 0.34); po.translate(p.x, H/2, p.z); posts.push(po);
    if (i < seg){
      const tan = curve.getTangentAt(Math.min(1, t)), ang = Math.atan2(tan.x, tan.z);
      const pm = curve.getPointAt(Math.min(1, (i + 0.5)/seg)), len = curve.getLength()/seg * 1.04;
      const pa = new THREE.BoxGeometry(0.1, H*0.74, len); pa.rotateY(ang); pa.translate(pm.x, H*0.44, pm.z); panels.push(pa);
      const ra = new THREE.BoxGeometry(0.16, 0.16, len); ra.rotateY(ang); ra.translate(pm.x, H - 0.2, pm.z); rails.push(ra);
    }
  }
  g.add(new THREE.Mesh(mergeGeometries(posts), mat(0x9aa4ad, { metalness:0.35, roughness:0.7 })));
  g.add(new THREE.Mesh(mergeGeometries(panels), new THREE.MeshStandardMaterial({
    color:0x5e6a75, metalness:0.45, roughness:0.55, transparent:true, opacity:0.55, side:THREE.DoubleSide })));
  g.add(new THREE.Mesh(mergeGeometries(rails), mat(0x8d969e, { metalness:0.5 })));
  g.userData.noCS = true;                    // 细长构件：不生成接触阴影
  g.position.fromArray(cfg.position || [0,0,0]);
  return shade(g, false);
}

/* --- 屋顶光伏阵列：斜面板 InstancedMesh + 支架（绿色园区/能耗面板配套） --- */
function buildSolar(cfg){
  const [w,d] = cfg.size || [100,50], rows = cfg.rows || 4, cols = cfg.cols || 10;
  const g = new THREE.Group(), tilt = (cfg.tilt == null ? 22 : cfg.tilt) * Math.PI/180;
  const pw = w/cols*0.86, pd = d/rows*0.52, n = rows*cols;
  const inst = new THREE.InstancedMesh(rbox(pw, 0.16, pd, 0.04, 1),
    mat(0x152c46, { metalness:0.6, roughness:0.2, emissive:0x081a2c, emissiveIntensity:0.18 }), n);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-tilt, 0, 0));
  const one = new THREE.Vector3(1, 1, 1), legs = [];
  let k = 0;
  for (let r = 0; r < rows; r++){
    for (let c = 0; c < cols; c++){
      const px = -w/2 + (w/cols)*(c + 0.5), pz = -d/2 + (d/rows)*(r + 0.5);
      m4.compose(new THREE.Vector3(px, 0.75 + pd*0.28, pz), q, one);
      inst.setMatrixAt(k++, m4);
      const lg = new THREE.BoxGeometry(0.22, 0.75, 0.22); lg.translate(px - pw*0.3, 0.375, pz); legs.push(lg);
      const lg2 = new THREE.BoxGeometry(0.22, 0.75, 0.22); lg2.translate(px + pw*0.3, 0.375, pz); legs.push(lg2);
    }
  }
  inst.instanceMatrix.needsUpdate = true;
  inst.castShadow = CONFIG.performance.shadows;
  g.add(inst);
  g.add(new THREE.Mesh(mergeGeometries(legs), mat(0x8d969e, { metalness:0.55, roughness:0.5 })));
  g.position.fromArray(cfg.position || [0,0,0]);
  g.rotation.y = (cfg.rotation || 0) * Math.PI/180;
  return shade(g);
}

/* =========================================================================
 * 4b. 露天矿场专用构件（台阶采场 / 斜坡道 / 电铲 / 牙轮钻机 / 矿卡 / 破碎站 /
 *     排土场 / 高杆灯塔 / 推土机 / 沉淀池 / 边坡监测桩）
 * ========================================================================= */

/* 两点之间拉一根液压杆（油缸）：电铲/推土机的机构连杆 */
function rodBetween(a, b, r, m){
  const dir = new THREE.Vector3().subVectors(b, a), len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), m);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return mesh;
}
/* 半透明玻璃（驾驶室 / 仪表窗）：physical 材质 + envMap 反射 */
function glassMat(){
  const m = new THREE.MeshPhysicalMaterial({ color:0x1b3a52, metalness:0.35, roughness:0.08,
    transparent:true, opacity:0.72, envMapIntensity:0.80 });
  PBR_MATS.push(m);
  if (skyEnvMap){ m.envMap = skyEnvMap;
    /* v0.3：默认 0.15。物理天空 PMREM 的 radiance 极高（太阳周边尤甚），
       0.5 的旧默认会让 IBL 反射贡献全场 40%+ 亮度，把中灰材质整片"洗白"。
       金属/玻璃类构件用 opts.envMapIntensity 显式调高。 */
    if (m.envMapIntensity == null) m.envMapIntensity = IBL_DEFAULT; }
  return m;
}

/* --- 台阶式露天采场：椭圆开口逐层收缩；层间坡面 + 安全平台 + 台阶运输道路 ---
   半径全部按圆形计算，group 整体按 rz/rx 压扁成椭圆（y 不被缩放）。 */
/* --- 扬尘粒子：canvas 径向渐变贴图 + Points（无外部资源），模拟破碎/排土粉尘 --- */
let DUST_TEX = null;
function dustTexture(){
  if (DUST_TEX) return DUST_TEX;
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const ctx = cv.getContext('2d');
  const gr = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(176,158,124,0.62)');
  gr.addColorStop(0.45, 'rgba(160,142,110,0.28)');
  gr.addColorStop(1, 'rgba(150,132,100,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, 64, 64);
  DUST_TEX = new THREE.CanvasTexture(cv);
  return DUST_TEX;
}
function makeDust(origin, opts){
  opts = opts || {};
  const count = opts.count || 40, spread = opts.spread || 8, maxRise = opts.rise || 14;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3), bx = new Float32Array(count), bz = new Float32Array(count);
  for (let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * spread;
    bx[i] = origin.x + Math.cos(a) * r; bz[i] = origin.z + Math.sin(a) * r;
    pos[i * 3] = bx[i]; pos[i * 3 + 1] = origin.y + Math.random() * maxRise; pos[i * 3 + 2] = bz[i];
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    map: dustTexture(), size: opts.size || 8, transparent: true,
    opacity: opts.opacity || 0.5, depthWrite: false, sizeAttenuation: true, color: 0xc9b08a, fog: true }));
  pts.frustumCulled = false;
  scene.add(pts);
  dustSystems.push({ pts, count, bx, bz, baseY: origin.y, maxRise,
    rise: opts.riseSpeed || 1.1, drift: opts.drift || 1.6, opacity: opts.opacity || 0.5,
    seed: Math.random() * 10 });
  return pts;
}

function buildPit(cfg){
  const rx = cfg.rx || 300, rz = cfg.rz || 240;
  const bh = cfg.benchHeight || 12;
  const n  = Math.max(2, Math.round((cfg.depth || 150) / bh));
  const slopeAng = (cfg.slope || 65) * Math.PI / 180;
  const berm = cfg.berm == null ? 7 : cfg.berm;
  const setback = bh / Math.tan(slopeAng);
  const g = new THREE.Group();
  /* 岩石贴图化：tex-bench（水平沉积层理 + 红褐铁矿 + 矿脉，2048px）让岩台阶有矿物颗粒与坡面起伏。
     tint 让同一张贴图派生三档岩层色带（挂图后乘性着色，无贴图时退回兜底色）；
     RingGeometry/CircleGeometry 的 UV 按各自外接矩形归一化 → 同一 repeat 下密度一致。 */
  const orePit = (u, v, color, tint) => texMat(T('bench'), u, v, { color, tint, roughness:0.97, metalness:0.02 });
  const benchMats = [ orePit(20, 20, 0x8b6a4f, 0xcbb096), orePit(20, 20, 0x7f7260, 0xb4a48c), orePit(20, 20, 0x96856d, 0xd8c2ac) ];
  const wallMat = orePit(40, 6, 0x6b5f4e, 0xb09878);  // 坡面：u 沿圆周 / v 沿高度
  wallMat.side = THREE.BackSide;                      // 背向坑心一面看不见，省一半像素
  const roadGeos = [], lineGeos = [];
  let rPrev = rx;
  for (let i = 1; i <= n; i++){
    const y = -i * bh;
    const rNext = rPrev - (i === 1 ? 0 : berm) - setback;
    // 坡面（背向坑心一面看不见，BackSide 省一半像素）；首级坡面上端略露出地表，避免与地面共面闪面
    const wallH = bh + (i === 1 ? 0.5 : 0);
    const wall = new THREE.Mesh(new THREE.CylinderGeometry(rPrev, rNext, wallH, 72, 1, true), wallMat);
    wall.position.y = y + bh / 2 + (i === 1 ? 0.25 : 0);
    wall.castShadow = false; wall.receiveShadow = true;
    g.add(wall);
    // 台阶平台（安全平台）
    const ring = new THREE.Mesh(new THREE.RingGeometry(Math.max(4, rNext - berm), rNext, 72).rotateX(-Math.PI / 2),
      benchMats[i % benchMats.length]);
    ring.position.y = y + 0.03; ring.castShadow = false; ring.receiveShadow = true;
    g.add(ring);
    // 台阶运输道路（环带 + 双黄边线，最后合并成 2 个 Mesh）
    if (cfg.benchRoads !== false){
      const rr = rNext - berm / 2, rw = 5;
      const road = new THREE.RingGeometry(rr - rw, rr + rw, 72).rotateX(-Math.PI / 2);
      road.translate(0, y + 0.07, 0); roadGeos.push(road);
      for (const s of [-1, 1]){
        const ln = new THREE.RingGeometry(rr + s * (rw - 1.2) - 0.5, rr + s * (rw - 1.2) + 0.5, 72).rotateX(-Math.PI / 2);
        ln.translate(0, y + 0.1, 0); lineGeos.push(ln);
      }
      // 台阶安全护栏：平台临空侧连续横杆 + 立柱（每级合并，共 2×N 个 Mesh）
      const railR = rr - rw - 0.8;
      const rail = new THREE.Mesh(new THREE.RingGeometry(railR - 0.18, railR + 0.18, 72).rotateX(-Math.PI / 2),
        mat(0xd8b423, { metalness:0.3, roughness:0.55, envMapIntensity:0.2 }));
      rail.position.y = y + 1.05; rail.castShadow = false; rail.receiveShadow = true; g.add(rail);
      const postGeos = [];
      for (let k = 0; k < 24; k++){
        const a = k / 24 * Math.PI * 2;
        postGeos.push(new THREE.CylinderGeometry(0.1, 0.1, 1.05, 6)
          .translate(Math.cos(a) * railR, y + 0.52, Math.sin(a) * railR));
      }
      g.add(new THREE.Mesh(mergeGeometries(postGeos),
        mat(0xc9a227, { metalness:0.3, roughness:0.55, envMapIntensity:0.2 })));
    }
    rPrev = rNext - berm;
  }
  if (roadGeos.length) g.add(new THREE.Mesh(mergeGeometries(roadGeos), texMat(T('asphalt'), 24, 24, { color:0x3a4046, roughness:0.94, metalness:0.03 })));
  if (lineGeos.length) g.add(new THREE.Mesh(mergeGeometries(lineGeos), mat(0xc2a134, { roughness:0.8 })));
  // 坑底
  const floor = new THREE.Mesh(new THREE.CircleGeometry(Math.max(4, rPrev), 72).rotateX(-Math.PI / 2), orePit(16, 16, 0x8b7c66, 0xbfaf98));
  floor.position.y = -n * bh + 0.03; floor.castShadow = false; floor.receiveShadow = true;
  g.add(floor);
  // 地表境界：crest 安全矮堤（斜坡面 + 顶面，盖住地面洞口边缘）
  const crest = new THREE.Mesh(new THREE.RingGeometry(rx + 2, rx + 5.5, 72).rotateX(-Math.PI / 2),
    orePit(10, 10, 0x7a6e5c, 0xb0a086));
  crest.position.y = 1.15; crest.castShadow = false; crest.receiveShadow = true; g.add(crest);
  const crestWall = new THREE.Mesh(new THREE.CylinderGeometry(rx + 5.5, rx + 2, 1.15, 72, 1, true),
    orePit(30, 1, 0x6e6455, 0xa89478));
  crestWall.material.side = THREE.DoubleSide;
  crestWall.position.y = 0.575; crestWall.castShadow = false; crestWall.receiveShadow = true; g.add(crestWall);
  g.scale.set(1, 1, rz / rx);                       // 圆 → 椭圆（不缩放 y）
  g.userData.noCS = true;                           // 巨构：整片接触阴影不合比例
  g.position.fromArray(cfg.position || [0, 0, 0]);
  return shade(g, false);
}

/* --- 斜坡道（露天矿运输干线）：沿三维折线生成条带路面 + 双黄边线 --- */
function buildRamp(cfg){
  const pts = (cfg.points || []).map(p => new THREE.Vector3().fromArray(p));
  if (pts.length < 2) return new THREE.Group();
  const curve = new THREE.CatmullRomCurve3(pts);
  const W = cfg.width || 24, g = new THREE.Group();
  const len = curve.getLength();
  const N = Math.max(24, Math.round(len / 8));
  const up = new THREE.Vector3(0, 1, 0);
  const ribbon = (halfW, yOff, offset) => {
    const pos = [], uvs = [], idx = [];
    for (let i = 0; i <= N; i++){
      const t = i / N, p = curve.getPointAt(t), tan = curve.getTangentAt(t).normalize();
      const side = new THREE.Vector3().crossVectors(tan, up).normalize();
      const c = p.clone().addScaledVector(side, offset || 0);
      const a = c.clone().addScaledVector(side, -halfW), b = c.clone().addScaledVector(side, halfW);
      pos.push(a.x, a.y + yOff, a.z, b.x, b.y + yOff, b.z);
      uvs.push(0, t * (len / 12), 1, t * (len / 12));
    }
    for (let i = 0; i < N; i++){ const o = i * 2; idx.push(o, o + 1, o + 2, o + 1, o + 3, o + 2); }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(idx); geo.computeVertexNormals();
    return geo;
  };
  const road = new THREE.Mesh(ribbon(W / 2, 0.05, 0),
    texMat(T('asphalt'), 1, 1, { color:0x3a4046, roughness:0.94, metalness:0.03 }));
  road.receiveShadow = true; g.add(road);
  for (const s of [-1, 1]){
    const edge = new THREE.Mesh(ribbon(0.6, 0.1, s * (W / 2 - 1.2)), mat(0xc2a134, { roughness:0.8 }));
    g.add(edge);
  }
  for (const s of [-1, 1]){                            // 轮胎磨痕：重车反复压出的深色带（黄线内侧）
    const rut = new THREE.Mesh(ribbon(1.9, 0.07, s * (W / 2 - 5.6)), mat(0x23262b, { roughness:0.96, metalness:0.02 }));
    rut.receiveShadow = true; g.add(rut);
  }
  g.userData.noCS = true;
  return shade(g, false);
}

/* --- 电铲（矿用单斗挖掘机）：履带底盘 + 回转体 + 起重臂 + 斗杆 + 铲斗，带作业动画 --- */

  const boom = new THREE.Mesh(rbox(2.0, 10.5, 2.6, 0.3), mY);     // 起重臂（前上方 60°）

  const stick = new THREE.Group(); stick.position.set(0, 5.25, 9.09); arm.add(stick);
  const stickBox = new THREE.Mesh(rbox(1.7, 8.0, 2.2, 0.25), mY); // 斗杆（前下方）
  stickBox.rotation.x = 2.36; stickBox.position.set(0, 4.0, 0); stick.add(stickBox);
  const bucket = new THREE.Group(); bucket.position.set(0, -5.66, 5.66); stick.add(bucket);
  const tubMat = new THREE.MeshStandardMaterial({ color:0x6a737d, metalness:0.72, roughness:0.38, side:THREE.DoubleSide, envMapIntensity:0.50 });
  PBR_MATS.push(tubMat);
  const tub = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 1.15, 2.9, 6, 1, true), tubMat);  // 铲斗
  tub.rotation.x = Math.PI / 2 - 0.35; tub.position.set(0, 0.2, 0.5); bucket.add(tub);
  for (const tx of [-1.1, 0, 1.1]){                                // 斗齿
    const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.9, 6), mD);
    tooth.position.set(tx, -0.9, 1.7); tooth.rotation.x = Math.PI - 0.5; bucket.add(tooth);
  }
  swing.add(rodBetween(new THREE.Vector3(0, 5.4, -1.6), new THREE.Vector3(0, 5.0, 6.2), 0.42, mY)); // 大臂油缸
  arm.add(rodBetween(new THREE.Vector3(0, 8.6, 3.4), new THREE.Vector3(0, 8.4, 5.6), 0.38, mY));    // 斗杆油缸
  if (cfg.scale) g.scale.setScalar(cfg.scale);
  g.position.fromArray(cfg.position || [0, 0, 0]);
  if (cfg.rotation) g.rotation.y = cfg.rotation * Math.PI / 180;
  movers.push({ kind:'excavator', swing, stick, bucket,
    baseSwing: swing.rotation.y, baseStick: stick.rotation.x, baseBucket: bucket.rotation.x,
    phase: (cfg.phase || 0) * Math.PI });
  return shade(g);
}

/* --- 矿用自卸卡车（刚性矿卡）：六轮（前小后大双轴）+ 自卸车厢 + 装载状态 --- */

/* --- 排土场：多层截锥台阶 + 顶部排土线亮色岩面 --- */
function buildDump(cfg){
  const R = cfg.radius || 130, H = cfg.height || 46, steps = cfg.steps || 4;
  const g = new THREE.Group();
  const rocks = [ texMat(T('bench'), 8, 3, { color:0x7d7263, tint:0xc0a888, roughness:0.98, metalness:0.02 }),
                  texMat(T('bench'), 8, 3, { color:0x6e6455, tint:0xa89070, roughness:0.98, metalness:0.02 }),
                  texMat(T('bench'), 8, 3, { color:0x8b7f6d, tint:0xc8b494, roughness:0.98, metalness:0.02 }) ];
  const h = H / steps;
  let r = R;
  for (let i = 0; i < steps; i++){
    const r2 = R * (1 - (i + 1) / (steps + 0.6));
    const step = new THREE.Mesh(new THREE.CylinderGeometry(r2, r, h, 30), rocks[i % rocks.length]);
    step.position.y = (i + 0.5) * h; step.castShadow = true; step.receiveShadow = true; g.add(step);
    const edge = new THREE.Mesh(new THREE.RingGeometry(r2, r, 30).rotateX(-Math.PI / 2),
      texMat(T('bench'), 7, 7, { color:0x9a8d78, tint:0xd4c0a0, roughness:0.98, metalness:0.02 }));  // 新排土线（亮一档）
    edge.position.y = (i + 1) * h + 0.04; g.add(edge);
    r = r2;
  }
  const top = new THREE.Mesh(new THREE.CircleGeometry(r, 30).rotateX(-Math.PI / 2), rocks[2]);
  top.position.y = H + 0.03; g.add(top);
  g.userData.noCS = true;
  g.position.fromArray(cfg.position || [0, 0, 0]);
  if (cfg.dust !== false){                       // 扬尘：排土线卸载粉尘（大团、缓升）
    const dp = new THREE.Vector3().fromArray(cfg.position || [0, 0, 0]);
    makeDust(new THREE.Vector3(dp.x, dp.y + H * 0.9, dp.z),
      { count: 54, spread: R * 0.55, rise: 24, size: 18, opacity: 0.5, riseSpeed: 0.85, drift: 1.2 });
  }
  return shade(g);
}

/* --- 高杆灯塔：灯杆 + 四联灯头（夜间自发光，矿坑夜间照明） --- */
function buildLightTower(cfg){
  const H = cfg.height || 28, g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.6, 1.2, 12), mat(0x6e7680, { metalness:0.4, roughness:0.6 }));
  base.position.y = 0.6; g.add(base);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.85, H, 10), mat(0x9aa4ad, { metalness:0.5, roughness:0.5, envMapIntensity:0.2 }));
  mast.position.y = H / 2 + 1.2; g.add(mast);
  const head = new THREE.Group(); head.position.y = H + 1.2; g.add(head);
  const frame = new THREE.Mesh(rbox(4.6, 0.5, 1.4, 0.15), mat(0x3a3f45, { metalness:0.5 }));
  head.add(frame);
  for (const sx of [-1.5, -0.5, 0.5, 1.5]){
    const lamp = new THREE.Mesh(rbox(0.8, 0.5, 1.0, 0.1),
      mat(0xfff3d0, { emissive:0xffe9a8, emissiveIntensity:0.85, roughness:0.4 }));
    lamp.position.set(sx, -0.4, 0); lamp.rotation.x = 0.5; head.add(lamp);
  }
  g.position.fromArray(cfg.position || [0, 0, 0]);
  if (cfg.rotation) g.rotation.y = (cfg.rotation || 0) * Math.PI / 180;
  return shade(g);
}

/* --- 推土机：履带 + 车体 + 驾驶室 + 直推铲（可调倾角）+ 刀齿 + 推臂 --- */
function buildDozer(cfg){
  const g = new THREE.Group();
  const mY = mat(cfg.color || 0xe3a92f, { metalness:0.25, roughness:0.6, envMapIntensity:0.3 });
  const mD = texMat(T('track'), 8, 3, { color:0x2c333c, metalness:0.2, roughness:0.9, envMapIntensity:0.12 });
  const mG = glassMat();
  for (const sz of [1, -1]){
    const tr = new THREE.Mesh(rbox(1.5, 1.7, 7.0, 0.45), mD);
    tr.position.set(sz * 1.55, 0.95, -0.3); g.add(tr);
  }
  const body = new THREE.Mesh(rbox(3.2, 2.2, 6.0, 0.4), mY);
  body.position.y = 2.6; g.add(body);
  const cab = new THREE.Mesh(rbox(2.7, 2.5, 2.9, 0.35), mY);
  cab.position.set(0, 4.8, -0.6); g.add(cab);
  const glass = new THREE.Mesh(rbox(2.3, 1.4, 2.5, 0.2), mG);
  glass.position.set(0, 5.2, -0.6); g.add(glass);
  const blade = new THREE.Group(); blade.position.set(0, 1.6, 3.6); g.add(blade);
  const plate = new THREE.Mesh(rbox(7.2, 3.4, 0.55, 0.2), mD);
  plate.position.set(0, 1.4, 0.1);
  plate.rotation.x = (cfg.blade == null ? 0.85 : cfg.blade) * Math.PI / 180;
  blade.add(plate);
  for (const tx of [-2.6, -1.3, 0, 1.3, 2.6]){
    const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.7, 5), mD);
    tooth.position.set(tx, -0.5, 0.3); tooth.rotation.x = Math.PI; blade.add(tooth);
  }
  for (const sz of [1, -1]){
    g.add(rodBetween(new THREE.Vector3(sz * 1.5, 3.4, 1.6), new THREE.Vector3(sz * 2.4, 2.6, 3.5), 0.32, mY));
  }
  g.position.fromArray(cfg.position || [0, 0, 0]);
  if (cfg.rotation) g.rotation.y = cfg.rotation * Math.PI / 180;
  return shade(g);
}

/* --- 沉淀池（矿坑水 / 洗车水处理）：围堰 + 半透明水面 --- */
function buildPond(cfg){
  const r = cfg.radius || 40, g = new THREE.Group();
  const levee = new THREE.Mesh(new THREE.RingGeometry(r, r + 6, 40).rotateX(-Math.PI / 2),
    texMat(T('ground'), 4, 4, { color:0x6b6152, roughness:0.98, metalness:0.02 }));
  levee.position.y = 1.6; g.add(levee);
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(r + 6, r + 6, 1.6, 40, 1, true),
    texMat(T('ground'), 4, 1, { color:0x5d5446, roughness:0.98, metalness:0.02, side:THREE.DoubleSide }));
  wall.position.y = 0.8; g.add(wall);
  const mud = new THREE.Mesh(new THREE.CircleGeometry(r - 1, 40).rotateX(-Math.PI / 2),
    texMat(T('ground'), 6, 6, { color:0x4a443a, roughness:0.99 }));
  mud.position.y = 0.25; g.add(mud);
  const water = new THREE.Mesh(new THREE.CircleGeometry(r - 1, 40).rotateX(-Math.PI / 2), glassMat());
  water.material.color.set(0x2f6f8a); water.material.opacity = 0.72;
  water.position.y = 1.15; g.add(water);
  g.userData.noCS = true;
  g.position.fromArray(cfg.position || [0, 0, 0]);
  return shade(g, false);
}

/* 确定性伪随机：同一 seed 每次刷新结果一致（避免配景「每次打开都不一样」） */
function seeded(seed){ let s = (seed || 1) % 233280; return () => { s = (s*9301 + 49297) % 233280; return s/233280; }; }

/* --- 阴影相机按场景实际包围盒收紧：固定 ±300m/2048 对 600m 场地 = 0.29m/像素，边缘全糊 --- */
function tuneShadowCamera(){
  const box = new THREE.Box3();
  for (const r of assets.values()) if (!r.ambient) box.expandByObject(r.object3d);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3());
  const radius = box.getSize(new THREE.Vector3()).length() * 0.5;
  const dist = Math.max(420, radius * 2.2);
  sun.position.copy(c).addScaledVector(sunDirVec(), dist);
  sun.target.position.copy(c); sun.target.updateMatrixWorld(); scene.add(sun.target);
  const s = Math.max(140, radius * 1.05);
  const cam = sun.shadow.camera;
  cam.left = -s; cam.right = s; cam.top = s; cam.bottom = -s;
  cam.near = Math.max(1, dist - s * 1.6); cam.far = dist + s * 1.6;
  cam.updateProjectionMatrix();
}
tuneShadowCamera();

const manager = new THREE.LoadingManager();
manager.onProgress = (u, loaded, total) => setProgress(total ? loaded/total : 1);
const gltfLoader = new GLTFLoader(manager);
try {
  // 必须把共享 manager 传给 DRACOLoader：decoder 文件由 FileLoader 加载，
  // 而 FileLoader 走 manager.resolveURL —— URL modifier 才能把请求改写为 data URI
  const draco = new DRACOLoader(manager);
  const EMBED_DRACO = window.__TWIN_DRACO__;   // scaffold 在检测到 Draco 压缩模型时注入
  if (EMBED_DRACO) {
    manager.setURLModifier((url) => {
      if (url.indexOf('draco_wasm_wrapper.js') >= 0) return EMBED_DRACO.wrapper;
      if (url.indexOf('draco_decoder.wasm') >= 0)   return EMBED_DRACO.wasm;
      return url;                                  // 其余请求（含 glb 的 data URI）原样放行
    });
  } else {
    draco.setDecoderPath((window.__TWIN_CDN__ || 'https://unpkg.com/three@0.160.0/') + 'examples/jsm/libs/draco/');
  }
  gltfLoader.setDRACOLoader(draco);
} catch (e) { /* DRACO 不可用时静默降级为普通 GLTF */ }

const modelTasks = (CONFIG.models || []).map(m => new Promise(res => {
  if (!m.url){ res(); return; }
  /* v0.11：模型去重查表。同一 GLB 常被引用多次（集装箱 ×14），内联时只存一份，
     加载前按原路径还原成 data URI（无映射时保持原样，--no-inline 模式照常工作）*/
  if (window.__TWIN_MODEL_URI__ && window.__TWIN_MODEL_URI__[m.url]) m.url = window.__TWIN_MODEL_URI__[m.url];
  const onOk = (gltf) => {
      const obj = gltf.scene;
      obj.userData.glbRoot = true;                    // v0.11：整棵 GLB 子树豁免距离剔除
      obj.position.fromArray(m.position || [0,0,0]);
      obj.rotation.y = (m.rotation || 0) * Math.PI/180;
      obj.scale.setScalar(m.scale || 1);
      shade(obj);
      /* GLB 材质并入环境反射登记表。不做这步的话，GLTFLoader 自建的材质拿不到
         skyEnvMap —— 真实模型在白天场景里会比周围程序化资产暗一截（实测储罐黑成一坨，
         因为程序化资产都有 0.15 的 IBL，模型却是"裸"的）。envMapIntensity 保留 GLTF
         自带值；applyEnvMaps 会把默认 1 压到 0.15 与全场统一。 */
      obj.traverse(o => {
        if (!o.isMesh || !o.material) return;
        const list = Array.isArray(o.material) ? o.material : [o.material];
        for (const mm of list){
          if ((!mm.isMeshStandardMaterial && !mm.isMeshPhysicalMaterial) || PBR_MATS.includes(mm)) continue;
          PBR_MATS.push(mm);
          if (skyEnvMap){ mm.envMap = skyEnvMap; mm.needsUpdate = true; }
        }
      });
      attachAsset(m, obj);
      applyStatus(m.id, m.status || 'normal');
      res();
  };
  const onErr = () => { console.warn('[twin] GLTF 加载失败，回退程序化占位：' + m.url);
      const fb = Object.assign({}, m.fallback || { type:'box', size:[6,10,4] }, { id:m.id, name:m.name, status:m.status, position:m.position });
      attachAsset(m, buildBox(fb)); applyStatus(m.id, m.status || 'normal'); res(); };
  if (m.url.startsWith('data:')) {
    /* 严格 CSP 下 connect-src 会拦 data: 的 fetch/XHR —— 直接解码后走
       gltfLoader.parse()，模型加载完全不经过网络栈（离线 + 严格 CSP 通吃） */
    try {
      const b64 = m.url.slice(m.url.indexOf(',') + 1);
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      gltfLoader.parse(bytes.buffer, '', onOk, onErr);
    } catch (e) { onErr(); }
  } else {
    gltfLoader.load(m.url, onOk, undefined, onErr);
  }
}));
Promise.all(modelTasks).then(() => { tuneShadowCamera(); refreshAlerts(); setProgress(1); });

/* =========================================================================
 * 7. 状态高亮：emissive 着色 + 告警呼吸
 * ========================================================================= */
function applyStatus(id, status){
  const rec = assets.get(id); if (!rec) return;
  rec.cfg.status = status;
  const c = new THREE.Color(st(status).color);
  rec.object3d.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const list = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of list){
      if (!m.emissive) continue;
      if (m.userData.baseEmissive === undefined) m.userData.baseEmissive = m.emissive.getHex();
      m.emissive.copy(c);
      m.emissiveIntensity = (status === 'normal') ? 0.0 : (status === 'off' ? 0.0 : 0.45);
    }
  });
  if (rec.tagEl){
    const s = st(status);
    rec.tagEl.innerHTML = '<span>' + (rec.cfg.name || rec.cfg.id) + '</span>' +
      '<span class="s ' + s.cls + '">' + s.text + '</span>';
    rec.tagEl.classList.toggle('alarm', status === 'alarm');
  }
  renderDeviceList();
}

/* =========================================================================
 * 8. 点击拾取 / 悬浮提示 / 选中框
 * ========================================================================= */
const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
let hovered = null;                                    // selected / helper 已在第 3 节提前声明
const tip = document.getElementById('tip');

function pickAt(clientX, clientY){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(pointer, camera);
  const hits = ray.intersectObjects(pickables, false);
  return hits.length ? hits[0] : null;
}
function setHover(mesh){
  if (hovered === mesh) return;
  if (hovered){
    const m = hovered.material;
    if (m && m.emissive && hovered.userData.hoverSaved !== undefined) m.emissiveIntensity = hovered.userData.hoverSaved;
  }
  hovered = mesh;
  if (mesh){
    const m = mesh.material;
    if (m && m.emissive){ mesh.userData.hoverSaved = m.emissiveIntensity; m.emissiveIntensity = 0.9; }
    document.body.style.cursor = 'pointer';
  } else document.body.style.cursor = '';
}
renderer.domElement.addEventListener('pointermove', (e) => {
  if (patrol.playing) return;
  const hit = pickAt(e.clientX, e.clientY);
  setHover(hit ? hit.object : null);
  if (hit){
    const id = hit.object.userData.assetId, rec = assets.get(id);
    if (rec){
      tip.style.display = 'block';
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top  = (e.clientY + 14) + 'px';
      const ms = (rec.cfg.metrics || []).slice(0,3).map(x => x.label + '：' + x.value).join('<br/>');
      tip.innerHTML = '<b>' + (rec.cfg.name || id) + '</b> <span class="m">' + st(rec.cfg.status).text + '</span>' +
        (ms ? '<div class="m" style="margin-top:4px">' + ms + '</div>' : '');
    }
  } else tip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => { tip.style.display = 'none'; setHover(null); });
renderer.domElement.addEventListener('click', (e) => {
  const hit = pickAt(e.clientX, e.clientY);
  if (hit) selectAsset(hit.object.userData.assetId, true); else selectAsset(null);
});

function selectAsset(id, fly = false){
  if (helper){ scene.remove(helper); helper.geometry.dispose(); helper = null; }
  selected = id; renderDeviceList();
  const box = document.getElementById('ui-info');
  if (!id || !assets.has(id)){
    box.innerHTML = '<div class="empty">点击场景中的设备<br/>或左侧清单查看详情</div>';
    return;
  }
  const rec = assets.get(id), cfg = rec.cfg, s = st(cfg.status);
  let html = '<div style="font-size:14px;font-weight:700;color:#fff;margin-bottom:2px">' + (cfg.name || id) + '</div>' +
    '<div style="font-size:11px;color:var(--txt-3);margin-bottom:8px">' + id + ' · ' + (cfg.type || '—') + '</div>' +
    '<div class="prop"><span class="k">状态</span><span class="v" style="color:' + s.css + '">' + s.text + '</span></div>' +
    '<div class="prop"><span class="k">坐标</span><span class="v">' +
      (cfg.position ? cfg.position.map(v => v.toFixed(1)).join(', ') : '—') + '</span></div>';
  for (const m of (cfg.metrics || [])){
    html += '<div class="mt"><span style="color:var(--txt-2)">' + m.label + '</span>' +
      '<span class="bar"><i style="width:' + (m.pct == null ? 100 : Math.max(2, Math.min(100, m.pct))) + '%"></i></span>' +
      '<span style="color:#fff">' + m.value + '</span></div>';
  }
  const als = (CONFIG.alerts || []).filter(a => a.deviceId === id);
  if (als.length){
    html += '<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px">';
    for (const a of als){
      html += '<div style="font-size:12px;color:' + (a.level === 'critical' ? 'var(--crit)' : 'var(--warn)') +
        '">● ' + a.time + '　' + a.text + '</div>';
    }
    html += '</div>';
  }
  box.innerHTML = html;
  helper = new THREE.BoxHelper(rec.object3d, 0x00e5ff);
  scene.add(helper);
  if (fly) flyTo(rec.object3d);
}
document.getElementById('ui-close').onclick = () => selectAsset(null);

function flyTo(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size = Math.max(box.getSize(new THREE.Vector3()).length(), 20);
  const dir = new THREE.Vector3().subVectors(camera.position, center).normalize();
  tween = { from:camera.position.clone(), to:center.clone().add(dir.multiplyScalar(size*1.5)),
            tFrom:controls.target.clone(), tTo:center, t:0, dur:0.9 };
}

/* =========================================================================
 * 9. 漫游巡检：路径曲线 + 播放控制
 * ========================================================================= */
const patrol = { playing:false, t:0, speed:1, curve:null, target:new THREE.Vector3() };
if (CONFIG.patrol && CONFIG.patrol.enabled && (CONFIG.patrol.waypoints || []).length > 1){
  patrol.curve = new THREE.CatmullRomCurve3(
    CONFIG.patrol.waypoints.map(p => new THREE.Vector3(p[0], p[1] != null ? p[1] : (CONFIG.patrol.height || 40), p[2])), true);
}
function updatePatrol(dt){
  if (!patrol.playing || !patrol.curve) return;
  patrol.t += dt * patrol.speed / Math.max(6, CONFIG.patrol.duration);
  if (patrol.t > 1){ if (CONFIG.patrol.loop) patrol.t -= 1; else { stopPatrol(); return; } }
  camera.position.copy(patrol.curve.getPointAt(patrol.t));
  const look = patrol.curve.getPointAt((patrol.t + 0.02) % 1).clone();
  look.lerp(patrol.target, 0.55);
  camera.lookAt(look);
}
function startPatrol(){
  if (!patrol.curve) return;
  patrol.playing = true; controls.enabled = false; tip.style.display = 'none';
  patrol.target.set(0, 8, 0);
  document.getElementById('btn-play').classList.add('on');
  document.getElementById('btn-play').textContent = '❚❚ 停止巡检';
}
function stopPatrol(){
  patrol.playing = false; controls.enabled = true;
  controls.target.copy(patrol.target.lengthSq() ? patrol.target : new THREE.Vector3().fromArray(CONFIG.camera.target));
  controls.update();
  const b = document.getElementById('btn-play');
  b.classList.remove('on'); b.textContent = '▶ 巡检漫游';
}
function resetCamera(){
  stopPatrol(); patrol.t = 0;
  camera.position.fromArray(CONFIG.camera.position);
  controls.target.fromArray(CONFIG.camera.target);
  controls.update();
}
function fitView(){
  const box = new THREE.Box3();
  for (const rec of assets.values()){ if (rec.ambient) continue; box.expandByObject(rec.object3d); }
  if (box.isEmpty()) return;
  const center = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(center);
  camera.position.copy(center.clone().add(new THREE.Vector3(0.6, 0.55, 0.9).normalize().multiplyScalar(size*0.85)));
  controls.update();
}

/* =========================================================================
 * 10. HUD 渲染 + 交互按钮 + 数据刷新（Mock / HTTP）
 * ========================================================================= */
function renderKpis(){
  const el = document.getElementById('ui-kpis');
  el.innerHTML = (CONFIG.kpis || []).map(k =>
    '<div class="kpi"><div class="v">' + k.value + '<small>' + (k.unit || '') + '</small></div>' +
    '<div class="l">' + k.label + '</div></div>').join('');
}
function renderDeviceList(){
  const el = document.getElementById('ui-devs');
  const rows = [];
  for (const rec of assets.values()){
    if (rec.ambient) continue;               // 环境配景不进设备清单
    const s = st(rec.cfg.status);
    rows.push('<div class="dev' + (selected === rec.cfg.id ? ' on' : '') + '" data-id="' + rec.cfg.id + '">' +
      '<span class="dot" style="background:' + s.css + '"></span>' +
      '<span class="nm">' + (rec.cfg.name || rec.cfg.id) + '</span>' +
      '<span class="st">' + s.text + '</span></div>');
  }
  el.innerHTML = rows.join('');
  el.querySelectorAll('.dev').forEach(d => d.onclick = () => selectAsset(d.dataset.id, true));
}
function renderTop(){
  document.getElementById('ui-title').textContent = CONFIG.meta.title;
  document.getElementById('ui-sub').textContent   = CONFIG.meta.subtitle;
  document.getElementById('ui-scene').textContent = '场景：' + CONFIG.sceneType;
  const m = document.getElementById('ui-mode');
  m.textContent = '数据模式：' + (CONFIG.dataSource.mode === 'http' ? '接口' : 'Mock');
  m.className = 'chip ' + (CONFIG.dataSource.mode === 'http' ? 'live' : 'mock');
  document.getElementById('ui-count').textContent = '资产：' + countAssets();
}
renderKpis(); renderDeviceList(); renderTop();

/* alarmOn / wireOn / labelOn 已在第 3 节随 CONFIG 初始化 */
document.getElementById('btn-play').onclick  = () => patrol.playing ? stopPatrol() : startPatrol();
document.getElementById('btn-reset').onclick = resetCamera;
document.getElementById('btn-fit').onclick   = fitView;
document.getElementById('btn-label').onclick = (e) => {
  labelOn = !labelOn; e.target.classList.toggle('on', labelOn);
  for (const rec of assets.values()) if (rec.tagObj) rec.tagObj.visible = labelOn;
};
document.getElementById('btn-alarm').onclick = (e) => {
  alarmOn = !alarmOn; e.target.classList.toggle('on', alarmOn); alertGroup.visible = alarmOn;
};
document.querySelectorAll('.wbtn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.wbtn').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  applyWeather(b.dataset.w);                 // 白天/黄昏/夜晚 走真实天空贴图，科技 走深色渐变
});

document.getElementById('btn-wire').onclick = (e) => {
  wireOn = !wireOn; e.target.classList.toggle('on', wireOn);
  scene.traverse(o => { if (o.isMesh && o.material && 'wireframe' in o.material) o.material.wireframe = wireOn; });
};
const sp = document.getElementById('ui-speed');
sp.oninput = () => { patrol.speed = parseFloat(sp.value); document.getElementById('ui-speed-v').textContent = patrol.speed + '×'; };

/* --- 数据层：Mock 优先，接口可替换 --- */
function mockTick(){
  for (const k of (CONFIG.kpis || [])){
    const num = parseFloat(String(k.value).replace(/,/g, ''));
    if (!isNaN(num)){
      const next = Math.max(0, num * (1 + (Math.random() - 0.48) * 0.06));
      k.value = (num % 1 === 0 ? Math.round(next) : next.toFixed(1)).toLocaleString('en-US');
    }
  }
  renderKpis();
  const ids = [...assets.keys()];
  if (ids.length){
    const id = ids[Math.floor(Math.random()*ids.length)];
    const pick = Math.random();
    applyStatus(id, pick > 0.9 ? 'warn' : (pick > 0.985 ? 'alarm' : 'normal'));
  }
}
async function pullRemote(){
  const ds = CONFIG.dataSource;
  if (ds.mode !== 'http') return;
  try {
    if (ds.http.metrics){
      const r = await fetch(ds.http.metrics); const j = await r.json();
      if (Array.isArray(j.kpis)) { CONFIG.kpis = j.kpis; renderKpis(); }
    }
    if (ds.http.alerts){
      const r = await fetch(ds.http.alerts); const j = await r.json();
      if (Array.isArray(j.alerts)) { CONFIG.alerts = j.alerts; refreshAlerts(); renderDeviceList(); }
    }
  } catch (err){ console.warn('[twin] 接口拉取失败，保持 Mock：', err); mockTick(); }
}
let timer = null;
function startTimer(){
  if (timer) clearInterval(timer);
  const ms = CONFIG.dataSource.refreshMs || 8000;
  timer = setInterval(() => { CONFIG.dataSource.mode === 'http' ? pullRemote() : mockTick(); }, ms);
}
startTimer();

/* =========================================================================
 * 11. 主循环 + 自适应 + 生命周期
 * ========================================================================= */
const clock = new THREE.Clock();
let frames = 0, fpsT = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  if (document.hidden) return;                       // 后台暂停，别烧显卡

  if (tween){
    tween.t += dt / tween.dur;
    const k = Math.min(1, tween.t), e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(tween.from, tween.to, e);
    controls.target.lerpVectors(tween.tFrom, tween.tTo, e);
    if (k >= 1) tween = null;
  }
  updatePatrol(dt);
  for (const mv of movers){
    if (mv.kind === 'flow') mv.tex.offset.x -= dt * mv.speed;
    else if (mv.kind === 'vehicle'){
      mv.t += dt * mv.speed;
      if (mv.t > 1) mv.t -= 1;
      const p = mv.curve.getPointAt(mv.t), q = mv.curve.getPointAt((mv.t + 0.01) % 1);
      mv.obj.position.copy(p);
      mv.obj.lookAt(q.x, mv.obj.position.y, q.z);
      mv.obj.rotation.y += Math.PI/2;                // 车头（+X）对齐行进方向
    }
    else if (mv.kind === 'excavator'){               // 电铲作业：回转 + 斗杆/铲斗微动
      const s = Math.sin(t * 0.22 + mv.phase);
      mv.swing.rotation.y = mv.baseSwing + s * 0.42;
      mv.stick.rotation.x = mv.baseStick + s * 0.16;
      mv.bucket.rotation.x = mv.baseBucket + Math.sin(t * 0.22 + mv.phase + 1.5) * 0.26;
    }
    else if (mv.kind === 'drill'){                   // 钻机穿孔：钻架高频微振动
      mv.mast.position.y = mv.baseY + Math.sin(t * 26 + mv.phase) * 0.045;
      mv.mast.rotation.x = mv.baseRX + Math.sin(t * 26 + mv.phase) * 0.004;
    }
  }
  for (const ds of dustSystems){                       // 扬尘：缓慢上浮 + 横向漂移 + 寿命循环
    const pos = ds.pts.geometry.attributes.position;
    for (let i = 0; i < ds.count; i++){
      let y = pos.getY(i) + ds.rise * dt;
      let x = pos.getX(i) + Math.sin(t * 0.6 + ds.seed + i * 0.7) * ds.drift * dt;
      let z = pos.getZ(i) + Math.cos(t * 0.45 + ds.seed * 1.3 + i * 0.9) * ds.drift * dt;
      if (y - ds.baseY > ds.maxRise){ y = ds.baseY; x = ds.bx[i]; z = ds.bz[i]; }
      pos.setXYZ(i, x, y, z);
    }
    pos.needsUpdate = true;
    ds.pts.material.opacity = ds.opacity * (curWeather === 'night' ? 0.4 : 1);
  }
  for (const r of alertRings){
    r.t += dt * 0.75; if (r.t > 1) r.t -= 1;
    r.ring.scale.setScalar(1 + r.t * 1.9);
    r.ring.material.opacity = 0.75 * (1 - r.t);
  }
  for (const rec of assets.values()){
    if (rec.cfg.status === 'alarm'){
      rec.object3d.traverse(o => {
        if (o.isMesh && o.material && o.material.emissive) o.material.emissiveIntensity = 0.35 + Math.abs(Math.sin(t*3)) * 0.55;
      });
    }
  }
  if (helper && selected && assets.has(selected)) helper.update();
  controls.update();
  /* v0.11 集显三件套：距离剔除 → 静态阴影按需刷新 → 掉帧自动降档 */
  tickCull();
  tickStaticShadow(dt);
  governorTick(dt);
  renderer.info.reset();                              // 手动托管：统计覆盖本帧全部 pass
  if (composer) composer.render(dt); else renderer.render(scene, camera);
  labelRenderer.render(scene, camera);

  frames++; fpsT += dt;
  if (fpsT >= 0.5){
    const fpsNow = Math.round(frames / fpsT);
    document.getElementById('ui-perf').textContent =
      'FPS ' + fpsNow + ' · 绘制 ' + renderer.info.render.calls + ' · 三角面 ' +
      (renderer.info.render.triangles / 1000).toFixed(0) + 'k';
    const chip = document.getElementById('ui-perf');
    chip.style.color = fpsNow < 25 ? 'var(--crit)' : (fpsNow < 45 ? 'var(--warn)' : 'var(--txt-3)');
    frames = 0; fpsT = 0;
  }
}
animate();

let rzTimer = null;
function onResize(){
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => {
    const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
    camera.aspect = w/h; camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.performance.maxPixelRatio));
    renderer.setSize(w, h);
    labelRenderer.setSize(w, h);
    if (composer){                                    // 后处理链必须跟着 resize，否则画面被拉伸/裁切
      composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.performance.maxPixelRatio));
      composer.setSize(w, h);
    }
  }, 100);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
if (window.ResizeObserver) new ResizeObserver(onResize).observe(stage);

let inited = false;
function finishInit(){                                // 幂等：装配完成 / 兜底超时 都只会执行一次
  if (inited) return; inited = true;
  if (CONFIG.camera.autoFit !== false) fitView();
  setupPostFX();                                      // 装配完成后再建链：GTAO 尺寸与场景尺度都对得上
  buildCullList();                                    // v0.11：装配完才能扫到全部小零件
  updateQualityChip(GPU.tier && CONFIG.performance.quality === 'auto' ? '自动' : '');
  bindQualityUI();
  renderDeviceList();
  document.getElementById('loading').classList.add('off');
  if (CONFIG.patrol && CONFIG.patrol.autoStart) startPatrol();
}

/* v0.11：档位切换交互（点击 chip 循环 / P 键 / 右键回自动） */
function bindQualityUI(){
  const el = document.getElementById('ui-tier');
  if (!el) return;
  el.addEventListener('click', () => {
    const i = TIER_ORDER.indexOf(CURRENT_QUALITY);
    const next = TIER_ORDER[(i + 1) % TIER_ORDER.length];
    CONFIG.performance.quality = next;
    applyQualityRuntime(next, '');
  });
  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    CONFIG.performance.quality = 'auto';
    applyQualityRuntime(resolveQuality('auto'), '自动');
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'p' || e.key === 'P'){
      const i = TIER_ORDER.indexOf(CURRENT_QUALITY);
      const next = TIER_ORDER[(i + 1) % TIER_ORDER.length];
      CONFIG.performance.quality = next;
      applyQualityRuntime(next, '');
    }
  });
}
function setProgress(p){
  document.getElementById('ldbar').style.width = Math.round(p*100) + '%';
  document.getElementById('ldtxt').textContent = Math.round(p*100) + '%';
  if (p >= 1) setTimeout(finishInit, 260);
}
setTimeout(() => setProgress(1), 1200);              // 无外部模型 / 网络慢时兜底放行

/* 控制台调试入口：tw.CONFIG / tw.select('TANK-01') / tw.status('TANK-01','alarm') */
window.tw = { CONFIG, scene, camera, renderer, controls, assets, selectAsset, applyStatus, applyWeather, fitView, refreshAlerts,
  /* v0.3：后处理开关与实时调参。tw.setPostFX(false) 可一键对比"开/关 AO"的真实感差距 */
  setPostFX,
  setAO: (radius, intensity) => {
    if (!gtaoPass) return false;
    if (radius != null) gtaoPass.gtaoMaterial.uniforms.radius.value = radius;
    if (intensity != null) gtaoPass.blendIntensity = intensity;
    return true;
  },
  setBloom: (s, threshold) => {
    if (!bloomPass) return false;
    if (s != null) bloomPass.strength = s;
    if (threshold != null) bloomPass.threshold = threshold;
    return true;
  },
  setSSR: (intensity) => { if (!ssrPass) return false; if (intensity != null) ssrPass.opacity = intensity; return true; },
  postfx: () => ({ on: !!composer, ao: !!gtaoPass, bloom: !!bloomPass, smaa: !!smaaPass, ssr: !!ssrPass }),
  /* v0.11：画质档位（集显适配）。tw.setQuality('low') / tw.quality() 查当前状态
     档位顺序 potato < low < medium < high < ultra，运行时可来回切（贴图分辨率除外）*/
  setQuality: (name) => { CONFIG.performance.quality = name; return applyQualityRuntime(name, ''); },
  quality: () => ({ current: CURRENT_QUALITY, label: QUALITY_TIERS[CURRENT_QUALITY].label,
                    list: TIER_ORDER.slice(), gpu: GPU, pixelRatio: renderer.getPixelRatio(),
                    autoQuality: !!CONFIG.performance.autoQuality, drops: GOVERNOR.drops,
                    cullables: CULLABLES.length,
                    culled: CULLABLES.reduce((n, c) => n + (c.vis ? 0 : 1), 0) }),
  setAutoQuality: (on) => { CONFIG.performance.autoQuality = !!on; GOVERNOR.warmup = 0; GOVERNOR.ring.length = 0; return !!on; },
  rebuildCull: () => { buildCullList(); return CULLABLES.length; }
};
</script>
